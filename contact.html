<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Akihiro Kokufukata</title>
<script>
const SETTINGS = {
  LIVE_SCHEDULE_URL: 'index.html',
  BIO_URL: '',
  MUSIC_URL: '',
  CONTACT_URL: 'contact.html',
  EMAIL_ADDRESS: 'akihirokokufukatamusic@gmail.com',
  INSTAGRAM_URL: 'https://www.instagram.com/akihiro_kokufukata?stkn=cmM5N2Z5cmUzcHl4'
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3eee5;--card:#f7f2e9;--ink:#181313;--muted:#756b66;--crimson:#98182a;--crimson-dark:#76101f;--line:#cfc2b6;--serif:"Cormorant Garamond",Georgia,serif;--jp:"Noto Serif JP",serif;--sans:"Space Grotesk",Arial,sans-serif}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,a,input,textarea{-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:1100px;margin:0 auto;padding:58px 30px 90px}
header{position:relative;padding:25px 10px 70px}.name-wrap{display:inline-block}
.artist-name{margin:0;max-width:640px;font-family:var(--serif);font-size:clamp(58px,8.5vw,100px);font-weight:600;line-height:.82;letter-spacing:-3px}
.artist-name span{display:block}.name-line{display:block;width:100%;height:1.5px;margin-top:24px;background:var(--crimson)}
.artist-role{margin-top:19px;color:var(--crimson);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:5px;text-transform:uppercase}
.menu-toggle{position:absolute;top:42px;right:32px;z-index:30;width:46px;height:38px;padding:5px 3px;border:0;background:transparent;cursor:pointer}
.menu-toggle span{display:block;width:100%;height:2px;margin:7px 0;background:var(--crimson);transition:transform .25s ease,opacity .2s ease}
.menu-toggle.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}.menu-toggle.open span:nth-child(2){opacity:0}.menu-toggle.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.site-menu{position:fixed;top:0;right:0;z-index:25;width:min(360px,84vw);height:100vh;padding:125px 42px 40px;background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s ease;box-shadow:-12px 0 35px rgba(24,19,19,.08)}
.site-menu.open{transform:translateX(0)}.site-menu a{display:block;padding:20px 0;border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--serif);font-size:30px;font-weight:600;text-decoration:none}
.site-menu a:hover,.site-menu a.current{color:var(--crimson)}
.menu-backdrop{position:fixed;inset:0;z-index:20;background:rgba(24,19,19,.22);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
.menu-backdrop.open{opacity:1;visibility:visible}
.contact{max-width:820px;margin:0 auto}.contact-title{margin:0;font-family:var(--serif);font-size:clamp(50px,7vw,76px);font-weight:600;line-height:.95;letter-spacing:-1.5px}
.contact-rule{width:100%;height:1px;margin:22px 0 30px;background:var(--crimson)}.contact-intro{margin-bottom:42px}
.contact-intro-en{margin:0 0 9px;font-family:var(--serif);font-size:clamp(20px,2.7vw,26px);line-height:1.35}
.contact-intro-jp{margin:0;color:var(--muted);font-family:var(--jp);font-size:13px;line-height:1.9}
.contact-form{display:grid;gap:22px}.field label{display:block;margin-bottom:8px;color:var(--crimson);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2.4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:0;outline:none;background:rgba(247,242,233,.72);color:var(--ink);font-family:var(--jp);font-size:15px;padding:14px 15px;transition:border-color .18s ease,background .18s ease}
.field input{height:50px}.field textarea{min-height:180px;resize:vertical;line-height:1.7}.field input:focus,.field textarea:focus{border-color:var(--crimson);background:var(--card)}
.submit-row{display:flex;justify-content:flex-end;margin-top:5px}.submit-button{min-width:150px;padding:14px 24px;border:1px solid var(--crimson);background:var(--crimson);color:var(--paper);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2.2px;cursor:pointer}.submit-button:hover{background:var(--crimson-dark)}
.social-links{display:flex;flex-wrap:wrap;gap:30px;margin-top:52px;padding-top:24px;border-top:1px solid var(--line)}
.social-links a{color:var(--crimson);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2px;text-decoration:none}.social-links a:hover{text-decoration:underline}.social-links a[hidden]{display:none}
footer{margin-top:75px;padding:32px 4px 15px;border-top:1px solid var(--line)}.footer-name{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:4px}.footer-role{margin-top:8px;color:var(--muted);font-family:var(--sans);font-size:8px;letter-spacing:3px}
@media(max-width:650px){main{padding:34px 15px 65px}header{padding:30px 6px 62px}.artist-name{max-width:350px;font-size:clamp(52px,15vw,70px);line-height:.86;letter-spacing:-2px}.name-line{margin-top:20px}.artist-role{margin-top:17px;font-size:11px;letter-spacing:3.3px}.menu-toggle{top:29px;right:18px;width:39px}.site-menu{padding:105px 28px 35px}.site-menu a{font-size:27px}.contact{padding:0 6px}.contact-rule{margin:18px 0 25px}.contact-intro{margin-bottom:34px}.contact-intro-jp{font-size:12px}.field textarea{min-height:155px}.submit-button{width:100%}.social-links{gap:24px}}
</style>
</head>
<body>
<main>
<header>
<button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
<div class="menu-backdrop" id="menuBackdrop"></div>
<nav class="site-menu" id="siteMenu" aria-label="Site navigation">
<a href="index.html" data-menu-link="live">LIVE SCHEDULE</a>
<a href="#" data-menu-link="bio">BIO</a>
<a href="#" data-menu-link="music">MUSIC</a>
<a href="contact.html" class="current" data-menu-link="contact">CONTACT</a>
</nav>
<div class="name-wrap"><h1 class="artist-name"><span>Akihiro</span><span>Kokufukata</span></h1><div class="name-line"></div></div>
<div class="artist-role">TRUMPETER / COMPOSER</div>
</header>

<section class="contact">
<h2 class="contact-title">Contact</h2>
<div class="contact-rule"></div>
<div class="contact-intro">
<p class="contact-intro-en">For booking, recording, performance and other inquiries.</p>
<p class="contact-intro-jp">ライブ・レコーディング・演奏依頼、その他のお問い合わせはこちらからお願いいたします。</p>
</div>

<form class="contact-form" action="https://formspree.io/f/xjykngzo" method="POST">
<div class="field"><label for="name">NAME</label><input id="name" name="name" type="text" autocomplete="name" required></div>
<div class="field"><label for="email">EMAIL</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="subject">SUBJECT</label><input id="subject" name="subject" type="text" required></div>
<div class="field"><label for="message">MESSAGE</label><textarea id="message" name="message" required></textarea></div>
<input type="hidden" name="_subject" value="Website inquiry | Akihiro Kokufukata">
<div class="submit-row"><button class="submit-button" type="submit">SEND →</button></div>
</form>

<div class="social-links">
<a id="emailLink" href="#" hidden>EMAIL ↗</a>
<a id="instagramLink" href="#" target="_blank" rel="noopener noreferrer" hidden>INSTAGRAM ↗</a>
</div>
</section>

<footer><div class="footer-name">AKIHIRO KOKUFUKATA</div><div class="footer-role">TRUMPETER / COMPOSER</div></footer>
</main>
<script>
const menuToggle=document.getElementById('menuToggle'),siteMenu=document.getElementById('siteMenu'),menuBackdrop=document.getElementById('menuBackdrop');
function setMenu(open){menuToggle.classList.toggle('open',open);siteMenu.classList.toggle('open',open);menuBackdrop.classList.toggle('open',open);menuToggle.setAttribute('aria-expanded',String(open));menuToggle.setAttribute('aria-label',open?'Close menu':'Open menu')}
menuToggle.addEventListener('click',()=>setMenu(!siteMenu.classList.contains('open')));menuBackdrop.addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
const MENU_URLS={live:SETTINGS.LIVE_SCHEDULE_URL||'index.html',bio:SETTINGS.BIO_URL||'',music:SETTINGS.MUSIC_URL||'',contact:SETTINGS.CONTACT_URL||'contact.html'};
document.querySelectorAll('[data-menu-link]').forEach(link=>{const url=MENU_URLS[link.dataset.menuLink];if(url){link.href=url}else{link.addEventListener('click',e=>e.preventDefault());link.style.opacity='.38';link.style.cursor='default'}});
const emailLink=document.getElementById('emailLink');if(SETTINGS.EMAIL_ADDRESS){emailLink.href=`mailto:${SETTINGS.EMAIL_ADDRESS}`;emailLink.hidden=false}
const instagramLink=document.getElementById('instagramLink');if(SETTINGS.INSTAGRAM_URL){instagramLink.href=SETTINGS.INSTAGRAM_URL;instagramLink.hidden=false}
</script>
</body>
</html>
