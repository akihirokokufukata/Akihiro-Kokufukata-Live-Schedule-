<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Akihiro Kokufukata | Live Schedule</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       DESIGN SYSTEM
       ========================================= */

    :root {
      --paper: #f3eee5;
      --paper-card: #f7f2e9;
      --ink: #181313;
      --muted: #756b66;

      --crimson: #8b1726;
      --crimson-soft: #a73743;
      --blush: #d8aaa5;

      --line: #cfc2b6;

      --serif: "Cormorant Garamond", Georgia, serif;
      --jp: "Noto Serif JP", serif;
      --sans: "Space Grotesk", Arial, sans-serif;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }


    button,
    select,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    main {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 58px 30px 90px;
      overflow: hidden;
    }



    /* =========================================
       DECORATION
       ========================================= */

    .top-decoration {
      position: absolute;
      top: 0;
      right: 12px;
      width: 300px;
      height: 250px;
      pointer-events: none;
      opacity: .95;
    }


    .deco-block {
      position: absolute;
      right: 0;
      top: 0;
      width: 116px;
      height: 160px;
      background: var(--crimson);
    }


    .deco-circle {
      position: absolute;
      right: 82px;
      top: 76px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(216, 170, 165, .62);
    }


    .deco-square {
      position: absolute;
      right: 150px;
      top: 105px;
      width: 88px;
      height: 72px;
      background: rgba(216, 170, 165, .38);
    }



    /* =========================================
       ABSTRACT TRUMPET MARK
       ========================================= */

    .trumpet-mark {
      position: absolute;
      right: 25px;
      top: 102px;
      width: 210px;
      height: 100px;
    }


    .trumpet-line {
      position: absolute;
      left: 0;
      top: 48px;
      width: 118px;
      height: 2px;
      background: var(--crimson);
    }


    .trumpet-valves {
      position: absolute;
      left: 105px;
      top: 29px;
      display: flex;
      gap: 5px;
    }


    .trumpet-valves span {
      position: relative;
      width: 8px;
      height: 42px;
      background: var(--crimson);
    }


    .trumpet-valves span::before {
      content: "";
      position: absolute;
      top: -9px;
      left: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--crimson);
    }


    .trumpet-bell {
      position: absolute;
      right: 0;
      top: 17px;
      width: 76px;
      height: 64px;
      border-top: 3px solid var(--crimson);
      border-bottom: 3px solid var(--crimson);
      border-right: 18px solid var(--crimson);
      border-radius: 0 80% 80% 0;
      transform: skewX(-18deg);
    }



    /* =========================================
       HEADER
       ========================================= */

    header {
      position: relative;
      z-index: 2;
      padding: 25px 10px 70px;
    }


    .artist-name {
      margin: 0;
      max-width: 640px;

      font-family: var(--serif);
      font-size: clamp(58px, 8.5vw, 100px);
      font-weight: 600;
      line-height: .82;
      letter-spacing: -3px;
    }


    .artist-name span {
      display: block;
    }


    .artist-role {
      margin-top: 27px;

      color: var(--crimson);

      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 5px;

      text-transform: uppercase;
    }



    /* =========================================
       SCHEDULE HEADER
       ========================================= */

    .schedule-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;

      margin-bottom: 27px;
    }


    .schedule-title {
      margin: 0;

      font-family: var(--serif);
      font-size: clamp(43px, 6vw, 65px);
      font-weight: 600;
      line-height: .95;
      letter-spacing: -1.5px;
    }



    /* =========================================
       MONTH FILTER
       ========================================= */

    .month-filter {
      display: flex;
      align-items: center;
      gap: 22px;

      padding-bottom: 8px;
      border-bottom: 1px solid var(--crimson);
    }


    .month-button {
      position: relative;

      padding: 5px 2px;

      border: 0;
      background: transparent;

      color: var(--ink);

      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;

      cursor: pointer;
    }


    .month-button.active {
      color: var(--crimson);
    }


    .month-button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -9px;
      height: 3px;
      background: var(--crimson);
    }


    .month-select {
      display: none;

      padding: 8px 28px 8px 11px;

      border: 1px solid var(--crimson);
      border-radius: 0;

      background: transparent;
      color: var(--crimson);

      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;

      text-transform: uppercase;
    }



    /* =========================================
       EVENT
       ========================================= */

    .event {
      position: relative;

      display: grid;
      grid-template-columns: 125px minmax(0, 1fr);

      margin-bottom: 16px;

      background: rgba(247, 242, 233, .66);

      border: 1px solid var(--line);

      overflow: hidden;
    }


    .event.leader {
      border-color: var(--crimson);
    }



    /* =========================================
       EVENT STATUS
       ========================================= */

    .status {
      position: absolute;
      top: 0;
      left: 0;

      min-width: 125px;

      padding: 10px 16px;

      background: var(--crimson);
      color: var(--paper);

      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.3px;

      text-align: center;
    }



    /* =========================================
       DATE
       ========================================= */

    .event-date-column {
      padding: 28px 22px 24px;

      border-right: 1px solid var(--line);
    }


    .event.has-status .event-date-column {
      padding-top: 63px;
    }


    .event-month {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
    }


    .event-number {
      margin-top: -3px;

      color: var(--crimson);

      font-family: var(--serif);
      font-size: 55px;
      font-weight: 600;
      line-height: .92;
    }


    .event-day {
      margin-top: 4px;

      color: var(--crimson);

      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
    }


    .date-rule {
      width: 100%;
      height: 1px;

      margin: 15px 0;

      background: var(--line);
    }


    .event-time {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 500;
    }



    /* =========================================
       EVENT BODY
       ========================================= */

    .event-body {
      position: relative;
      padding: 27px 28px 25px;
    }


    .leader-label,
    .next-label {
      margin-bottom: 7px;

      color: var(--crimson);

      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;

      text-transform: uppercase;
    }


    .event-title {
      margin: 0 0 20px;

      font-family: var(--jp);
      font-size: clamp(20px, 3vw, 27px);
      font-weight: 600;
      line-height: 1.4;
    }


    .event-title.english {
      font-family: var(--serif);
      font-size: clamp(26px, 3.3vw, 34px);
      line-height: 1;
    }



    /* =========================================
       LABELS
       ========================================= */

    .label {
      margin-bottom: 7px;

      color: var(--crimson);

      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;

      text-transform: uppercase;
    }



    /* =========================================
       PLAYERS
       ========================================= */

    .players {
      margin-bottom: 20px;

      color: #342c29;

      font-family: var(--jp);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.8;
    }


    .hidden-players {
      display: none;
    }


    .hidden-players.open {
      display: block;
    }


    .show-more {
      margin-top: 9px;
      padding: 0;

      border: 0;
      background: transparent;

      color: var(--crimson);

      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;

      cursor: pointer;
    }



    /* =========================================
       VENUE
       ========================================= */

    .venue {
      font-family: var(--jp);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
    }


    .place {
      margin-top: 2px;

      color: var(--muted);

      font-family: var(--jp);
      font-size: 13px;
    }



    /* =========================================
       ACTIONS
       ========================================= */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;

      margin-top: 18px;
    }


    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 108px;

      padding: 10px 16px;

      border: 1px solid var(--crimson);

      color: var(--crimson);
      background: transparent;

      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.7px;

      text-decoration: none;

      transition:
        background .18s ease,
        color .18s ease;
    }


    .action:hover {
      background: var(--crimson);
      color: var(--paper);
    }


    .action.email {
      min-width: 130px;
    }



    /* =========================================
       LEADER DECORATION
       ========================================= */

    .leader-shape {
      position: absolute;
      top: 0;
      right: 0;

      width: 115px;
      height: 95px;

      overflow: hidden;

      pointer-events: none;
      opacity: .9;
    }


    .leader-shape::before {
      content: "";

      position: absolute;
      top: 0;
      right: 0;

      width: 58px;
      height: 58px;

      background: rgba(139, 23, 38, .82);
    }


    .leader-shape::after {
      content: "";

      position: absolute;
      right: 25px;
      top: 25px;

      width: 76px;
      height: 76px;

      border-radius: 50%;

      background: rgba(216, 170, 165, .45);
    }



    /* =========================================
       EMPTY / ERROR
       ========================================= */

    .message {
      padding: 40px 5px;

      color: var(--muted);

      font-family: var(--sans);
      font-size: 13px;
    }



    /* =========================================
       FOOTER
       ========================================= */

    footer {
      position: relative;

      margin-top: 75px;
      padding: 32px 4px 15px;

      border-top: 1px solid var(--line);
    }


    .footer-name {
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 4px;
    }


    .footer-role {
      margin-top: 8px;

      color: var(--muted);

      font-family: var(--sans);
      font-size: 8px;
      letter-spacing: 3px;
    }



    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      main {
        padding: 34px 15px 65px;
      }


      .top-decoration {
        right: -45px;
        width: 190px;
        height: 190px;
      }


      .deco-block {
        width: 65px;
        height: 110px;
      }


      .deco-circle {
        right: 50px;
        top: 62px;
        width: 63px;
        height: 63px;
      }


      .deco-square {
        display: none;
      }


      .trumpet-mark {
        right: -6px;
        top: 92px;
        transform: scale(.62);
        transform-origin: right top;
      }


      header {
        padding: 30px 6px 62px;
      }


      .artist-name {
        max-width: 350px;

        font-size: clamp(52px, 15vw, 70px);
        line-height: .86;
        letter-spacing: -2px;
      }


      .artist-role {
        margin-top: 21px;

        font-size: 11px;
        letter-spacing: 3.3px;
      }


      .schedule-heading {
        align-items: center;
        gap: 12px;
      }


      .schedule-title {
        font-size: 40px;
      }


      .month-filter {
        display: none;
      }


      .month-select {
        display: block;
      }


      .event {
        grid-template-columns: 91px minmax(0, 1fr);
      }


      .status {
        min-width: 91px;
        padding: 9px 7px;

        font-size: 9px;
        letter-spacing: 1.7px;
      }


      .event-date-column {
        padding: 22px 13px;
      }


      .event.has-status .event-date-column {
        padding-top: 57px;
      }


      .event-month {
        font-size: 15px;
      }


      .event-number {
        font-size: 44px;
      }


      .event-day {
        font-size: 14px;
      }


      .event-time {
        font-size: 14px;
      }


      .event-body {
        padding: 22px 14px 20px;
      }


      .leader-label,
      .next-label,
      .label {
        font-size: 9px;
        letter-spacing: 2.3px;
      }


      .event-title {
        font-size: 18px;
        line-height: 1.45;
      }


      .event-title.english {
        font-size: 23px;
      }


      .players {
        font-size: 13px;
        line-height: 1.7;
      }


      .venue {
        font-size: 14px;
      }


      .actions {
        gap: 7px;
      }


      .action {
        flex: 1 1 90px;

        min-width: 0;

        padding: 10px 8px;

        font-size: 8px;
        letter-spacing: 1.2px;
      }


      .action.email {
        flex-basis: 100%;
      }


      .leader-shape {
        width: 82px;
        height: 72px;
      }

    }


    @media (max-width: 380px) {

      .schedule-title {
        font-size: 34px;
      }


      .month-select {
        max-width: 118px;
      }


      .event {
        grid-template-columns: 82px minmax(0, 1fr);
      }


      .event-date-column {
        padding-left: 10px;
        padding-right: 10px;
      }


      .status {
        min-width: 82px;
      }

    }

  </style>
</head>


<body>

  <main>

    <!-- Decorative header -->
    <div class="top-decoration" aria-hidden="true">
      <div class="deco-block"></div>
      <div class="deco-circle"></div>
      <div class="deco-square"></div>

      <div class="trumpet-mark">
        <div class="trumpet-line"></div>

        <div class="trumpet-valves">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="trumpet-bell"></div>
      </div>
    </div>


    <!-- Header -->
    <header>

      <h1 class="artist-name">
        <span>Akihiro</span>
        <span>Kokufukata</span>
      </h1>

      <div class="artist-role">
        TRUMPETER / COMPOSER
      </div>

    </header>


    <!-- Schedule -->
    <section>

      <div class="schedule-heading">

        <h2 class="schedule-title">
          Live Schedule
        </h2>

        <div
          class="month-filter"
          id="monthFilter"
        ></div>

        <select
          class="month-select"
          id="monthSelect"
          aria-label="Choose month"
        ></select>

      </div>


      <div id="events">
        <div class="message">
          Loading shows...
        </div>
      </div>

    </section>


    <footer>

      <div class="footer-name">
        AKIHIRO KOKUFUKATA
      </div>

      <div class="footer-role">
        TRUMPETER / COMPOSER
      </div>

    </footer>

  </main>


  <script>

    /* =========================================
       ONLY EDIT THESE THREE VALUES
       ========================================= */

    const API_KEY =
      'AIzaSyCB5WplBrKEb70d5WHZTrg3G46fTdl_A0Q';

    const CALENDAR_ID =
      'akihirokokufukatamusic@gmail.com';

    const EMAIL_ADDRESS =
      'akihirokokufukatamusic@gmail.com';



    /* =========================================
       GLOBAL DATA
       ========================================= */

    let upcomingEvents = [];

    let selectedMonth = 'all';



    /* =========================================
       HELPERS
       ========================================= */

    function escapeHTML(value = '') {

      return String(value)

        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    }



    function parseDescription(description = '') {

      const lines =
        description
          .replace(/\r/g, '')
          .split('\n');


      const players = [];

      let place = '';
      let website = '';
      let leader = false;

      let readingPlayers = false;


      for (const rawLine of lines) {

        const line =
          rawLine.trim();


        if (/^players\s*:/i.test(line)) {

          readingPlayers = true;

          const sameLine =
            line
              .replace(/^players\s*:/i, '')
              .trim();

          if (sameLine) {
            players.push(sameLine);
          }

          continue;
        }


        if (/^place\s*:/i.test(line)) {

          readingPlayers = false;

          place =
            line
              .replace(/^place\s*:/i, '')
              .trim();

          continue;
        }


        if (/^website\s*:/i.test(line)) {

          readingPlayers = false;

          website =
            line
              .replace(/^website\s*:/i, '')
              .trim();

          continue;
        }


        if (/^leader\s*:/i.test(line)) {

          readingPlayers = false;

          const value =
            line
              .replace(/^leader\s*:/i, '')
              .trim()
              .toLowerCase();

          leader =
            ['yes', 'true', '1', 'leader']
              .includes(value);

          continue;
        }


        if (readingPlayers && line) {
          players.push(line);
        }

      }


      return {
        players,
        place,
        website,
        leader
      };

    }



    function getVenue(location = '') {

      if (!location) {
        return '';
      }

      return location
        .split(/[,、]/)[0]
        .trim();

    }



    function eventStart(event) {

      return new Date(
        event.start.dateTime ||
        event.start.date
      );

    }



    function eventEnd(event) {

      return new Date(
        event.end.dateTime ||
        event.end.date
      );

    }



    function localDateKey(date) {

      return new Intl.DateTimeFormat(
        'en-CA',
        {
          timeZone: 'Asia/Tokyo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }
      ).format(date);

    }



    function isToday(event) {

      const now =
        new Date();

      return (
        localDateKey(eventStart(event)) ===
        localDateKey(now)
      );

    }



    function getDateParts(event) {

      const date =
        eventStart(event);


      const month =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Tokyo',
            month: 'short'
          }
        )
        .format(date)
        .toUpperCase();


      const number =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Tokyo',
            day: '2-digit'
          }
        )
        .format(date);


      const weekday =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Tokyo',
            weekday: 'short'
          }
        )
        .format(date)
        .toUpperCase();


      return {
        month,
        number,
        weekday
      };

    }



    function formatTime(event) {

      if (!event.start.dateTime) {
        return 'ALL DAY';
      }


      return new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone: 'Asia/Tokyo',
          hour: 'numeric',
          minute: '2-digit'
        }
      )
      .format(
        eventStart(event)
      );

    }



    function getMonthKey(event) {

      const date =
        eventStart(event);


      const year =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Tokyo',
            year: 'numeric'
          }
        )
        .format(date);


      const month =
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone: 'Asia/Tokyo',
            month: '2-digit'
          }
        )
        .format(date);


      return `${year}-${month}`;

    }



    function getMonthLabel(event) {

      return new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone: 'Asia/Tokyo',
          month: 'short',
          year: 'numeric'
        }
      )
      .format(
        eventStart(event)
      )
      .toUpperCase();

    }



    function containsJapanese(text = '') {

      return /[\u3040-\u30ff\u3400-\u9fff]/.test(text);

    }



    /* =========================================
       PLAYERS
       ========================================= */

    function createPlayersHTML(players) {

      if (!players.length) {
        return '';
      }


      const visible =
        players.slice(0, 6);


      const hidden =
        players.slice(6);


      let html = `

        <div class="label">
          PLAYERS
        </div>

        <div class="players">

          ${visible
            .map(player => escapeHTML(player))
            .join('<br>')}

      `;


      if (hidden.length) {

        html += `

          <div class="hidden-players">

            ${hidden
              .map(player => escapeHTML(player))
              .join('<br>')}

          </div>

          <button
            class="show-more"
            type="button"
          >
            SHOW MORE ↓
          </button>

        `;

      }


      html += `
        </div>
      `;


      return html;

    }



    /* =========================================
       EVENT CARD
       ========================================= */

    function createEventCard(
      event,
      index
    ) {

      const info =
        parseDescription(
          event.description || ''
        );


      const venue =
        getVenue(
          event.location || ''
        );


      const date =
        getDateParts(event);


      const tonight =
        isToday(event);


      const isNext =
        index === 0 &&
        !tonight;


      const mapURL =
        event.location

          ? 'https://www.google.com/maps/search/?api=1&query=' +
            encodeURIComponent(event.location)

          : '';


      const title =
        event.summary || 'Live';


      const titleClass =
        containsJapanese(title)
          ? ''
          : ' english';


      const hasStatus =
        tonight;


      let topLabel = '';


      if (info.leader) {

        topLabel += `
          <div class="leader-label">
            LEADER SHOW
          </div>
        `;

      }


      if (isNext) {

        topLabel += `
          <div class="next-label">
            NEXT SHOW
          </div>
        `;

      }


      let venueHTML = '';


      if (venue || info.place) {

        venueHTML = `

          <div class="label">
            VENUE
          </div>

          ${
            venue
              ? `
                <div class="venue">
                  ${escapeHTML(venue)}
                </div>
              `
              : ''
          }

          ${
            info.place
              ? `
                <div class="place">
                  ${escapeHTML(info.place)}
                </div>
              `
              : ''
          }

        `;

      }



      let actionsHTML = '';


      const actions = [];


      if (
        info.leader &&
        EMAIL_ADDRESS &&
        EMAIL_ADDRESS !== 'YOUR_EMAIL_ADDRESS'
      ) {

        const subject =
          encodeURIComponent(
            `Live inquiry: ${title}`
          );


        actions.push(`

          <a
            class="action email"
            href="mailto:${escapeHTML(EMAIL_ADDRESS)}?subject=${subject}"
          >
            EMAIL ME ↗
          </a>

        `);

      }


      if (info.website) {

        actions.push(`

          <a
            class="action"
            href="${escapeHTML(info.website)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            WEBSITE ↗
          </a>

        `);

      }


      if (mapURL) {

        actions.push(`

          <a
            class="action"
            href="${mapURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            MAP ↗
          </a>

        `);

      }


      if (actions.length) {

        actionsHTML = `
          <div class="actions">
            ${actions.join('')}
          </div>
        `;

      }



      return `

        <article
          class="
            event
            ${info.leader ? 'leader' : ''}
            ${hasStatus ? 'has-status' : ''}
          "
        >

          ${
            tonight
              ? `
                <div class="status">
                  TONIGHT
                </div>
              `
              : ''
          }


          <div class="event-date-column">

            <div class="event-month">
              ${date.month}
            </div>

            <div class="event-number">
              ${date.number}
            </div>

            <div class="event-day">
              ${date.weekday}
            </div>

            <div class="date-rule"></div>

            <div class="event-time">
              ${formatTime(event)}
            </div>

          </div>


          <div class="event-body">

            ${
              info.leader
                ? '<div class="leader-shape"></div>'
                : ''
            }

            ${topLabel}

            <h3 class="event-title${titleClass}">
              ${escapeHTML(title)}
            </h3>

            ${createPlayersHTML(info.players)}

            ${venueHTML}

            ${actionsHTML}

          </div>

        </article>

      `;

    }



    /* =========================================
       MONTH FILTER
       ========================================= */

    function buildMonthFilters() {

      const monthMap =
        new Map();


      upcomingEvents.forEach(event => {

        const key =
          getMonthKey(event);


        if (!monthMap.has(key)) {

          monthMap.set(
            key,
            getMonthLabel(event)
          );

        }

      });


      const months =
        [...monthMap.entries()];


      const filter =
        document.getElementById(
          'monthFilter'
        );


      const select =
        document.getElementById(
          'monthSelect'
        );


      filter.innerHTML = `

        <button
          class="month-button active"
          data-month="all"
          type="button"
        >
          ALL
        </button>

        ${months.map(
          ([key, label]) => `

            <button
              class="month-button"
              data-month="${key}"
              type="button"
            >
              ${label}
            </button>

          `
        ).join('')}

      `;


      select.innerHTML = `

        <option value="all">
          ALL MONTHS
        </option>

        ${months.map(
          ([key, label]) => `

            <option value="${key}">
              ${label}
            </option>

          `
        ).join('')}

      `;

    }



    function setMonth(month) {

      selectedMonth =
        month;


      document
        .querySelectorAll(
          '.month-button'
        )
        .forEach(button => {

          button.classList.toggle(
            'active',
            button.dataset.month === month
          );

        });


      const select =
        document.getElementById(
          'monthSelect'
        );


      select.value =
        month;


      renderEvents();

    }



    function renderEvents() {

      const container =
        document.getElementById(
          'events'
        );


      const filtered =

        selectedMonth === 'all'

          ? upcomingEvents

          : upcomingEvents.filter(
              event =>
                getMonthKey(event) ===
                selectedMonth
            );


      if (!filtered.length) {

        container.innerHTML = `
          <div class="message">
            No shows scheduled for this month.
          </div>
        `;

        return;

      }


      /*
        NEXT SHOW should always refer to the
        actual next upcoming event, even when
        a month filter is active.
      */

      container.innerHTML =

        filtered

          .map(event => {

            const originalIndex =
              upcomingEvents.indexOf(event);

            return createEventCard(
              event,
              originalIndex
            );

          })

          .join('');

    }



    /* =========================================
       SHOW MORE
       ========================================= */

    document.addEventListener(
      'click',
      function(event) {

        const showMore =
          event.target.closest(
            '.show-more'
          );


        if (showMore) {

          const hidden =
            showMore.previousElementSibling;


          if (
            !hidden ||
            !hidden.classList.contains(
              'hidden-players'
            )
          ) {
            return;
          }


          const open =
            hidden.classList.toggle(
              'open'
            );


          showMore.textContent =
            open
              ? 'SHOW LESS ↑'
              : 'SHOW MORE ↓';


          return;

        }


        const monthButton =
          event.target.closest(
            '.month-button'
          );


        if (monthButton) {

          setMonth(
            monthButton.dataset.month
          );

        }

      }
    );



    document
      .getElementById(
        'monthSelect'
      )
      .addEventListener(
        'change',
        function() {

          setMonth(
            this.value
          );

        }
      );



    /* =========================================
       GOOGLE CALENDAR
       ========================================= */

    async function loadCalendar() {

      const now =
        new Date();


      const timeMax =
        new Date(
          now.getFullYear() + 2,
          now.getMonth(),
          now.getDate()
        )
        .toISOString();


      const url =

        'https://www.googleapis.com/calendar/v3/calendars/' +

        encodeURIComponent(
          CALENDAR_ID
        ) +

        '/events' +

        '?key=' +

        encodeURIComponent(
          API_KEY
        ) +

        '&singleEvents=true' +

        '&orderBy=startTime' +

        '&timeMin=' +

        encodeURIComponent(
          now.toISOString()
        ) +

        '&timeMax=' +

        encodeURIComponent(
          timeMax
        ) +

        '&maxResults=250';


      try {

        const response =
          await fetch(url);


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            errorText
          );

          throw new Error(
            'Calendar request failed'
          );

        }


        const data =
          await response.json();


        upcomingEvents =
          (data.items || [])

            .filter(event =>
              event.start &&
              event.end &&
              eventEnd(event) >= now
            );


        buildMonthFilters();

        renderEvents();

      }


      catch (error) {

        console.error(
          error
        );


        document
          .getElementById(
            'events'
          )
          .innerHTML = `

            <div class="message">
              Could not load the live schedule.
            </div>

          `;

      }

    }



    /* =========================================
       START
       ========================================= */

    loadCalendar();

  </script>

</body>
