<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Akihiro Kokufukata | Live Schedule
  </title>


  <!-- ==========================================
       FONTS
       Bodoni Moda     : Main editorial typography
       Space Grotesk   : Dates / labels / buttons
       Noto Sans JP    : Japanese / event information
       ========================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Noto+Sans+JP:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ==========================================
       COLOR SYSTEM
       ========================================== */

    :root {

      --background: #100e0e;

      --card: #181414;

      --card-hover: #1d1818;

      --text: #eee9df;

      --muted: #928a83;

      --muted-dark: #6f6864;

      --accent: #8a2434;

      --accent-light: #b44a59;

      --border: #332729;

      --serif:
        "Bodoni Moda",
        Georgia,
        serif;

      --sans:
        "Space Grotesk",
        Arial,
        sans-serif;

      --jp:
        "Noto Sans JP",
        sans-serif;
    }


    /* ==========================================
       GLOBAL
       ========================================== */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      background:
        var(--background);

      color:
        var(--text);

      font-family:
        var(--jp);

      -webkit-font-smoothing:
        antialiased;
    }


    main {

      width: 100%;

      max-width: 760px;

      margin:
        0 auto;

      padding:
        48px 20px 90px;
    }



    /* ==========================================
       HEADER
       ========================================== */

    header {

      padding:
        18px 0 58px;
    }


    .artist-name {

      margin: 0;

      max-width: 680px;

      color:
        var(--text);

      font-family:
        var(--serif);

      font-size:
        clamp(
          48px,
          11vw,
          82px
        );

      font-weight:
        500;

      line-height:
        0.93;

      letter-spacing:
        -3px;
    }


    .artist-name span {

      display: block;
    }


    .artist-role {

      margin-top:
        24px;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        11px;

      font-weight:
        600;

      letter-spacing:
        2.7px;

      text-transform:
        uppercase;
    }



    /* ==========================================
       LIVE SCHEDULE HEADING
       ========================================== */

    .schedule-header {

      margin-bottom:
        28px;
    }


    .schedule-title {

      margin:
        0 0 20px;

      font-family:
        var(--serif);

      font-size:
        clamp(
          32px,
          7vw,
          46px
        );

      font-weight:
        500;

      line-height:
        1;

      letter-spacing:
        -1.2px;
    }


    .schedule-rule {

      width:
        100%;

      height:
        1px;

      background:
        var(--accent);
    }



    /* ==========================================
       EVENT CARD
       ========================================== */

    .event {

      position:
        relative;

      margin-bottom:
        20px;

      padding:
        25px 24px 24px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        6px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }


    @media (hover: hover) {

      .event:hover {

        background:
          var(--card-hover);

        border-color:
          #493538;
      }
    }



    /* ==========================================
       DATE + TIME

       OCT 08
       THU

       7:00 PM
       -----------------
       ========================================== */

    .event-meta {

      margin-bottom:
        22px;
    }


    .event-date {

      color:
        var(--text);

      font-family:
        var(--serif);

      font-size:
        27px;

      font-weight:
        500;

      line-height:
        1;
    }


    .event-day {

      margin-top:
        7px;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        2.2px;
    }


    .event-time {

      margin-top:
        19px;

      color:
        var(--text);

      font-family:
        var(--sans);

      font-size:
        14px;

      font-weight:
        500;

      letter-spacing:
        0.5px;
    }


    .event-rule {

      width:
        100%;

      height:
        1px;

      margin-top:
        17px;

      background:
        var(--border);
    }



    /* ==========================================
       EVENT TITLE
       ========================================== */

    .event-title {

      margin:
        0 0 27px;

      color:
        var(--text);

      font-family:
        var(--jp);

      font-size:
        clamp(
          21px,
          5vw,
          26px
        );

      font-weight:
        600;

      line-height:
        1.4;

      letter-spacing:
        -0.4px;
    }



    /* ==========================================
       LABEL
       ========================================== */

    .label {

      margin-bottom:
        8px;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        9px;

      font-weight:
        600;

      letter-spacing:
        2.2px;

      text-transform:
        uppercase;
    }



    /* ==========================================
       PLAYERS
       ========================================== */

    .players {

      margin-bottom:
        27px;

      color:
        #d8d2ca;

      font-family:
        var(--jp);

      font-size:
        14px;

      font-weight:
        400;

      line-height:
        1.85;
    }


    .hidden-players {

      display:
        none;
    }


    .hidden-players.open {

      display:
        block;
    }


    .show-more {

      display:
        inline-block;

      margin-top:
        12px;

      padding:
        0;

      border:
        none;

      background:
        transparent;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        1.4px;

      cursor:
        pointer;
    }


    .show-more:hover {

      color:
        var(--text);
    }



    /* ==========================================
       VENUE
       ========================================== */

    .venue {

      color:
        var(--text);

      font-family:
        var(--jp);

      font-size:
        16px;

      font-weight:
        500;

      line-height:
        1.5;
    }


    .place {

      margin-top:
        7px;

      color:
        var(--muted);

      font-family:
        var(--jp);

      font-size:
        13px;

      line-height:
        1.5;
    }



    /* ==========================================
       MAP BUTTON
       ========================================== */

    .map {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      margin-top:
        18px;

      min-width:
        92px;

      padding:
        10px 16px;

      border:
        1px solid var(--accent);

      border-radius:
        3px;

      background:
        transparent;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        1.5px;

      text-decoration:
        none;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }


    .map:hover {

      background:
        var(--accent);

      border-color:
        var(--accent);

      color:
        var(--text);
    }



    /* ==========================================
       PAST SHOWS
       Functionality retained for later
       ========================================== */

    .past-button {

      width:
        100%;

      margin-top:
        35px;

      padding:
        16px;

      border:
        1px solid var(--border);

      border-radius:
        3px;

      background:
        transparent;

      color:
        var(--muted);

      font-family:
        var(--sans);

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        1.6px;

      cursor:
        pointer;
    }


    #past {

      display:
        none;

      margin-top:
        35px;
    }


    #past.open {

      display:
        block;
    }


    #past .event {

      opacity:
        0.55;
    }



    /* ==========================================
       STATUS
       ========================================== */

    .loading {

      padding:
        35px 0;

      color:
        var(--muted);

      font-family:
        var(--sans);

      font-size:
        13px;
    }


    .error {

      padding:
        35px 0;

      color:
        var(--accent-light);

      font-family:
        var(--sans);

      font-size:
        13px;

      line-height:
        1.7;
    }



    /* ==========================================
       FOOTER
       Signature can be added here later.
       ========================================== */

    footer {

      min-height:
        35px;

      margin-top:
        65px;

      border-top:
        1px solid var(--border);
    }



    /* ==========================================
       MOBILE
       ========================================== */

    @media (
      max-width: 520px
    ) {

      main {

        padding:
          34px 16px 70px;
      }


      header {

        padding:
          15px 4px 52px;
      }


      .artist-name {

        font-size:
          clamp(
            47px,
            14.5vw,
            68px
          );

        letter-spacing:
          -2.5px;
      }


      .artist-role {

        margin-top:
          21px;

        font-size:
          9px;

        letter-spacing:
          2.3px;
      }


      .schedule-title {

        font-size:
          36px;
      }


      .event {

        padding:
          23px 20px 22px;

        margin-bottom:
          16px;
      }


      .event-date {

        font-size:
          25px;
      }


      .event-title {

        font-size:
          21px;
      }

    }

  </style>

<body>

  <main>


    <!-- ==========================================
         HEADER
         ========================================== -->

    <header>

      <h1 class="artist-name">

        <span>
          Akihiro
        </span>

        <span>
          Kokufukata
        </span>

      </h1>


      <div class="artist-role">

        TRUMPETER / COMPOSER

      </div>

    </header>



    <!-- ==========================================
         LIVE SCHEDULE
         ========================================== -->

    <section>


      <div class="schedule-header">

        <h2 class="schedule-title">

          Live Schedule

        </h2>


        <div class="schedule-rule"></div>

      </div>



      <div id="upcoming">

        <div class="loading">

          Loading shows...

        </div>

      </div>



      <!--
        Past Shows functionality is retained.
        We can redesign this later.
      -->

      <button
        class="past-button"
        id="pastButton"
        type="button"
      >

        VIEW PAST SHOWS ↓

      </button>



      <div id="past">


        <div class="schedule-header">

          <h2 class="schedule-title">

            Past Shows

          </h2>

          <div class="schedule-rule"></div>

        </div>


        <div id="pastEvents"></div>


      </div>


    </section>



    <!--
      Future:
      Your handwritten signature can go here.
    -->

    <footer></footer>


  </main>



  <script>

    /* ==========================================
       GOOGLE CALENDAR

       CHANGE ONLY THESE TWO VALUES
       ========================================== */

    const API_KEY =
      'AIzaSyCB5WplBrKEb70d5WHZTrg3G46fTdl_A0Q';

    const CALENDAR_ID =
      'akihirokokufukatamusic@gmail.com';



    /* ==========================================
       ELEMENTS
       ========================================== */

    const upcomingElement =
      document.getElementById(
        'upcoming'
      );


    const pastElement =
      document.getElementById(
        'pastEvents'
      );



    /* ==========================================
       ESCAPE HTML
       ========================================== */

    function escapeHTML(
      value = ''
    ) {

      return String(value)

        .replaceAll(
          '&',
          '&amp;'
        )

        .replaceAll(
          '<',
          '&lt;'
        )

        .replaceAll(
          '>',
          '&gt;'
        )

        .replaceAll(
          '"',
          '&quot;'
        )

        .replaceAll(
          "'",
          '&#039;'
        );
    }



    /* ==========================================
       DESCRIPTION PARSER

       Example:

       Players:
       Player 1
       Player 2

       Place: Shinjuku Station
       ========================================== */

    function parseDescription(
      description = ''
    ) {

      const lines =
        description
          .replace(
            /\r/g,
            ''
          )
          .split(
            '\n'
          );


      const players = [];

      let place = '';

      let readingPlayers =
        false;



      for (
        const rawLine
        of lines
      ) {

        const line =
          rawLine.trim();



        if (
          /^players\s*:/i
            .test(line)
        ) {

          readingPlayers =
            true;


          const sameLinePlayer =
            line
              .replace(
                /^players\s*:/i,
                ''
              )
              .trim();


          if (
            sameLinePlayer
          ) {

            players.push(
              sameLinePlayer
            );
          }


          continue;
        }



        if (
          /^place\s*:/i
            .test(line)
        ) {

          readingPlayers =
            false;


          place =
            line
              .replace(
                /^place\s*:/i,
                ''
              )
              .trim();


          continue;
        }



        if (
          readingPlayers &&
          line
        ) {

          players.push(
            line
          );
        }

      }



      return {

        players,
        place

      };
    }



    /* ==========================================
       VENUE
       ========================================== */

    function getVenue(
      location = ''
    ) {

      if (
        !location
      ) {

        return '';
      }


      return location
        .split(
          /[,、]/
        )[0]
        .trim();
    }



    /* ==========================================
       EVENT DATE PARTS
       ========================================== */

    function getDateParts(
      event
    ) {

      const raw =

        event.start.dateTime ||

        event.start.date;


      const date =
        new Date(raw);



      const month =

        new Intl.DateTimeFormat(

          'en-US',

          {

            timeZone:
              'Asia/Tokyo',

            month:
              'short'

          }

        )
        .format(date)
        .toUpperCase();



      const dayNumber =

        new Intl.DateTimeFormat(

          'en-US',

          {

            timeZone:
              'Asia/Tokyo',

            day:
              '2-digit'

          }

        )
        .format(date);



      const weekday =

        new Intl.DateTimeFormat(

          'en-US',

          {

            timeZone:
              'Asia/Tokyo',

            weekday:
              'short'

          }

        )
        .format(date)
        .toUpperCase();



      return {

        month,
        dayNumber,
        weekday

      };
    }



    /* ==========================================
       TIME
       ========================================== */

    function formatTime(
      event
    ) {

      if (
        !event.start.dateTime
      ) {

        return 'ALL DAY';
      }



      const date =
        new Date(
          event.start.dateTime
        );



      return new Intl.DateTimeFormat(

        'en-US',

        {

          timeZone:
            'Asia/Tokyo',

          hour:
            'numeric',

          minute:
            '2-digit'

        }

      )
      .format(date);
    }



    /* ==========================================
       PLAYERS
       ========================================== */

    function createPlayersHTML(
      players
    ) {

      if (
        !players.length
      ) {

        return '';
      }



      const visiblePlayers =
        players.slice(
          0,
          6
        );


      const hiddenPlayers =
        players.slice(
          6
        );



      const visibleHTML =

        visiblePlayers

          .map(
            player =>
              escapeHTML(
                player
              )
          )

          .join(
            '<br>'
          );



      let hiddenHTML =
        '';



      if (
        hiddenPlayers.length
      ) {

        const extraPlayersHTML =

          hiddenPlayers

            .map(
              player =>
                escapeHTML(
                  player
                )
            )

            .join(
              '<br>'
            );



        hiddenHTML = `

          <div
            class="hidden-players"
          >

            ${extraPlayersHTML}

          </div>


          <button
            class="show-more"
            type="button"
          >

            SHOW MORE ↓

          </button>

        `;
      }



      return `

        <div class="label">

          PLAYERS

        </div>


        <div class="players">

          ${visibleHTML}

          ${hiddenHTML}

        </div>

      `;
    }



    /* ==========================================
       EVENT CARD
       ========================================== */

    function createEventCard(
      event
    ) {

      const info =

        parseDescription(

          event.description ||
          ''

        );



      const venue =

        getVenue(

          event.location ||
          ''

        );



      const dateParts =

        getDateParts(
          event
        );



      const mapURL =

        event.location

          ?

          'https://www.google.com/maps/search/?api=1&query=' +

          encodeURIComponent(
            event.location
          )

          :

          '';



      const playersHTML =

        createPlayersHTML(

          info.players

        );



      let venueHTML =
        '';



      if (
        venue ||
        info.place
      ) {

        venueHTML = `

          <div class="label">

            VENUE

          </div>



          ${
            venue

              ?

              `

              <div class="venue">

                ${escapeHTML(
                  venue
                )}

              </div>

              `

              :

              ''
          }



          ${
            info.place

              ?

              `

              <div class="place">

                ${escapeHTML(
                  info.place
                )}

              </div>

              `

              :

              ''
          }



          ${
            mapURL

              ?

              `

              <a
                class="map"
                href="${mapURL}"
                target="_blank"
                rel="noopener noreferrer"
              >

                MAP ↗

              </a>

              `

              :

              ''
          }

        `;
      }



      return `

        <article class="event">


          <div class="event-meta">


            <div class="event-date">

              ${dateParts.month}
              ${dateParts.dayNumber}

            </div>


            <div class="event-day">

              ${dateParts.weekday}

            </div>


            <div class="event-time">

              ${formatTime(
                event
              )}

            </div>


            <div class="event-rule"></div>


          </div>



          <h3 class="event-title">

            ${escapeHTML(

              event.summary ||
              'Live'

            )}

          </h3>



          ${playersHTML}



          ${venueHTML}


        </article>

      `;
    }



    /* ==========================================
       SHOW MORE / SHOW LESS
       ========================================== */

    document.addEventListener(

      'click',

      function(event) {


        const button =

          event.target.closest(

            '.show-more'

          );



        if (
          !button
        ) {

          return;
        }



        const hiddenPlayers =

          button
            .previousElementSibling;



        if (

          !hiddenPlayers ||

          !hiddenPlayers
            .classList
            .contains(
              'hidden-players'
            )

        ) {

          return;
        }



        const isOpen =

          hiddenPlayers
            .classList
            .contains(
              'open'
            );



        if (
          isOpen
        ) {

          hiddenPlayers
            .classList
            .remove(
              'open'
            );


          button.textContent =

            'SHOW MORE ↓';

        }


        else {

          hiddenPlayers
            .classList
            .add(
              'open'
            );


          button.textContent =

            'SHOW LESS ↑';

        }

      }

    );



    /* ==========================================
       LOAD GOOGLE CALENDAR
       ========================================== */

    async function loadCalendar() {

      const now =
        new Date();



      const timeMin =

        new Date(

          now.getFullYear() - 1,

          now.getMonth(),

          now.getDate()

        )
        .toISOString();



      const timeMax =

        new Date(

          now.getFullYear() + 2,

          now.getMonth(),

          now.getDate()

        )
        .toISOString();



      const url =

        'https://www.googleapis.com/calendar/v3/calendars/' +

        encodeURIComponent(
          CALENDAR_ID
        ) +

        '/events' +

        '?key=' +

        encodeURIComponent(
          API_KEY
        ) +

        '&singleEvents=true' +

        '&orderBy=startTime' +

        '&timeMin=' +

        encodeURIComponent(
          timeMin
        ) +

        '&timeMax=' +

        encodeURIComponent(
          timeMax
        ) +

        '&maxResults=250';



      try {


        const response =

          await fetch(
            url
          );



        if (
          !response.ok
        ) {

          const errorText =

            await response.text();


          console.error(
            errorText
          );


          throw new Error(

            'Calendar request failed'

          );
        }



        const data =

          await response.json();



        const events =

          data.items ||
          [];



        const upcoming =
          [];


        const past =
          [];



        events.forEach(

          event => {


            if (

              !event.start ||

              !event.end

            ) {

              return;
            }



            const endValue =

              event.end.dateTime ||

              event.end.date;



            const endDate =

              new Date(
                endValue
              );



            if (

              endDate <
              now

            ) {

              past.push(
                event
              );

            }


            else {

              upcoming.push(
                event
              );

            }

          }

        );



        if (
          upcoming.length
        ) {

          upcomingElement.innerHTML =

            upcoming

              .map(
                event =>
                  createEventCard(
                    event
                  )
              )

              .join(
                ''
              );

        }


        else {

          upcomingElement.innerHTML =

            '<div class="loading">No upcoming shows.</div>';

        }



        past.reverse();



        if (
          past.length
        ) {

          pastElement.innerHTML =

            past

              .map(
                event =>
                  createEventCard(
                    event
                  )
              )

              .join(
                ''
              );

        }


        else {

          pastElement.innerHTML =

            '<div class="loading">No past shows.</div>';

        }

      }


      catch (
        error
      ) {

        console.error(
          error
        );


        upcomingElement.innerHTML = `

          <div class="error">

            Could not load the live schedule.

          </div>

        `;
      }

    }



    /* ==========================================
       PAST SHOWS
       ========================================== */

    document
      .getElementById(
        'pastButton'
      )
      .addEventListener(

        'click',

        function() {


          const past =

            document.getElementById(
              'past'
            );



          const isOpen =

            past
              .classList
              .contains(
                'open'
              );



          if (
            isOpen
          ) {

            past
              .classList
              .remove(
                'open'
              );


            this.textContent =

              'VIEW PAST SHOWS ↓';

          }


          else {

            past
              .classList
              .add(
                'open'
              );


            this.textContent =

              'HIDE PAST SHOWS ↑';

          }

        }

      );



    /* ==========================================
       START
       ========================================== */

    loadCalendar();

  </script>

</body>
