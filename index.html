/* =========================================================
   GOOGLE CALENDAR
   ★ 2018年から取得
   ★ 250件を超えても全件取得
   ========================================================= */

async function loadCalendar() {

  const now =
    new Date();


  const timeMinDate =
    new Date(
      '2018-01-01T00:00:00+09:00'
    );


  const timeMaxDate =
    new Date(now);


  timeMaxDate.setFullYear(
    timeMaxDate.getFullYear() + 2
  );


  try {

    const allEvents = [];

    let pageToken = '';


    do {

      const params =
        new URLSearchParams({
          key: API_KEY,
          singleEvents: 'true',
          orderBy: 'startTime',
          timeMin: timeMinDate.toISOString(),
          timeMax: timeMaxDate.toISOString(),
          maxResults: '250'
        });


      if (pageToken) {

        params.set(
          'pageToken',
          pageToken
        );

      }


      const url =
        'https://www.googleapis.com/calendar/v3/calendars/'
        +
        encodeURIComponent(
          CALENDAR_ID
        )
        +
        '/events?'
        +
        params.toString();


      const response =
        await fetch(url);


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(errorText);


        throw new Error(
          'Calendar request failed'
        );

      }


      const data =
        await response.json();


      allEvents.push(
        ...(data.items || [])
      );


      pageToken =
        data.nextPageToken || '';


    } while (pageToken);


    const events =
      allEvents
        .filter(
          event =>
            event.start &&
            event.end
        );


    upcomingEvents =
      events
        .filter(
          event =>
            eventEnd(event) >= now
        )
        .sort(
          (a,b) =>
            eventStart(a) -
            eventStart(b)
        );


    pastEvents =
      events
        .filter(
          event =>
            eventEnd(event) < now
        )
        .sort(
          (a,b) =>
            eventStart(b) -
            eventStart(a)
        );


    buildMonthFilters();

    renderEvents();

    if (window.location.hash) {
      requestAnimationFrame(() => {
        const target = document.getElementById(
          decodeURIComponent(window.location.hash.slice(1))
        );
        if (target) {
          target.scrollIntoView({ block:'center' });
        }
      });
    }

  }


  catch (error) {

    console.error(error);


    document
      .getElementById(
        'events'
      )
      .innerHTML = `

        <div class="message">
          Could not load the live schedule.
        </div>

      `;

  }

}



/* =========================================================
   ARCHIVE DATA / EXPLORE / SUGGESTIONS
   ========================================================= */

function getArchiveData() {
  const players = new Map();
  const venues = new Map();
  const years = new Map();

  [...upcomingEvents, ...pastEvents].forEach(event => {
    const info = parseDescription(event.description || '');

    splitPlayersIntoPeople(info.players || []).forEach(p => {
      if (!p.name) return;
      const key = normalizePlayerName(p.name);
      if (!players.has(key)) players.set(key, { name:p.name, role:p.role, count:0 });
      players.get(key).count++;
    });

    const venue = info.place || getVenue(event.location || '');
    if (venue) {
      const key = normalizeSearchText(venue);
      if (!venues.has(key)) venues.set(key, { name:venue, count:0 });
      venues.get(key).count++;
    }

    const year = getEventYear(event);
    years.set(year, (years.get(year) || 0) + 1);
  });

  return {
    players:[...players.values()].sort((a,b) => a.name.localeCompare(b.name,'ja')),
    venues:[...venues.values()].sort((a,b) => a.name.localeCompare(b.name,'ja')),
    years:[...years.entries()].sort((a,b) => Number(b[0])-Number(a[0]))
  };
}

function getArchiveStatsHTML() {
  const data = getArchiveData();
  const shows = pastEvents.length;

  // Count only players and venues appearing in past shows.
  const players = new Set();
  const venues = new Set();

  pastEvents.forEach(event => {
    const info = parseDescription(event.description || '');

    splitPlayersIntoPeople(info.players || []).forEach(p => {
      if (p.name) players.add(normalizePlayerName(p.name));
    });

    const venue = info.place || getVenue(event.location || '');
    if (venue) venues.add(normalizeSearchText(venue));
  });

  return `
    <div class="archive-stats">
      <span><strong>${shows}</strong> SHOWS</span>
      <span><strong>${players.size}</strong> PLAYERS</span>
      <span><strong>${venues.size}</strong> VENUES</span>
    </div>
  `;
}

function getSuggestions(query) {
  const q = normalizeSearchText(query);
  if (!q) return [];

  const data = getArchiveData();
  const results = [];
  const seen = new Set();

  const pushUnique = item => {
    const key = `${normalizeSearchText(item.name)}|${item.type}`;
    if (seen.has(key)) return;
    seen.add(key);
    results.push(item);
  };

  getPeopleDirectory().forEach(person => {
    const names = [person.name, ...(person.aliases || [])].filter(Boolean);
    const matches = names.some(name => {
      const normalizedName = normalizeSearchText(name);
      const compactName = normalizePlayerName(name);
      const compactQuery = normalizePlayerName(query);
      return normalizedName.includes(q) || compactName.includes(compactQuery);
    });

    if (matches) pushUnique({name:person.name,type:'PLAYER'});
  });

  data.players.forEach(p => {
    const identity = getPersonIdentity(p.name);
    const displayName = identity?.name || p.name;
    const playerName = normalizeSearchText(p.name);
    const compactPlayer = normalizePlayerName(p.name);
    const compactQuery = normalizePlayerName(query);

    if (playerName.includes(q) || compactPlayer.includes(compactQuery)) {
      pushUnique({name:displayName,type:'PLAYER'});
    }
  });

  getRecordings().forEach(recording => {
    recordingPeople(recording).forEach(person => {
      const allNames = [person.name, person.displayName || '', ...(person.aliases || [])].filter(Boolean);
      const matches = allNames.some(name => {
        const normalizedName = normalizeSearchText(name);
        const compactName = normalizePlayerName(name);
        const compactQuery = normalizePlayerName(query);
        return normalizedName.includes(q) || compactName.includes(compactQuery);
      });

      if (matches) pushUnique({name:person.name,type:'PLAYER'});
    });

    (recording.searchNames || []).forEach(name => {
      if (normalizeSearchText(name).includes(q)) {
        pushUnique({name,type:'RECORDING'});
      }
    });
  });

  data.venues.forEach(v => {
    if (normalizeSearchText(v.name).includes(q)) {
      pushUnique({name:v.name,type:'VENUE'});
    }
  });

  return results.slice(0,8);
}

function renderSuggestions() {
  const box = document.getElementById('searchSuggestions');
  const suggestions = getSuggestions(showSearch.value);
  activeSuggestionIndex = -1;

  if (!showSearch.value.trim() || !suggestions.length) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }

  box.innerHTML = suggestions.map((item,i) => `
    <button class="search-suggestion" type="button" role="option" data-suggestion="${escapeHTML(item.name)}" data-suggestion-index="${i}">
      <span class="search-suggestion-name">${escapeHTML(item.name)}</span>
      <span class="search-suggestion-type">${item.type}</span>
    </button>
  `).join('');
  box.hidden = false;
}

/* =========================================================
   SEARCH INPUT + URL STATE
   ========================================================= */

const showSearch = document.getElementById('showSearch');
const showSearchClear = document.getElementById('showSearchClear');

function setSearchQuery(value, { updateURL = true } = {}) {
  searchQuery = String(value || '');
  showSearch.value = searchQuery;
  showSearchClear.hidden = !searchQuery.trim();

  if (updateURL) {
    syncSearchURL();
  }

  renderEvents();
}

function initializeSearchFromURL() {
  const params = new URLSearchParams(window.location.search);
  const initialSearch = params.get('search') || '';

  if (initialSearch) {
    searchQuery = initialSearch;
    showSearch.value = initialSearch;
    showSearchClear.hidden = false;
  }
}

showSearch.addEventListener('input', () => {
  searchQuery = showSearch.value;
  showSearchClear.hidden = !searchQuery.trim();
  syncSearchURL();
  renderEvents();
  renderSuggestions();
});

showSearchClear.addEventListener('click', () => {
  setSearchQuery('');

  const box = document.getElementById('searchSuggestions');
  if (box) {
    box.hidden = true;
    box.innerHTML = '';
  }

  activeSuggestionIndex = -1;
  showSearch.focus();
});

showSearch.addEventListener('keydown', event => {
  const box = document.getElementById('searchSuggestions');
  const items = [...box.querySelectorAll('.search-suggestion')];

  if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && items.length && !box.hidden) {
    event.preventDefault();
    activeSuggestionIndex += event.key === 'ArrowDown' ? 1 : -1;
    activeSuggestionIndex = (activeSuggestionIndex + items.length) % items.length;
    items.forEach((item,i) => item.classList.toggle('active', i === activeSuggestionIndex));
    items[activeSuggestionIndex].scrollIntoView({block:'nearest'});
    return;
  }

  if (event.key === 'Enter' && activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
    event.preventDefault();
    setSearchQuery(items[activeSuggestionIndex].dataset.suggestion || '');
    box.hidden = true;
    return;
  }

  if (event.key === 'Escape') {
    if (!box.hidden) {
      box.hidden = true;
      activeSuggestionIndex = -1;
    } else if (showSearch.value) {
      setSearchQuery('');
    }
  }
});

function setMenu(open){
  menuToggle.classList.toggle('open', open);
  siteMenu.classList.toggle('open', open);
  menuBackdrop.classList.toggle('open', open);
  menuToggle.setAttribute('aria-expanded', String(open));
  menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
menuToggle.addEventListener('click', () => setMenu(!siteMenu.classList.contains('open')));
menuBackdrop.addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', e => { if(e.key === 'Escape') setMenu(false); });

function updateMediaGallery(gallery){
  const track=gallery.querySelector('[data-media-track]');
  const items=[...gallery.querySelectorAll('.event-media-item')];
  if(!track||!items.length)return;
  const left=track.getBoundingClientRect().left;
  let idx=0,dist=Infinity;
  items.forEach((item,i)=>{const d=Math.abs(item.getBoundingClientRect().left-left);if(d<dist){dist=d;idx=i}});
  const current=gallery.querySelector('[data-media-current]');if(current)current.textContent=String(idx+1);
  gallery.querySelectorAll('[data-media-dot]').forEach((dot,i)=>dot.classList.toggle('active',i===idx));
}
document.addEventListener('scroll',e=>{const track=e.target.closest?.('[data-media-track]');if(track){const g=track.closest('[data-media-gallery]');if(g)updateMediaGallery(g)}},true);
document.addEventListener('click',e=>{const dot=e.target.closest('[data-media-dot]');if(!dot)return;const g=dot.closest('[data-media-gallery]'),track=g?.querySelector('[data-media-track]'),items=g?[...g.querySelectorAll('.event-media-item')]:[],i=Number(dot.dataset.mediaDot);if(track&&items[i])track.scrollTo({left:items[i].offsetLeft,behavior:'smooth'})});



/* RESERVATION MODAL */
const reservationModal=document.getElementById('reservationModal');
const reservationClose=document.getElementById('reservationClose');
const reservationForm=document.getElementById('reservationForm');
const reservationTitle=document.getElementById('reservationTitle');
const reservationLive=document.getElementById('reservationLive');

document.addEventListener('click',e=>{
  const button=e.target.closest('[data-reservation-me]');
  if(!button)return;
  const title=button.dataset.reservationTitle||'Live';
  const date=button.dataset.reservationDate||'';
  reservationTitle.textContent=title;
  reservationLive.value=[date,title].filter(Boolean).join(' — ');
  reservationModal.classList.add('open');
  reservationModal.setAttribute('aria-hidden','false');
  document.body.classList.add('reservation-open');
});
function closeReservation(){reservationModal.classList.remove('open');reservationModal.setAttribute('aria-hidden','true');document.body.classList.remove('reservation-open')}
reservationClose.addEventListener('click',closeReservation);
reservationModal.addEventListener('click',e=>{if(e.target===reservationModal)closeReservation()});
reservationForm.addEventListener('submit',e=>{
  e.preventDefault();
  const live=reservationLive.value;
  const name=document.getElementById('reservationName').value.trim();
  const reply=document.getElementById('reservationEmail').value.trim();
  const guests=document.getElementById('reservationGuests').value;
  const message=document.getElementById('reservationMessage').value.trim();
  const subject=encodeURIComponent(`Reservation: ${live}`);
  const body=encodeURIComponent(`LIVE: ${live}\
NAME: ${name}\
EMAIL: ${reply}\
NUMBER OF GUESTS: ${guests}\
\
MESSAGE:\
${message}`);
  window.location.href=`mailto:${EMAIL_ADDRESS}?subject=${subject}&body=${body}`;
});


/* MEDIA CAROUSEL ARROWS */
function updateMediaNav(viewport){
  if(!viewport)return;
  const track=viewport.querySelector('.event-media-track');
  const prev=viewport.querySelector('.event-media-nav.prev');
  const next=viewport.querySelector('.event-media-nav.next');
  if(!track||!prev||!next)return;
  const count=track.querySelectorAll('.event-media-item').length;
  if(count<=1){prev.hidden=true;next.hidden=true;return;}
  const max=Math.max(0,track.scrollWidth-track.clientWidth);
  prev.hidden=track.scrollLeft<=2;
  next.hidden=track.scrollLeft>=max-2;
}
function refreshAllMediaNav(){
  document.querySelectorAll('.event-media-viewport').forEach(updateMediaNav);
}
document.addEventListener('click',e=>{
  const button=e.target.closest('.event-media-nav');
  if(!button)return;
  e.preventDefault();e.stopPropagation();
  const viewport=button.closest('.event-media-viewport');
  const track=viewport&&viewport.querySelector('.event-media-track');
  if(!track)return;
  track.scrollBy({left:(button.classList.contains('prev')?-1:1)*track.clientWidth,behavior:'smooth'});
  setTimeout(()=>updateMediaNav(viewport),400);
});
document.addEventListener('scroll',e=>{
  const track=e.target;
  if(track instanceof Element&&track.classList.contains('event-media-track')){
    updateMediaNav(track.closest('.event-media-viewport'));
  }
},true);
window.addEventListener('resize',refreshAllMediaNav);
const mediaNavObserver=new MutationObserver(refreshAllMediaNav);
mediaNavObserver.observe(document.getElementById('events'),{childList:true,subtree:true});
