<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Akihiro Kokufukata | Live Schedule</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Helvetica Neue", Arial, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 38px 20px 80px;
    }

    header {
      margin-bottom: 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin-top: 7px;
      color: #999;
      font-size: 18px;
    }

    .section-title {
      margin: 35px 0 18px;
      color: #aaa;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* LIVE CARD */

    .event {
      background: #191919;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .event-date {
      color: #d7aa74;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 9px;
    }

    .event-title {
      margin: 0 0 20px;
      font-size: 23px;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }

    .label {
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .players {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .more-players {
  margin-top: 0;
}

.show-more {
  display: inline-block;
  margin-top: 10px;
  padding: 0;
  border: none;
  background: none;
  color: #d7aa74;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}
    
    .venue {
      font-size: 17px;
      font-weight: 650;
      line-height: 1.4;
    }

    .place {
      color: #aaa;
      margin-top: 5px;
      font-size: 14px;
    }

    .map {
      display: inline-block;
      margin-top: 14px;
      color: #d7aa74;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* PAST SHOWS */

    .past-button {
      width: 100%;
      margin-top: 30px;
      padding: 17px;
      border: 1px solid #333;
      border-radius: 14px;
      background: transparent;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
    }

    #past {
      display: none;
      margin-top: 20px;
    }

    #past .event {
      opacity: 0.5;
    }

    .loading {
      color: #888;
      padding: 30px 0;
    }

    .error {
      color: #d98b8b;
      padding: 25px 0;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      main {
        padding: 30px 16px 70px;
      }

      .event {
        padding: 20px;
      }

      .event-title {
        font-size: 21px;
      }
    }
  </style>
</head>


<body>

  <main>

    <header>
      <h1>Akihiro Kokufukata</h1>
      <div class="subtitle">Live Schedule</div>
    </header>

    <div class="section-title">UPCOMING SHOWS</div>

    <div id="upcoming">
      <div class="loading">Loading shows...</div>
    </div>

    <button class="past-button" id="pastButton">
      VIEW PAST SHOWS ↓
    </button>

    <div id="past">
      <div class="section-title">PAST SHOWS</div>
      <div id="pastEvents"></div>
    </div>

  </main>


  <script>

    /* =========================================
       ↓↓↓ この2ヶ所だけ変更してください ↓↓↓
       ========================================= */

    const API_KEY = 'AIzaSyCB5WplBrKEb70d5WHZTrg3G46fTdl_A0Q';

    const CALENDAR_ID = 'akihirokokufukatamusic@gmail.com';

    /* ========================================= */


    const upcomingElement =
      document.getElementById('upcoming');

    const pastElement =
      document.getElementById('pastEvents');


    /* HTMLとして解釈されないようにする */

    function escapeHTML(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    /*
      Google Calendarの説明欄から

      Players:
      名前
      名前

      Place: 下北沢

      を読み取る
    */

    function parseDescription(description = '') {

      const lines = description
        .replace(/\r/g, '')
        .split('\n');

      const players = [];

      let place = '';
      let readingPlayers = false;


      for (const rawLine of lines) {

        const line = rawLine.trim();


        /* Players: */

        if (/^players\s*:/i.test(line)) {

          readingPlayers = true;

          const sameLinePlayer =
            line.replace(/^players\s*:/i, '').trim();

          if (sameLinePlayer) {
            players.push(sameLinePlayer);
          }

          continue;
        }


        /* Place: */

        if (/^place\s*:/i.test(line)) {

          readingPlayers = false;

          place =
            line.replace(/^place\s*:/i, '').trim();

          continue;
        }


        /*
          Players: の後にある文字を
          Place: が来るまでメンバーとして読む
        */

        if (readingPlayers && line) {
          players.push(line);
        }
      }


      return {
        players,
        place
      };
    }


    /*
      Google Calendarの「場所」から
      長い住所を隠して会場名だけ取り出す
    */

    function getVenue(location = '') {

      if (!location) {
        return '';
      }

      return location
        .split(/[,、]/)[0]
        .trim();
    }


    /* 日付 */

    function formatDate(event) {

      const raw =
        event.start.dateTime ||
        event.start.date;

      const date =
        new Date(raw);


      return new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone: 'Asia/Tokyo',
          month: 'short',
          day: 'numeric',
          weekday: 'short'
        }
      )
      .format(date)
      .toUpperCase();
    }


    /* 開始時間 */

    function formatTime(event) {

      if (!event.start.dateTime) {
        return 'ALL DAY';
      }

      const date =
        new Date(event.start.dateTime);


      return new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone: 'Asia/Tokyo',
          hour: 'numeric',
          minute: '2-digit'
        }
      )
      .format(date);
    }


    /* ライブカード */

    function createEventCard(event) {

      const info =
        parseDescription(
          event.description || ''
        );


      const venue =
        getVenue(
          event.location || ''
        );


      const mapURL =
        event.location
          ? 'https://www.google.com/maps/search/?api=1&query=' +
            encodeURIComponent(event.location)
          : '';


      /* PLAYERS */

      let players =
        [...info.players];

      let playersHTML = '';


      if (players.length) {

        


      const visiblePlayers = players.slice(0, 6);
const hiddenPlayers = players.slice(6);

playersHTML = `
  <div class="label">
    PLAYERS
  </div>

  <div class="players">

    ${visiblePlayers
      .map(player => escapeHTML(player))
      .join('<br>')}

    ${
      hiddenPlayers.length
        ? `
          <div class="more-players" style="display:none;">
            ${hiddenPlayers
              .map(player => escapeHTML(player))
              .join('<br>')}
          </div>

          <button
            class="show-more"
            type="button"
            onclick="togglePlayers(this)"
          >
            SHOW MORE ↓
          </button>
        `
        : ''
    }

  </div>
`;


      /* VENUE */

      let venueHTML = '';


      if (venue || info.place) {

        venueHTML = `
          <div class="label">
            VENUE
          </div>

          ${
            venue
              ? `
                <div class="venue">
                  ${escapeHTML(venue)}
                </div>
              `
              : ''
          }

          ${
            info.place
              ? `
                <div class="place">
                  📍 ${escapeHTML(info.place)}
                </div>
              `
              : ''
          }

          ${
            mapURL
              ? `
                <a
                  class="map"
                  href="${mapURL}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  MAP ↗
                </a>
              `
              : ''
          }
        `;
      }


      return `
        <article class="event">

          <div class="event-date">
            ${formatDate(event)}
            &nbsp;·&nbsp;
            ${formatTime(event)}
          </div>

          <h2 class="event-title">
            ${escapeHTML(
              event.summary || 'Live'
            )}
          </h2>

          ${playersHTML}

          ${venueHTML}

        </article>
      `;
    }

function togglePlayers(button) {

  const morePlayers =
    button.previousElementSibling;

  const isOpen =
    morePlayers.style.display === 'block';

  morePlayers.style.display =
    isOpen ? 'none' : 'block';

  button.textContent =
    isOpen
      ? 'SHOW MORE ↓'
      : 'SHOW LESS ↑';
}
        
    /* Google Calendarを読み込む */

    async function loadCalendar() {

      const now =
        new Date();


      /*
        過去1年から未来2年まで取得
      */

      const timeMin =
        new Date(
          now.getFullYear() - 1,
          now.getMonth(),
          now.getDate()
        ).toISOString();


      const timeMax =
        new Date(
          now.getFullYear() + 2,
          now.getMonth(),
          now.getDate()
        ).toISOString();


      const url =
        'https://www.googleapis.com/calendar/v3/calendars/' +
        encodeURIComponent(CALENDAR_ID) +
        '/events' +
        '?key=' +
        encodeURIComponent(API_KEY) +
        '&singleEvents=true' +
        '&orderBy=startTime' +
        '&timeMin=' +
        encodeURIComponent(timeMin) +
        '&timeMax=' +
        encodeURIComponent(timeMax) +
        '&maxResults=250';


      try {

        const response =
          await fetch(url);


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(errorText);

          throw new Error(
            'Calendar request failed'
          );
        }


        const data =
          await response.json();


        const events =
          data.items || [];


        const upcoming = [];
        const past = [];


        events.forEach(event => {

          if (!event.start || !event.end) {
            return;
          }


          const endValue =
            event.end.dateTime ||
            event.end.date;


          const endDate =
            new Date(endValue);


          if (endDate < now) {
            past.push(event);
          }
          else {
            upcoming.push(event);
          }

        });


        /* UPCOMING */

        if (upcoming.length) {

          upcomingElement.innerHTML =
            upcoming
              .map(event =>
                createEventCard(event)
              )
              .join('');
        }
        else {

          upcomingElement.innerHTML =
            '<div class="loading">No upcoming shows.</div>';
        }


        /* PAST */

        past.reverse();


        if (past.length) {

          pastElement.innerHTML =
            past
              .map(event =>
                createEventCard(event)
              )
              .join('');
        }
        else {

          pastElement.innerHTML =
            '<div class="loading">No past shows.</div>';
        }

      }

      catch (error) {

        console.error(error);

        upcomingElement.innerHTML = `
          <div class="error">
            Could not load the live schedule.
          </div>
        `;
      }
    }


    /* Past Showsボタン */

    document
      .getElementById('pastButton')
      .addEventListener(
        'click',
        function () {

          const past =
            document.getElementById('past');


          const isOpen =
            past.style.display === 'block';


          past.style.display =
            isOpen
              ? 'none'
              : 'block';


          this.textContent =
            isOpen
              ? 'VIEW PAST SHOWS ↓'
              : 'HIDE PAST SHOWS ↑';
        }
      );


    /* START */

    loadCalendar();

  </script>

</body>
</html>
