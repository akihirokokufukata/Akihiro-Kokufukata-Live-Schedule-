<style>

:root {
  --paper: #f3eee5;
  --card: #f7f2e9;
  --ink: #181313;
  --muted: #756b66;
  --crimson: #98182a;
  --crimson-dark: #76101f;
  --blush: #d8aaa5;
  --line: #cfc2b6;

  --serif: "Cormorant Garamond", Georgia, serif;

  --sans: "Space Grotesk", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

main {

  width: 100%;
  max-width: 1100px;
  margin: 0 auto;

}


/* =========================================================
   TRUMPET
   ========================================================= */




/* =========================================================
   HEADER
   ========================================================= */

header {
  position: relative;
  z-index: 2;
  padding: 25px 10px 78px;
}

.name-wrap {
  display: inline-block;
}

.artist-name {
  margin: 0;
  max-width: 640px;
  font-family: var(--serif);
  font-size: clamp(58px,8.5vw,100px);
  font-weight: 600;
  line-height: .82;
  letter-spacing: -3px;
}

.artist-name span {
  display: block;
}

.name-line {
  display: block;
  width: 100%;
  height: 1.5px;
  margin-top: 24px;
  background: var(--crimson);
  border: 0;
}

.artist-role {
  margin-top: 19px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
}


/* =========================================================
   SCHEDULE
   ========================================================= */

.schedule-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 27px;
}

.schedule-title {
  margin: 0;
  flex-shrink: 0;
  font-family: var(--serif);
  font-size: clamp(43px,6vw,65px);
  font-weight: 600;
  line-height: .95;
  letter-spacing: -1.5px;
}


/* =========================================================
   MAIN FILTER
   ========================================================= */

.month-filter {
  display: flex;
  flex-shrink: 0;
  height: 29px;
  border: 1px solid var(--crimson);
}

.month-button {
  min-width: 47px;
  padding: 0 7px;
  border: 0;
  border-right: 1px solid var(--crimson);
  background: transparent;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 7px;
  font-weight: 600;
  letter-spacing: .8px;
  cursor: pointer;
}

.month-button:last-child {
  border-right: 0;
}

.month-button.active {
  background: var(--crimson);
  color: var(--paper);
}


/* =========================================================
   PAST MONTH FILTER
   ========================================================= */

.past-month-wrap {
  width: 100%;
  margin: -3px 0 24px;
}

.past-year-filter,
.past-month-filter {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}

.past-month-filter {
  margin-top: 8px;
}

.past-year-button,
.past-month-button {
  flex: 0 0 auto;
  padding: 10px 15px 9px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 1.2px;
  cursor: pointer;
  white-space: nowrap;
}

.past-year-button:first-child,
.past-month-button:first-child {
  padding-left: 4px;
}

.past-year-button.active,
.past-month-button.active {
  color: var(--crimson);
}

.past-year-button.active::after,
.past-month-button.active::after {
  content: "";
  display: block;
  width: 100%;
  height: 2px;
  margin-top: 7px;
  background: var(--crimson);
}

.past-month-filter[hidden] {
  display: none;
}


/* =========================================================
   EVENT
   ========================================================= */

.event {
  position: relative;
  display: grid;
  grid-template-columns: 125px minmax(0,1fr);
  margin-bottom: 16px;
  background: rgba(247,242,233,.66);
  border: 1px solid var(--line);
  overflow: hidden;
}

.event.leader {
  border-color: var(--crimson);
}

.status {
  position: absolute;
  top: 0;
  left: 0;
  min-width: 125px;
  padding: 10px 16px;
  background: var(--crimson);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2.3px;
  text-align: center;
  z-index: 2;
}


/* =========================================================
   DATE
   ========================================================= */

.event-date-column {
  padding: 28px 22px 24px;
  border-right: 1px solid var(--line);
}

.event.has-status .event-date-column {
  padding-top: 63px;
}

.event-month {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 1px;
}

.event-number {
  margin-top: -3px;
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 55px;
  font-weight: 600;
  line-height: .92;
}

.event-day {
  margin-top: 4px;
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 2px;
}

.date-rule {
  width: 100%;
  height: 1px;
  margin: 15px 0;
  background: var(--line);
}

.event-time {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
}


/* =========================================================
   BODY
   ========================================================= */

.event-body {
  position: relative;
  min-width: 0;
  padding: 27px 28px 25px;
}

.leader-label,
.next-label {
  position: relative;
  z-index: 2;
  margin-bottom: 8px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.event-title {
  position: relative;
  z-index: 2;
  margin: 0 0 21px;
  font-family: var(--jp);
  font-size: clamp(20px,3vw,27px);
  font-weight: 600;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.event-title.english {
  font-family: var(--serif);
  font-size: clamp(26px,3.3vw,34px);
  line-height: 1.05;
}

.label {
  margin-bottom: 8px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}


/* =========================================================
   PLAYERS
   ========================================================= */

.players-section {
  margin-bottom: 24px;
}

.players {
  color: #342c29;
  font-family: var(--jp);
  font-size: 14px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.player {
  display: block;
}

.hidden-players {
  display: none;
}

.hidden-players.open {
  display: block;
}

.show-more {
  display: inline-block;
  margin-top: 11px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
}


/* =========================================================
   VENUE
   ========================================================= */

.venue-section {
  margin-top: 4px;
}

.venue {
  font-family: var(--jp);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
}

.action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 108px;
  padding: 10px 16px;
  border: 1px solid var(--crimson);
  color: var(--crimson);
  background: transparent;
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.7px;
  text-decoration: none;
}

.action:hover {
  background: var(--crimson);
  color: var(--paper);
}

button.action {
  cursor: pointer;
}

.action.email {
  min-width: 130px;
}


/* =========================================================
   LEADER SHOW
   ========================================================= */

.leader-shape {
  position: absolute;
  top: 0;
  right: 0;
  width: 115px;
  height: 95px;
  overflow: hidden;
  pointer-events: none;
  opacity: .9;
}

.leader-shape::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 58px;
  height: 58px;
  background: rgba(152,24,42,.82);
}

.leader-shape::after {
  content: "";
  position: absolute;
  right: 25px;
  top: 25px;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: rgba(216,170,165,.45);
}




/* MEDIA ARCHIVE */
.event-media{margin-top:22px;width:100%;min-width:0}
.event-media-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.event-media-title,.event-media-count{font-family:var(--sans);font-size:8px;font-weight:600;letter-spacing:1.7px;color:var(--crimson)}
.event-media-count{color:var(--muted);letter-spacing:1px}
.event-media-viewport{position:relative;width:100%;padding:0 25px;overflow:hidden}
.event-media-track{display:flex;width:100%;gap:0;overflow-x:auto;overflow-y:hidden;padding:0;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.event-media-track::-webkit-scrollbar{display:none}
.event-media-item{position:relative;flex:0 0 100%;width:100%;min-width:100%;scroll-snap-align:start;scroll-snap-stop:always;background:var(--card);overflow:hidden}
.event-media-image-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in;touch-action:manipulation}
.event-media-image{display:block;width:100%;height:auto;object-fit:contain;background:var(--card)}
.event-media-item.photo .event-media-image{width:100%;height:auto;object-fit:contain}
.event-media-badge{position:absolute;top:10px;left:10px;z-index:3;padding:6px 8px 5px;background:rgba(152,24,42,.92);color:var(--paper);font-family:var(--sans);font-size:7px;font-weight:600;letter-spacing:1.3px;pointer-events:none}
.event-media-video{display:block;width:100%;background:#181313;overflow:hidden}
.event-media-video.youtube{aspect-ratio:16/9}
.event-media-video iframe{display:block;width:100%;height:100%;border:0}
.event-media-link{display:flex;align-items:center;justify-content:center;width:100%;padding:42px 22px 28px;background:linear-gradient(135deg,rgba(152,24,42,.96),rgba(118,16,31,.96));color:var(--paper);text-decoration:none;text-align:center}
.event-media-link.youtube,.event-media-link.video{aspect-ratio:16/9}
.event-media-link.instagram{aspect-ratio:9/16;max-height:78vh}
.event-media-link-inner{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:1.7px;line-height:1.7}
.event-media-play{display:block;margin-bottom:12px;font-family:var(--serif);font-size:38px;line-height:1}
.event-media-dots{display:flex;gap:6px;align-items:center;margin-top:10px}
.event-media-dot{width:5px;height:5px;padding:0;border:1px solid var(--crimson);border-radius:50%;background:transparent;cursor:pointer}
.event-media-dot.active{background:var(--crimson)}
.event-media-hint{margin-top:7px;color:var(--muted);font-family:var(--sans);font-size:7px;font-weight:600;letter-spacing:1.3px}

.event-media-nav{
  position:absolute;
  top:50%;
  z-index:6;
  width:34px;
  height:46px;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--crimson);
  font-family:Georgia,serif;
  font-size:30px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translateY(-50%);
  cursor:pointer;
  text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.5);
  opacity:.92;
  transition:opacity .18s ease,transform .18s ease;
}
.event-media-nav:hover{
  background:transparent;
  opacity:1;
}
.event-media-nav:active{
  transform:translateY(-50%) scale(.9);
}
.event-media-nav.prev{left:-2px}
.event-media-nav.next{right:-2px}
.event-media-nav[hidden]{display:none}
@media(max-width:650px){
  .event-media-nav{width:28px;height:40px;font-size:25px}
  .event-media-nav.prev{left:-2px}
  .event-media-nav.next{right:-2px}
}

@media(max-width:650px){.event-media-viewport{padding:0 21px}.event-media{margin-top:20px}.event-media-title,.event-media-count{font-size:7px}.event-media-badge{top:8px;left:8px}.event-media-link-inner{font-size:9px}}

/* =========================================================
   INLINE FLYER
   ========================================================= */

.event-flyer { margin-top: 22px; }
.event-flyer-button {
  display:block; width:100%; padding:0; border:0;
  background:transparent; cursor:zoom-in; text-align:left;
}
.event-flyer-image {
  display:block; width:100%; max-width:430px; height:auto;
  max-height:620px; object-fit:contain; object-position:left top;
  border:1px solid var(--line); background:var(--card);
  transition:opacity .18s ease;
}
.event-flyer-button:hover .event-flyer-image { opacity:.92; }
.event-flyer-hint {
  margin-top:7px; color:var(--muted); font-family:var(--sans);
  font-size:7px; font-weight:600; letter-spacing:1.4px;
  text-transform:uppercase;
}

/* =========================================================
   FLYER
   ========================================================= */

.flyer-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(24,19,19,.82);
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s ease, visibility .22s ease;
}

.flyer-modal.open {
  opacity: 1;
  visibility: visible;
}

.flyer-modal-inner {
  position: relative;
  max-width: min(680px, 92vw);
  max-height: 90vh;
}

.flyer-modal-image {
  display: block;
  max-width: 100%;
  max-height: 86vh;
  width: auto;
  height: auto;
  object-fit: contain;
  background: var(--card);
  box-shadow: 0 18px 55px rgba(0,0,0,.28);
}

.flyer-close {
  position: absolute;
  top: -42px;
  right: 0;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--paper);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
}

body.flyer-open {
  overflow: hidden;
}

.flyer-nav {
  position: fixed;
  top: 50%;
  z-index: 102;
  width: 28px;
  height: 38px;
  border: 0;
  background: transparent;
  color: var(--paper);
  font-size: 22px;
  text-shadow: 0 1px 5px rgba(0,0,0,.85);
  line-height: 1;
  transform: translateY(-50%);
  cursor: pointer;
}
.flyer-nav-prev { left: 12px; }
.flyer-nav-next { right: 12px; }
.flyer-nav[hidden] { display:none; }

@media (max-width:650px) {
  .flyer-nav {
    width: 24px;
    height: 34px;
    font-size: 16px;
  }
  .flyer-nav-prev { left: 5px; }
  .flyer-nav-next { right: 5px; }
}

   PAST
   ========================================================= */

.past-heading {

.past-event {

<script>


const API_KEY =
  SETTINGS.API_KEY;

const CALENDAR_ID =
  SETTINGS.CALENDAR_ID;

const EMAIL_ADDRESS =
  SETTINGS.EMAIL_ADDRESS;


let upcomingEvents = [];
let pastEvents = [];

let selectedFilter = 'all';
let searchQuery = '';
let activeSuggestionIndex = -1;

/* ★ PAST内の月 */
let selectedPastMonth = 'all';
let selectedPastYear = 'all';



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value = '') {

  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}



/* =========================================================
   WEBSITE
   ========================================================= */

function normalizeWebsiteURL(value = '') {

  let text =
    String(value).trim();


  const markdown =
    text.match(/\]\((https?:\/\/[^)\s]+)\)/i);


  if (markdown) {
    text = markdown[1];
  }


  const plain =
    text.match(/https?:\/\/[^\s<>"')\]]+/i);


  if (!plain) {
    return '';
  }


  try {

    const url =
      new URL(plain[0]);


    if (
      url.protocol !== 'https:' &&
      url.protocol !== 'http:'
    ) {
      return '';
    }


    return url.href;

  }

  catch {
    return '';
  }

}



/* =========================================================
   IMAGE PATH
   ========================================================= */

function normalizeImagePath(value = '') {
  let text=String(value).trim();
  if(!text)return '';

  /* Google Calendar: filename.jpg (GitHub URL) の形にも対応 */
  const paren=text.match(/\((https?:\/\/[^)\s]+)\)/i);
  if(paren) text=paren[1];

  const md=text.match(/\]\((https?:\/\/[^)\s]+)\)/i);
  if(md) text=md[1];

  try{
    const url=new URL(text);
    if(url.hostname==='github.com' && url.pathname.includes('/blob/')){
      const parts=url.pathname.split('/').filter(Boolean);
      const i=parts.indexOf('blob');
      if(i>=2 && parts.length>i+2){
        const owner=parts[0], repo=parts[1], branch=parts[i+1];
        const path=parts.slice(i+2).join('/');
        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
      }
    }
  }catch{}

  if(/^https?:\/\//i.test(text))return text;

  text=text.split(/\s+/)[0];
  if(/^images\//i.test(text))return text;
  return `images/${text.replace(/^\.\//,'')}`;
}


function normalizeVideoURL(value=''){
  const text=String(value).trim();
  if(!text)return '';
  const md=text.match(/\]\((https?:\/\/[^)\s]+)\)/i);
  const hit=md?md[1]:(text.match(/https?:\/\/[^\s<>"')\]]+/i)||[])[0];
  if(!hit)return '';
  try{const u=new URL(hit);return (u.protocol==='https:'||u.protocol==='http:')?u.href:''}catch{return ''}
}
function getYouTubeEmbedURL(value=''){
  try{
    const u=new URL(value);let id='';
    if(u.hostname==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';
    if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){
      if(u.pathname==='/watch')id=u.searchParams.get('v')||'';
      else if(/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split('/').filter(Boolean)[1]||'';
    }
    return /^[A-Za-z0-9_-]{6,}$/.test(id)?`https://www.youtube-nocookie.com/embed/${id}`:'';
  }catch{return ''}
}
function getVideoPlatform(value=''){
  try{const h=new URL(value).hostname.replace(/^www\./,'').toLowerCase();if(['youtube.com','m.youtube.com','youtu.be'].includes(h))return 'YOUTUBE';if(['instagram.com','instagr.am'].includes(h))return 'INSTAGRAM'}catch{}
  return 'VIDEO';
}

/* =========================================================
   DESCRIPTION
   ========================================================= */

function parseDescription(description = '') {

  const text =
    String(description)
      .replace(/\r/g, '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/p>/gi, '\n')
      .replace(/<[^>]+>/g, '');

  const lines =
    text
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean);

  const players = [];
  const images = [];
  const photos = [];
  const videos = [];

  let place = '';
  let website = '';
  let reservation = '';
  let leader = false;

  // Optional Event / detail metadata.
  let descriptionText = '';
  let address = '';
  let open = '';
  let organizerPerson = '';
  let organizerOrg = '';
  let organizerURL = '';
  let ticketURL = '';
  let price = '';
  let currency = '';
  let availability = '';
  let free = null;
  let status = '';
  let previousStart = '';

  let readingPlayers = false;

  for (const line of lines) {

    if (/^players\s*:/i.test(line)) {
      readingPlayers = true;
      const sameLine = line.replace(/^players\s*:/i, '').trim();
      if (sameLine) players.push(sameLine);
      continue;
    }

    if (/^place\s*:/i.test(line)) {
      readingPlayers = false;
      place = line.replace(/^place\s*:/i, '').trim();
      continue;
    }

    if (/^address\s*:/i.test(line)) {
      readingPlayers = false;
      address = line.replace(/^address\s*:/i, '').trim();
      continue;
    }

    if (/^open\s*:/i.test(line)) {
      readingPlayers = false;
      open = line.replace(/^open\s*:/i, '').trim();
      continue;
    }

    if (/^description\s*:/i.test(line)) {
      readingPlayers = false;
      descriptionText = line.replace(/^description\s*:/i, '').trim();
      continue;
    }

    if (/^organizer-person\s*:/i.test(line)) {
      readingPlayers = false;
      organizerPerson = line.replace(/^organizer-person\s*:/i, '').trim();
      continue;
    }

    if (/^organizer-org\s*:/i.test(line)) {
      readingPlayers = false;
      organizerOrg = line.replace(/^organizer-org\s*:/i, '').trim();
      continue;
    }

    if (/^organizer-url\s*:/i.test(line)) {
      readingPlayers = false;
      organizerURL = normalizeWebsiteURL(
        line.replace(/^organizer-url\s*:/i, '').trim()
      );
      continue;
    }

    if (/^ticket-url\s*:/i.test(line)) {
      readingPlayers = false;
      ticketURL = normalizeWebsiteURL(
        line.replace(/^ticket-url\s*:/i, '').trim()
      );
      continue;
    }

    if (/^price\s*:/i.test(line)) {
      readingPlayers = false;
      price = line.replace(/^price\s*:/i, '').trim();
      continue;
    }

    if (/^currency\s*:/i.test(line)) {
      readingPlayers = false;
      currency = line.replace(/^currency\s*:/i, '').trim().toUpperCase();
      continue;
    }

    if (/^availability\s*:/i.test(line)) {
      readingPlayers = false;
      availability = line.replace(/^availability\s*:/i, '').trim().toLowerCase();
      continue;
    }

    if (/^free\s*:/i.test(line)) {
      readingPlayers = false;
      const value = line.replace(/^free\s*:/i, '').trim().toLowerCase();

      if (['yes','true','1','free'].includes(value)) {
        free = true;
      } else if (['no','false','0','paid'].includes(value)) {
        free = false;
      }

      continue;
    }

    if (/^status\s*:/i.test(line)) {
      readingPlayers = false;
      status = line.replace(/^status\s*:/i, '').trim().toLowerCase();
      continue;
    }

    if (/^previous-start\s*:/i.test(line)) {
      readingPlayers = false;
      previousStart = line.replace(/^previous-start\s*:/i, '').trim();
      continue;
    }

    if (/^(website|venueurl)\s*:/i.test(line)) {
      readingPlayers = false;
      const raw = line.replace(/^(website|venueurl)\s*:/i, '').trim();
      website = normalizeWebsiteURL(raw);
      continue;
    }

    if (/^image\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeImagePath(line.replace(/^image\s*:/i,'').trim());
      if (value) images.push(value);
      continue;
    }

    if (/^photo\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeImagePath(line.replace(/^photo\s*:/i,'').trim());
      if (value) photos.push(value);
      continue;
    }

    if (/^video\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeVideoURL(line.replace(/^video\s*:/i,'').trim());
      if (value) videos.push(value);
      continue;
    }

    if (/^reservation\s*:/i.test(line)) {
      readingPlayers = false;
      const raw = line.replace(/^reservation\s*:/i, '').trim();
      reservation = /^me$/i.test(raw) ? 'me' : normalizeWebsiteURL(raw);
      continue;
    }

    if (/^leader\s*:/i.test(line)) {
      readingPlayers = false;
      const value = line.replace(/^leader\s*:/i, '').trim().toLowerCase();
      leader = ['yes','true','1','leader'].includes(value);
      continue;
    }

    // Legacy fields kept ignored for compatibility.
    if (/^(reserveurl|email)\s*:/i.test(line)) {
      readingPlayers = false;
      continue;
    }

    if (readingPlayers) {
      players.push(line);
    }
  }

  return {
    players,
    place,
    website,
    image: images[0] || '',
    images,
    photos,
    videos,
    reservation,
    leader,

    descriptionText,
    address,
    open,
    organizerPerson,
    organizerOrg,
    organizerURL,
    ticketURL,
    price,
    currency,
    availability,
    free,
    status,
    previousStart
  };

}

/* =========================================================
   VENUE
   ========================================================= */

function getVenue(location = '') {

  if (!location) {
    return '';
  }


  return location
    .split(/[,、]/)[0]
    .trim();

}



/* =========================================================
   DATE HELPERS
   ========================================================= */

function eventStart(event) {

  return new Date(
    event.start.dateTime ||
    event.start.date
  );

}


function eventEnd(event) {

  return new Date(
    event.end.dateTime ||
    event.end.date
  );

}


function tokyoDateKey(date) {

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    )
    .formatToParts(date);


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return (
    `${values.year}-${values.month}-${values.day}`
  );

}


function isToday(event) {

  return (
    tokyoDateKey(eventStart(event))
    ===
    tokyoDateKey(new Date())
  );

}



/* =========================================================
   DATE DISPLAY
   ========================================================= */

function getDateParts(event) {

  const date =
    eventStart(event);


  const month =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        month: 'short'
      }
    )
    .format(date)
    .toUpperCase();


  const number =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        day: '2-digit'
      }
    )
    .format(date);


  const weekday =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        weekday: 'short'
      }
    )
    .format(date)
    .toUpperCase();


  return {
    month,
    number,
    weekday
  };

}


function normalizeClockValue(value = '') {
  const match = String(value || '').trim().match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
  if (!match) return '';
  return `${String(match[1]).padStart(2,'0')}:${match[2]}`;
}

function formatClock12(value = '') {
  const normalized = normalizeClockValue(value);
  if (!normalized) return '';

  const [hourText, minute] = normalized.split(':');
  const hour24 = Number(hourText);
  const suffix = hour24 >= 12 ? 'PM' : 'AM';
  const hour12 = hour24 % 12 || 12;

  return `${hour12}:${minute} ${suffix}`;
}

function formatTime(event) {

  if (!event.start.dateTime) {
    return 'ALL DAY';
  }

  // Preserve the wall-clock time stored in Google Calendar.
  // This avoids converting an overseas show into Tokyo time.
  const direct =
    String(event.start.dateTime)
      .match(/T(\d{2}):(\d{2})/);

  if (direct) {
    return formatClock12(`${direct[1]}:${direct[2]}`);
  }

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone: event.start.timeZone || 'Asia/Tokyo',
      hour: 'numeric',
      minute: '2-digit'
    }
  )
  .format(eventStart(event));

}

function getEventStatusKey(info = {}, event = {}) {
  const explicit = String(info.status || '').trim().toLowerCase();

  if (['cancelled','canceled'].includes(explicit)) return 'cancelled';
  if (explicit === 'postponed') return 'postponed';
  if (explicit === 'rescheduled') return 'rescheduled';
  if (explicit === 'scheduled') return 'scheduled';

  if (event.status === 'cancelled') return 'cancelled';

  return 'scheduled';
}

function getEventStatusLabel(info = {}, event = {}) {
  const key = getEventStatusKey(info, event);
  if (key === 'cancelled') return 'CANCELLED';
  if (key === 'postponed') return 'POSTPONED';
  if (key === 'rescheduled') return 'RESCHEDULED';
  return '';
}

function getAvailabilityLabel(value = '') {
  const key = String(value || '').trim().toLowerCase().replace(/[\s_-]+/g,'');
  if (['instock','available'].includes(key)) return 'AVAILABLE';
  if (['soldout','outofstock'].includes(key)) return 'SOLD OUT';
  if (['preorder','presale'].includes(key)) return 'PRE-SALE';
  if (['limited','limitedavailability'].includes(key)) return 'LIMITED';
  return value ? String(value).toUpperCase() : '';
}

function getSchemaAvailabilityURL(value = '') {
  const key = String(value || '').trim().toLowerCase().replace(/[\s_-]+/g,'');
  if (['instock','available'].includes(key)) return 'https://schema.org/InStock';
  if (['soldout','outofstock'].includes(key)) return 'https://schema.org/SoldOut';
  if (['preorder','presale'].includes(key)) return 'https://schema.org/PreOrder';
  if (['limited','limitedavailability'].includes(key)) return 'https://schema.org/LimitedAvailability';
  return '';
}

function createEventTimeHTML(event, info = {}) {
  if (!event.start.dateTime) {
    return `<div class="event-time event-time-all-day">ALL DAY</div>`;
  }

  const openTime = formatClock12(info.open || '');
  const startTime = formatTime(event);

  return `
    <div class="event-time-stack">
      ${
        openTime
          ? `
            <div class="event-time-row">
              <span class="event-time-label">OPEN</span>
              <span class="event-time-value">${escapeHTML(openTime)}</span>
            </div>
          `
          : ''
      }
      <div class="event-time-row">
        <span class="event-time-label">START</span>
        <span class="event-time-value">${escapeHTML(startTime)}</span>
      </div>
    </div>
  `;
}

function formatChargeAmount(value = '') {
  return String(value || '').replace(
    /\d[\d,]*(?:\.\d+)?/g,
    token => {
      const normalized = token.replace(/,/g, '');

      if (!/^\d+(?:\.\d+)?$/.test(normalized)) {
        return token;
      }

      const [integerPart, decimalPart] = normalized.split('.');

      const formattedInteger =
        integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');

      return decimalPart !== undefined
        ? `${formattedInteger}.${decimalPart}`
        : formattedInteger;
    }
  );
}

function parseChargeDisplay(info = {}) {
  if (info.free === true) {
    return {
      free: true,
      regular: '',
      studentLabel: '',
      studentPrice: ''
    };
  }

  const raw = String(info.price || '').trim();

  if (!raw) {
    return {
      free: false,
      regular: '',
      studentLabel: '',
      studentPrice: ''
    };
  }

  /*
    Examples supported:
      Price:￥4400 / Students￥2750
      Price:￥4400 / Students ￥2750
      Price:￥4400 / Student￥2750

    Displayed vertically in the LEFT date/time column:
      CHARGE
      ￥4400
      STUDENTS
      ￥2750
  */
  const studentMatch =
    raw.match(
      /^(.*?)\s*(?:\/|｜|\|)\s*(students?|student)\s*[:：]?\s*(.+)$/i
    );

  if (studentMatch) {
    return {
      free: false,
      regular: studentMatch[1].trim(),
      studentLabel: /^students$/i.test(studentMatch[2]) ? 'STUDENTS' : 'STUDENT',
      studentPrice: studentMatch[3].trim()
    };
  }

  return {
    free: false,
    regular: raw,
    studentLabel: '',
    studentPrice: ''
  };
}

function getPublicAvailabilityLabel(value = '') {
  const key =
    String(value || '')
      .trim()
      .toLowerCase()
      .replace(/[\s_-]+/g,'');

  if (['instock','available',''].includes(key)) return '';
  if (['soldout','outofstock'].includes(key)) return 'SOLD OUT';
  if (['preorder','presale'].includes(key)) return 'PRE-SALE';
  if (['limited','limitedavailability'].includes(key)) return 'LIMITED';

  return '';
}

function createDateColumnMetaHTML(info = {}, isPast = false) {
  const charge = parseChargeDisplay(info);

  const availability =
    isPast
      ? ''
      : getPublicAvailabilityLabel(info.availability);

  const hasCharge =
    charge.free ||
    charge.regular ||
    charge.studentPrice;

  if (!hasCharge && !availability) return '';

  return `
    <div class="date-extra-info">
      ${
        hasCharge
          ? `
            <div class="date-extra-block">
              <div class="date-extra-label">CHARGE</div>

              ${
                charge.free
                  ? `
                    <div class="free-charge-badge">
                      FREE
                    </div>
                  `
                  : `
                    ${
                      charge.regular
                        ? `
                          <div class="date-extra-value">
                            ${escapeHTML(formatChargeAmount(charge.regular))}
                          </div>
                        `
                        : ''
                    }

                    ${
                      charge.studentPrice
                        ? `
                          <div class="student-charge">
                            <div class="student-charge-label">
                              ${escapeHTML(charge.studentLabel || 'STUDENTS')}
                            </div>
                            <div class="student-charge-value">
                              ${escapeHTML(formatChargeAmount(charge.studentPrice))}
                            </div>
                          </div>
                        `
                        : ''
                    }
                  `
              }
            </div>
          `
          : ''
      }

      ${
        availability
          ? `
            <div class="date-availability ${availability === 'SOLD OUT' ? 'sold-out' : ''}">
              ${escapeHTML(availability)}
            </div>
          `
          : ''
      }
    </div>
  `;
}

/* =========================================================
   MONTH HELPERS
   ========================================================= */

function getMonthKey(event) {

  const date =
    eventStart(event);


  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit'
      }
    )
    .formatToParts(date);


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return (
    `${values.year}-${values.month}`
  );

}


function getCurrentTokyoMonth() {

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit'
      }
    )
    .formatToParts(new Date());


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return {
    year: Number(values.year),
    month: Number(values.month)
  };

}


function makeMonthKey(year, month) {

  return (
    String(year)
    + '-'
    + String(month).padStart(2,'0')
  );

}


function getMonthName(year, month) {

  const date =
    new Date(
      Date.UTC(
        year,
        month - 1,
        1
      )
    );


  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone: 'UTC',
      month: 'short'
    }
  )
  .format(date)
  .toUpperCase();

}



/* =========================================================
   MAIN FILTER
   ========================================================= */

function buildMonthFilters() {

  const current =
    getCurrentTokyoMonth();


  let nextYear =
    current.year;

  let nextMonth =
    current.month + 1;


  if (nextMonth > 12) {

    nextMonth = 1;
    nextYear += 1;

  }


  const currentKey =
    makeMonthKey(
      current.year,
      current.month
    );


  const nextKey =
    makeMonthKey(
      nextYear,
      nextMonth
    );


  const filter =
    document.getElementById(
      'monthFilter'
    );


  filter.innerHTML = `

    <button
      class="month-button ${selectedFilter === 'all' ? 'active' : ''}"
      data-filter="all"
      type="button"
    >
      ALL
    </button>

    <button
      class="month-button ${selectedFilter === currentKey ? 'active' : ''}"
      data-filter="${currentKey}"
      type="button"
    >
      ${getMonthName(
        current.year,
        current.month
      )}
    </button>

    <button
      class="month-button ${selectedFilter === nextKey ? 'active' : ''}"
      data-filter="${nextKey}"
      type="button"
    >
      ${getMonthName(
        nextYear,
        nextMonth
      )}
    </button>

    <button
      class="month-button ${selectedFilter === 'past' ? 'active' : ''}"
      data-filter="past"
      type="button"
    >
      PAST
    </button>

  `;

}



/* =========================================================
   PAST MONTH FILTER
   ========================================================= */

function getPastMonths() {
  return [
    ...new Set(
      pastEvents.map(event => getMonthKey(event))
    )
  ];
}

function getPastYears() {
  return [
    ...new Set(
      getPastMonths().map(key => key.split('-')[0])
    )
  ];
}

function getPastMonthLabel(key) {
  const [year, month] = key.split('-').map(Number);
  return getMonthName(year, month);
}

function createPastMonthFilterHTML() {
  const months = getPastMonths();
  const years = getPastYears();

  if (!months.length) return '';

  const monthsForYear =
    selectedPastYear === 'all'
      ? []
      : months.filter(key => key.startsWith(`${selectedPastYear}-`));

  return `
    <div class="past-month-wrap">

      <div class="past-year-filter">
        <button
          class="past-year-button ${selectedPastYear === 'all' ? 'active' : ''}"
          data-past-year="all"
          type="button"
        >
          ALL
        </button>

        ${years.map(year => `
          <button
            class="past-year-button ${selectedPastYear === year ? 'active' : ''}"
            data-past-year="${year}"
            type="button"
          >
            ${year}

/* =========================================================
   JAPANESE
   ========================================================= */

function containsJapanese(text = '') {

  return /[\u3040-\u30ff\u3400-\u9fff]/
    .test(text);

}



/* =========================================================
   PLAYERS
   ========================================================= */

const PLAYER_ROLE_PATTERN =
  '(?:Con\\.?\\s*Arr\\.?\\s*Tb|Con\\.?Arr\\.?Tb|Tp|Tpt|Trumpet|Flh|Flugelhorn|' +
  'Tb|Tbn|Trombone|Bass-Tb|BassTb|Bass\\s*Trombone|Sax|Saxophones?|Alto\\s*Sax(?:ophone)?|Tenor\\s*Sax(?:ophone)?|Soprano\\s*Sax(?:ophone)?|Baritone\\s*Sax(?:ophone)?|A\\.?Sax|T\\.?Sax|B\\.?Sax|S\\.?Sax|Ts|As|Ss|Bs|Cl|Clarinet|B\\.?Cl|Bass\\s*Clarinet|' +
  'P|Pf|Piano|Key|Keyb|Keys|Keyboard|Synth|Synt|Org|Organ|G|Gt|Gtr|Guitar|' +
  'B|Ba|Bass|Db|Dr|Ds|D|Drum|Drums|Perc|Per|Percussion|Lp|Latin\\s*Percussion|Cond|Conductor|Arr|Arrange|Arranger|Rap|Per\\.?Synt|Perc\\.?Synt|' +
  'Vo|Vocals?|Cho|Chorus|Vln|Violin|Cello|Vc|Fl|Flute|Picc|Piccolo|DJ|Dance)';

const PLAYER_ROLE_TOKEN = new RegExp(`^${PLAYER_ROLE_PATTERN}\\.?$`, 'i');

function cleanPlayerRole(role = '') {
  return String(role).trim()
    .replace(/^[\(\[\{（【]\s*/, '')
    .replace(/\s*[\)\]\}）】]$/, '')
    .replace(/^[\-–—:：,，、\/／]\s*/, '')
    .replace(/\s*[\-–—:：]$/, '')
    .trim();
}

function canonicalizeRoleToken(token = '') {
  const raw = String(token).trim().replace(/\.$/, '');
  const compact = raw.replace(/\s+/g, '').replace(/\./g, '').toLowerCase();
  if (compact === 'conarrtb') return 'Con.Arr.Tb';
  // Bass-Tb means one instrument: Bass Trombone.
  if (compact === 'basstb' || compact === 'basstrombone') return 'Bass-Tb';
  if (compact === 'percussion' || compact === 'perc' || compact === 'per') return 'Per';
  if (compact === 'synthesizer' || compact === 'synthesiser' || compact === 'synth' || compact === 'synt') return 'Synt';
  if (compact === 'latinpercussion' || compact === 'lp') return 'Lp';
  if (compact === 'asax') return 'As';
  if (compact === 'tsax') return 'Ts';
  if (compact === 'bsax') return 'Bs';
  if (compact === 'ssax') return 'Ss';
  return raw;
}

function normalizeRoleList(role = '') {
  const cleaned = cleanPlayerRole(role);
  if (!cleaned) return '';
  if (/^Con\.?\s*Arr\.?\s*Tb\.?$/i.test(cleaned)) return 'Con.Arr.Tb';
  return cleaned.split(/\s*[,，、\/／]\s*/)
    .map(canonicalizeRoleToken).filter(Boolean).join('/');
}

function looksLikeRoleList(value = '') {
  const cleaned = cleanPlayerRole(value);
  if (!cleaned) return false;
  if (/^Con\.?\s*Arr\.?\s*Tb\.?$/i.test(cleaned)) return true;
  if (/^Bass\s*[-–—]?\s*(?:Tb|Tbn|Trombone)\.?$/i.test(cleaned)) return true;
  if (/^(?:Cond|P|Pf|Per|Perc|D|Dr|Ds|As|Ts|Bs|Ss)(?:\s*[\/／]\s*(?:Cond|Arr|As|Ts|Bs|Ss|P|Pf|Key|Keyb|Per|Perc|Synt))*$/i.test(cleaned)) return true;
  const tokens = cleaned.split(/\s*[,，、\/／]\s*/).map(v => v.trim()).filter(Boolean);
  return tokens.length > 0 && tokens.every(token => PLAYER_ROLE_TOKEN.test(token));
}

function extractPlayerNote(text = '') {
  let value = String(text).trim();
  let note = '';
  const m = value.match(/\s*(\((?:from|of|with)\s+[^()]+\))\s*$/i);
  if (m) {
    note = m[1].trim();
    value = value.slice(0, m.index).trim();
  }
  const guest = value.match(/\s*&\s*(Guests?)\s*$/i);
  if (guest) {
    note = note ? `${guest[1]} ${note}` : guest[1];
    value = value.slice(0, guest.index).trim();
  }

  return { value, note };
}

function splitPlayerDisplay(player = '', inheritedRole = '') {
  let text = String(player).trim().replace(/^[*＊•・]\s*/, '').trim();
  text = text.replace(/\s*[\(（\[【]\s*$/, '').trim();
  if (!text) return { name:'', role:'', note:'' };

  const noted = extractPlayerNote(text);
  text = noted.value;
  const note = noted.note;

  const prefix = text.match(new RegExp(`^(${PLAYER_ROLE_PATTERN})(?:\\.)?\\s*[:：]\\s*(.+)$`, 'i'));
  if (prefix) return { name:prefix[2].trim(), role:normalizeRoleList(prefix[1]), note };

  const bracket = text.match(/^(.*?)\s*[\(（\[【]\s*([^\)）\]】]+?)\s*[\)）\]】]\s*$/);
  if (bracket) {
    const rawRole = bracket[2].trim();
    if (/^Bass\s*[-–—]?\s*(?:Tb|Tbn|Trombone)\.?$/i.test(rawRole))
      return { name:bracket[1].trim(), role:'Bass-Tb', note };
    if (looksLikeRoleList(rawRole))
      return { name:bracket[1].trim(), role:normalizeRoleList(rawRole), note };
  }

  const roleDashName = text.match(/^(.+?)\s*(?:-|–|—)\s*(.+)$/);
  if (roleDashName && looksLikeRoleList(roleDashName[1]))
    return { name:roleDashName[2].trim(), role:normalizeRoleList(roleDashName[1]), note };

  const nameDashRole = text.match(/^(.*?)\s*(?:-|–|—|:|：)\s*(.+)$/);
  if (nameDashRole && looksLikeRoleList(nameDashRole[2]))
    return { name:nameDashRole[1].trim(), role:normalizeRoleList(nameDashRole[2]), note };

  const comma = text.match(/^(.*?)\s*[,，]\s*(.+)$/);
  if (comma && looksLikeRoleList(comma[2]))
    return { name:comma[1].trim(), role:normalizeRoleList(comma[2]), note };

  const suffix = text.match(new RegExp(`^(.*?)\\s+(${PLAYER_ROLE_PATTERN})(?:\\.)?$`, 'i'));
  if (suffix) return { name:suffix[1].trim(), role:normalizeRoleList(suffix[2]), note };


  // Safe no-space suffix parsing for legacy Japanese entries only.
  // Example: 櫻井智則sax -> 櫻井智則 - Sax.
  // Crucially, Latin words such as BIGBAND must NEVER become BIGBAN - D.
  const attachedJapanese = text.match(/^(.+[\u3040-\u30ff\u3400-\u9fff々〆ヵヶ])\s*(sax|tp|tpt|tb|tbn|as|ts|ss|bs|pf|ds|dr|drums|perc|per|bass|synth|synt|vo|flh|flute)$/i);
  if (attachedJapanese) {
    return {
      name: attachedJapanese[1].trim(),
      role: normalizeRoleList(attachedJapanese[2]),
      note
    };
  }

  // Generic parenthesized/bracketed role, after note extraction.
  // Examples: 岡部洋一 (Per), 挾間美帆 (Cond), 松原慎之介 (Cond/As), 守屋純子 (P/Arr)
  const genericBracket = text.match(/^(.*?)\s*[\(（\[【]\s*([^\)）\]】]+?)\s*[\)）\]】]\s*$/);
  if (genericBracket && looksLikeRoleList(genericBracket[2])) {
    return { name:genericBracket[1].trim(), role:normalizeRoleList(genericBracket[2]), note };
  }

  // "Thiago Rabello (D) and others": keep "and others" as note, never identity.
  const andOthers = text.match(/^(.*?)\s+(and\s+others)$/i);
  if (andOthers) {
    const base = splitPlayerDisplay(andOthers[1], inheritedRole);
    base.note = base.note ? `${base.note} ${andOthers[2]}` : andOthers[2];
    return base;
  }

  return { name:text, role:normalizeRoleList(inheritedRole), note };
}

function isNonPersonRosterLabel(value = '') {
  const v = normalizeSearchText(value).replace(/\s+/g, ' ').trim();
  return /^(?:ほか|他|その他)(?:\s+(?:orchestra|band|ensemble)?\s*members?)?$/i.test(v) ||
         /^(?:others?|other\s+members?|orchestra\s+members?|band\s+members?|ensemble\s+members?|guests?)$/i.test(v);
}

function splitPlayersIntoPeople(players = []) {
  const source = (players || [])
    .map(v => String(v || '').trim())
    .filter(Boolean)
    .join(' / ');

  if (!source) return [];

  // Split only on slash/newline OUTSIDE brackets.
  // [Pf/Keyb] therefore remains a single role expression.
  // Normalize comma-separated roster lines such as:
  // 唐治谷雄大 Sax, 國府方章弘 Tp, 河野真貴 Pf, 蓼川祐紀 Bass, 渡瀬春翔 Drum
  // Commas inside brackets are untouched by the scanner below.
  const segments = [];
  let current = '', round = 0, square = 0;

  for (const ch of source) {
    if (ch === '(' || ch === '（') round++;
    if (ch === '[' || ch === '【') square++;

    if (!round && !square && /[\/／\n\r,，、]/.test(ch)) {
      if (current.trim()) segments.push(current.trim());
      current = '';
      continue;
    }

    current += ch;

    if ((ch === ')' || ch === '）') && round) round--;
    if ((ch === ']' || ch === '】') && square) square--;
  }
  if (current.trim()) segments.push(current.trim());

  const people = [];
  let forwardRole = '';
  let pendingUnassigned = [];

  function flushPending(role = '') {
    if (!pendingUnassigned.length) return;
    pendingUnassigned.forEach(person => {
      if (!person.role && role) person.role = role;
      people.push(person);
    });
    pendingUnassigned = [];
  }

  for (let segment of segments) {
    segment = segment.replace(/^[*＊•・]\s*/, '').trim();
    if (!segment) continue;
    if (isNonPersonRosterLabel(segment) || /^(?:and\s+others|etc\.?)$/i.test(segment)) {
      forwardRole = '';
      continue;
    }

    // FORWARD notation:
    // Tp:田中哲也 / 松木理三郎 / 國府方章弘
    // Tp-田中哲也 / 松木理三郎 / 國府方章弘
    let m = segment.match(/^(.+?)\s*[:：]\s*(.+)$/);
    if (m && looksLikeRoleList(m[1])) {
      flushPending();
      forwardRole = normalizeRoleList(m[1]);
      const person = splitPlayerDisplay(m[2], forwardRole);
      person.role = person.role || forwardRole;
      if (person.name) people.push(person);
      continue;
    }

    m = segment.match(/^(.+?)\s*(?:-|–|—)\s*(.+)$/);
    if (m && looksLikeRoleList(m[1])) {
      flushPending();
      forwardRole = normalizeRoleList(m[1]);
      const person = splitPlayerDisplay(m[2], forwardRole);
      person.role = person.role || forwardRole;
      if (person.name) people.push(person);
      continue;
    }

    // BACKWARD notation:
    // 佐瀬悠輔 / 山田丈造 / 菊地立起 / 國府方章弘-Tp
    // The final "-Tp" closes the preceding unlabelled section and assigns
    // the same role to all pending members.
    m = segment.match(/^(.*?)\s*(?:-|–|—)\s*(.+)$/);
    if (m && looksLikeRoleList(m[2])) {
      const backwardRole = normalizeRoleList(m[2]);

      if (pendingUnassigned.length) {
        flushPending(backwardRole);
      }

      const person = splitPlayerDisplay(m[1]);
      person.role = backwardRole;
      if (person.name) people.push(person);

      // A trailing role is treated as the end of that group, not as a
      // forward header for the next group.
      forwardRole = '';
      continue;
    }

    const person = splitPlayerDisplay(segment, forwardRole);

    if (!person.name) continue;

    if (person.role) {
      // Explicit bracket/suffix role such as Name [A.Sax] is self-contained.
      flushPending();
      people.push(person);
    } else if (forwardRole) {
      person.role = forwardRole;
      people.push(person);
    } else {
      // Hold temporarily: a later "Name-Tp" may define this whole group.
      pendingUnassigned.push(person);
    }
  }

  flushPending();
  return people;
}

function formatRoleForDisplay(role = '', compact = false) {
  const normalized = normalizeRoleList(role);
  if (!normalized) return '';

  // Preserve the special combined conductor/arranger/trombone notation,
  // but make it readable in small ensembles.
  if (/^Con\.?Arr\.?Tb$/i.test(normalized)) {
    return compact ? 'Cond / Arr / Tb' : 'Conductor / Arranger / Trombone';
  }

  // Bass-Tb is ONE instrument. Never split its hyphen.
  if (/^Bass-Tb$/i.test(normalized)) {
    return compact ? 'B.Tb' : 'Bass Trombone';
  }

  return normalized
    .split('/')
    .map(part => {
      const raw = part.trim();
      const mapped = ROLE_DISPLAY_NAMES[roleKey(raw)];
      return mapped ? (compact ? mapped.short : mapped.full) : raw;
    })
    .filter(Boolean)
    .join(' / ');
}

function createPlayerLineHTML(person, compactRoles = false) {
  const name = person.name || '';
  const role = formatRoleForDisplay(person.role || '', compactRoles);
  const note = person.note || '';

  return `
    <span class="player">
      <button class="player-search" type="button"

    </span>
  `;
}

function createPlayersHTML(players) {
  const people = splitPlayersIntoPeople(players);
  if (!people.length) return '';

  // 1-9 people: spell instruments out.
  // 10+ people: use compact big-band abbreviations.
  const compactRoles = people.length >= 10;
  const visible = people.slice(0,6);
  const hidden = people.slice(6);
  let html = `
    <div class="players-section">
      <div class="label">PLAYERS</div>
      <div class="players">
        ${visible.map(person => createPlayerLineHTML(person, compactRoles)).join('')}

      <button class="show-more" type="button" aria-expanded="false">SHOW MORE ↓</button>

  }
  return html + `</div></div>`;

function getEventYear(event) {
  return new Intl.DateTimeFormat(
    'en-US',
    { timeZone:'Asia/Tokyo', year:'numeric' }
  ).format(eventStart(event));
}

function getEventMonthLong(event) {
  return new Intl.DateTimeFormat(
    'en-US',
    { timeZone:'Asia/Tokyo', month:'long' }
  ).format(eventStart(event));
}

function getEventStableId(event) {
  if (event.id) {
    return `show-${String(event.id).replace(/[^A-Za-z0-9_-]/g,'')}`;
  }

  const fallback = [
    tokyoDateKey(eventStart(event)),
    event.summary || 'live',
    event.location || ''
  ].join('-')
   .normalize('NFKD')
   .replace(/[^\w-]+/g,'-')
   .replace(/-+/g,'-')
   .replace(/^-|-$/g,'')
   .toLowerCase();

  return `show-${fallback || 'live'}`;
}

function getEventDetailURL(event) {
  const url = new URL(SETTINGS.EVENT_URL || 'event.html', window.location.href);
  url.search = '';
  url.hash = '';

  if (event?.id) {
    url.searchParams.set('id', event.id);
  } else {
    url.searchParams.set('show', getEventStableId(event));
  }

  return url.href;
}

function getShowPermalink(event) {
  return getEventDetailURL(event);
}

function toGoogleCalendarDate(date) {
  return new Date(date).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
}

function getGoogleCalendarURL(event) {
  const info = parseDescription(event.description || '');
  const venue = info.place || getVenue(event.location || '');
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text:event.summary || 'Live',
    dates:`${toGoogleCalendarDate(eventStart(event))}/${toGoogleCalendarDate(eventEnd(event))}`,
    details:`Akihiro Kokufukata — Live Schedule\n${getShowPermalink(event)}`,
    location:event.location || venue || ''
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

  const date =

function normalizeSearchText(value = '') {
  return String(value)
    .normalize('NFKC')
    .toLocaleLowerCase('ja-JP')
    .replace(/\s+/g, ' ')
    .trim();
}

/*
  Player-name normalization:
  Japanese names may be stored with or without a space between surname/given name.
  Keep the visible Calendar spelling unchanged, but ignore whitespace when comparing
  names that contain Japanese characters.
*/
function cleanPlayerSearchIdentity(value = '') {
  let v = String(value || '').trim();
  v = v.replace(/\s+(?:and\s+others)$/i, '').trim();

  // Strip a recognized trailing bracket role from the search identity.
  const b = v.match(/^(.*?)\s*[\(（\[【]\s*([^\)）\]】]+)\s*[\)）\]】]\s*$/);
  if (b && looksLikeRoleList(b[2])) v = b[1].trim();

  // Strip a recognized plain trailing role.
  const s = v.match(new RegExp(`^(.*?)\\s+(${PLAYER_ROLE_PATTERN})(?:\\.)?$`, 'i'));
  if (s) v = s[1].trim();

  return v;
}

function normalizePlayerName(value = '') {
  const normalized = normalizeSearchText(value);

  if (/[\u3040-\u30ff\u3400-\u9fff]/.test(normalized)) {
    return normalized.replace(/\s+/g, '');
  }

  return normalized;
}

function normalizeVenueLocation(value = '') {
  return normalizeSearchText(value)
    .replace(/[〒\-‐‑‒–—―ー\s,，、.．・]/g, '')
    .replace(/(?:japan|日本)$/i, '');
}

function getEventVenueIdentity(event) {
  const info = parseDescription(event.description || '');
  const display = info.place || getVenue(event.location || '');
  const location = event.location || '';
  return {
    display,
    location,
    key: normalizeVenueLocation(location || display)
  };
}

let activeVenueSearchKey = '';


function eventSearchText(event) {
  const info = parseDescription(event.description || '');
  const venue = getVenue(event.location || '');
  const year = getEventYear(event);
  const monthLong = getEventMonthLong(event);
  const monthShort = monthLong.slice(0,3);

  const fields = [
    event.summary || '',
    ...(info.players || []),
    ...splitPlayersIntoPeople(info.players || []).flatMap(p => [p.name, p.role]),
    venue,
    info.place || '',
    event.location || '',
    year,
    monthLong,
    monthShort,
    getMonthKey(event)
  ];

  return normalizeSearchText(fields.join(' '));
}

function eventMatchesSearch(event, query) {
  const normalized = normalizeSearchText(query);
  if (!normalized) return true;

  if (activeVenueSearchKey) {
    const identity = getEventVenueIdentity(event);
    if (identity.key && identity.key === activeVenueSearchKey) {
      return true;
    }
  }

  return textMatchesOneVariant(eventSearchText(event), query);
}



function getPeopleDirectory() {
  return Array.isArray(window.MUSIC_DATA?.people) ? window.MUSIC_DATA.people : [];
}

function getPersonIdentity(query) {
  const target = normalizePlayerName(query);
  if (!target) return null;

  return getPeopleDirectory().find(person => {
    const names = [person.name, ...(person.aliases || [])].filter(Boolean);
    return names.some(name => normalizePlayerName(name) === target);
  }) || null;
}

function getSearchVariants(query) {
  const identity = getPersonIdentity(query);
  if (!identity) return [query];

  return [identity.name, ...(identity.aliases || [])]
    .filter(Boolean)
    .filter((name, index, arr) =>
      arr.findIndex(other => normalizePlayerName(other) === normalizePlayerName(name)) === index
    );
}

function textMatchesOneVariant(haystack, query) {
  return getSearchVariants(query).some(variant => {
    const normalized = normalizeSearchText(variant);
    if (!normalized) return false;

    if (/[\u3040-\u30ff\u3400-\u9fff]/.test(normalized)) {
      const compactQuery = normalized.replace(/\s+/g, '');
      const compactHaystack = haystack.replace(/\s+/g, '');
      if (compactHaystack.includes(compactQuery)) return true;
    }

    const words = normalized.split(' ').filter(Boolean);
    return words.every(word => haystack.includes(word));
  });
}

function getRecordings() {
  return Array.isArray(window.MUSIC_DATA?.releases) ? window.MUSIC_DATA.releases : [];
}

function recordingPeople(recording) {
  const people = [];

  (recording.personnel || []).forEach(person => {
    if (typeof person === 'string') {
      const identity = getPersonIdentity(person);
      people.push({
        name:identity?.name || person,
        displayName:person,
        role:'',
        aliases:identity?.aliases || []
      });
      return;
    }

    if (person?.name) {
      const identity = getPersonIdentity(person.searchName || person.name);
      people.push({
        name:identity?.name || person.searchName || person.name,
        displayName:person.name,
        role:person.role || '',
        aliases:[
          ...(identity?.aliases || []),
          ...(person.aliases || []),
          ...(person.searchName && person.searchName !== person.name ? [person.name] : [])
        ],
        affiliation:identity?.affiliation || ''
      });
    }
  });

  return people;
}

function recordingSearchText(recording) {
  const trackText = (recording.tracks || []).map(track =>
    typeof track === 'string'
      ? track
      : `${track.number || ''} ${track.title || ''} ${track.note || ''}`
  );

  const personnelText = recordingPeople(recording)
    .flatMap(person => [
      person.name,
      person.displayName || '',
      person.role,
      ...(person.aliases || [])
    ]);

  const creditText = (recording.credits || [])
    .flatMap(row => [row.label || '', row.value || '']);

  return normalizeSearchText([
    recording.title || '',
    recording.artist || '',
    recording.year || '',
    recording.note || '',
    recording.credit || '',
    ...(recording.searchNames || []),
    ...trackText,
    ...personnelText,
    ...creditText,
    'Akihiro Kokufukata',
    '國府方章弘',
    '国府方章弘'
  ].join(' '));
}

function recordingMatchesSearch(recording, query) {
  const normalized = normalizeSearchText(query);
  if (!normalized) return true;
  return textMatchesOneVariant(recordingSearchText(recording), query);
}

function recordingURL(recording) {
  return `music.html${recording.id ? `?release=${encodeURIComponent(recording.id)}` : ''}`;
}

function renderRecordingSearchGroup(recordings) {
  if (!recordings.length) return '';

  return `
    <section class="search-group search-recordings" aria-label="recording search results">
      <div class="search-group-heading">
        <div class="search-group-title">RECORDINGS</div>
        <div class="search-group-count">
          ${recordings.length} ${recordings.length === 1 ? 'RECORDING' : 'RECORDINGS'}
        </div>
      </div>

      <div class="search-recording-grid">
        ${recordings.map(recording => `
          <a class="search-recording" href="${escapeHTML(recordingURL(recording))}">
            <div class="search-recording-cover">
              ${recording.cover
                ? `<img src="${escapeHTML(recording.cover)}" alt="${escapeHTML(recording.title || 'Recording')} album cover" loading="lazy">`
                : `<div class="search-recording-placeholder">${escapeHTML(recording.title || 'Recording')}</div>`
              }
            </div>
            <div>
              <div class="search-recording-kicker">RECORDING</div>
              <div class="search-recording-title">${escapeHTML(recording.title || '')}</div>
              <div class="search-recording-meta">${escapeHTML([recording.artist, recording.year].filter(Boolean).join(' · '))}</div>
              ${recording.note ? `<div class="search-recording-note">${escapeHTML(recording.note)}</div>` : ''}
              ${recording.credit ? `<div class="search-recording-note">${escapeHTML(recording.credit)}</div>` : ''}
            </div>
          </a>
        `).join('')}
      </div>
    </section>
  `;
}

function findExactRecordingPerson(query) {
  const identity = getPersonIdentity(query);

  if (identity) {
    for (const recording of getRecordings()) {
      for (const person of recordingPeople(recording)) {
        const names = [person.name, ...(person.aliases || [])];
        if (names.some(name =>
          normalizePlayerName(name) === normalizePlayerName(identity.name) ||
          normalizePlayerName(name) === normalizePlayerName(query)
        )) {
          return {
            ...person,
            name:identity.name,
            aliases:identity.aliases || [],
            affiliation:identity.affiliation || ''
          };
        }
      }
    }

    return {
      name:identity.name,
      role:'',
      aliases:identity.aliases || [],
      affiliation:identity.affiliation || ''
    };
  }

  const target = normalizePlayerName(query);
  if (!target) return null;

  for (const recording of getRecordings()) {
    for (const person of recordingPeople(recording)) {
      const names = [person.name, ...(person.aliases || [])];
      if (names.some(name => normalizePlayerName(name) === target)) return person;
    }
  }

  return null;
}

function findExactRecordingArtist(query) {
  const q = normalizeSearchText(query);
  if (!q) return null;

  for (const recording of getRecordings()) {
    for (const name of (recording.searchNames || [])) {
      if (normalizeSearchText(name) === q || normalizePlayerName(name) === normalizePlayerName(query)) {
        return name;
      }
    }
  }
  return null;
}

function syncSearchURL() {
  const url = new URL(window.location.href);
  const query = searchQuery.trim();

  if (query) {
    url.searchParams.set('search', query);
  } else {
    url.searchParams.delete('search');
  }

  history.replaceState(null, '', url.pathname + url.search + url.hash);
}

function renderSearchGroup(title, events, isPast) {
  if (!events.length) return '';

  return `
    <section class="search-group" aria-label="${title.toLowerCase()} search results">
      <div class="search-group-heading">
        <div class="search-group-title">${title}</div>
        <div class="search-group-count">
          ${events.length} ${events.length === 1 ? 'SHOW' : 'SHOWS'}
        </div>
      </div>

      ${events.map(event => {
        const originalIndex = isPast ? -1 : upcomingEvents.indexOf(event);
        return createEventCard(event, originalIndex, isPast);
      }).join('')}
    </section>
  `;
}


function findExactPlayer(query) {
  const q = normalizeSearchText(query);
  if (!q) return null;

  const identity = getPersonIdentity(query);
  const targets = getSearchVariants(query).map(normalizePlayerName);

  const events = [...upcomingEvents, ...pastEvents];
  for (const event of events) {
    const info = parseDescription(event.description || '');
    for (const p of splitPlayersIntoPeople(info.players || [])) {
      if (targets.includes(normalizePlayerName(p.name))) {
        return {
          name:identity?.name || p.name,
          role:normalizeRoleList(p.role),
          note:p.note || '',
          aliases:identity?.aliases || [],
          affiliation:identity?.affiliation || ''
        };
      }
    }
  }

  const recordingPerson = findExactRecordingPerson(query);
  return recordingPerson
    ? {
        name:recordingPerson.name,
        role:recordingPerson.role || '',
        note:'',
        aliases:recordingPerson.aliases || [],
        affiliation:recordingPerson.affiliation || ''
      }
    : null;
}

function findExactVenue(query) {
  const q = normalizeSearchText(query);
  if (!q) return null;

  for (const event of [...upcomingEvents, ...pastEvents]) {
    const identity = getEventVenueIdentity(event);
    if (
      (identity.display && normalizeSearchText(identity.display) === q) ||
      (activeVenueSearchKey && identity.key === activeVenueSearchKey)
    ) {
      return query;
    }
  }
  return null;
}

function createSearchProfileHTML(query, totalEvents, totalRecordings = 0) {
  const player = findExactPlayer(query);
  const venue = findExactVenue(query);
  const recordingArtist = findExactRecordingArtist(query);

  if (!player && !venue && !recordingArtist) return '';

  const matchingShows = [...upcomingEvents, ...pastEvents].filter(e => eventMatchesSearch(e, query));
  const matchingRecordings = getRecordings().filter(r => recordingMatchesSearch(r, query));

  const years = [
    ...matchingShows.map(getEventYear),
    ...matchingRecordings.map(r => String(r.year || '')).filter(Boolean)
  ].sort();

  const range = years.length
    ? (years[0] === years[years.length-1] ? years[0] : `${years[0]}–${years[years.length-1]}`)
    : '';

  const name = player?.name || venue || recordingArtist;
  const type = player ? 'PLAYER' : venue ? 'VENUE' : 'RECORDING ARTIST';

  const counts = [];
  if (totalEvents) counts.push(`${totalEvents} ${totalEvents === 1 ? 'SHOW' : 'SHOWS'}`);
  if (totalRecordings) counts.push(`${totalRecordings} ${totalRecordings === 1 ? 'RECORDING' : 'RECORDINGS'}`);

  const aliasLine = player
    ? [
        ...(player.aliases || []),
        player.affiliation || ''
      ].filter(Boolean).join(' · ')
    : '';

  return `
    <div class="search-profile">
      <div class="search-profile-name">${escapeHTML(name)}</div>
      ${aliasLine ? `<div class="search-profile-aliases">${escapeHTML(aliasLine)}</div>` : ''}
      <div class="search-profile-meta">
        ${player && player.role ? `${escapeHTML(player.role.toUpperCase())} · ` : ''}
        ${type}${counts.length ? ` · ${counts.join(' · ')}` : ''}${range ? ` · ${range}` : ''}
      </div>
    </div>
  `;
}

function renderSearchResults(container) {
  const query = searchQuery.trim();

  const upcomingMatches = upcomingEvents
    .filter(event => eventMatchesSearch(event, query))
    .sort((a,b) => eventStart(a) - eventStart(b));

  const pastMatches = pastEvents
    .filter(event => eventMatchesSearch(event, query))
    .sort((a,b) => eventStart(b) - eventStart(a));

  const recordingMatches = getRecordings()
    .filter(recording => recordingMatchesSearch(recording, query))
    .sort((a,b) => Number(b.year || 0) - Number(a.year || 0));

  const showTotal = upcomingMatches.length + pastMatches.length;
  const recordingTotal = recordingMatches.length;
  const total = showTotal + recordingTotal;

  container.innerHTML = `
    <div class="search-results-head">
      <div class="search-results-title">
        SEARCH RESULTS
        <span class="search-results-query">— ${escapeHTML(query)}</span>
      </div>
      <div class="search-results-count">
        ${showTotal ? `${showTotal} ${showTotal === 1 ? 'SHOW' : 'SHOWS'}` : ''}
        ${showTotal && recordingTotal ? ' · ' : ''}
        ${recordingTotal ? `${recordingTotal} ${recordingTotal === 1 ? 'RECORDING' : 'RECORDINGS'}` : ''}
      </div>
    </div>

    ${createSearchProfileHTML(query, showTotal, recordingTotal)}

    ${
      total
        ? `
          ${renderSearchGroup('UPCOMING', upcomingMatches, false)}
          ${renderSearchGroup('PAST', pastMatches, true)}
          ${renderRecordingSearchGroup(recordingMatches)}
        `
        : `
          <div class="message">
            No shows or recordings found for “${escapeHTML(query)}”.
          </div>
        `
    }
  `;
}

/* =========================================================
   RENDER
   ========================================================= */

function renderEvents() {

  const container =
    document.getElementById(
      'events'
    );

  if (searchQuery.trim()) {
    renderSearchResults(container);
    return;
  }


  /* =======================================================
     PAST
     ======================================================= */

  if (selectedFilter === 'past') {


    if (!pastEvents.length) {

      container.innerHTML = `

        <div class="message">
          No past shows found.
        </div>

      `;

      return;
    }


    let filteredPastEvents =
      selectedPastMonth !== 'all'
        ? pastEvents.filter(event => getMonthKey(event) === selectedPastMonth)
        : selectedPastYear !== 'all'
          ? pastEvents.filter(event => getMonthKey(event).startsWith(`${selectedPastYear}-`))
          : pastEvents;


    container.innerHTML = `

      <div class="past-heading">
        <span>PAST SHOWS</span>
        <span class="past-heading-count">
          ${filteredPastEvents.length} ${filteredPastEvents.length === 1 ? 'SHOW' : 'SHOWS'}
        </span>
      </div>

      ${getArchiveStatsHTML()}

      ${createPastMonthFilterHTML()}

      ${
        filteredPastEvents.length
          ?
          filteredPastEvents
            .map(
              event =>
                createEventCard(
                  event,
                  -1,
                  true
                )
            )
            .join('')
          :
          `
            <div class="message">
              No past shows found for this month.
            </div>
          `
      }

    `;


    return;

  }


  /* =======================================================
     UPCOMING
     ======================================================= */

  let filtered =
    selectedFilter === 'all'
      ?
      upcomingEvents
      :
      upcomingEvents.filter(
        event =>
          getMonthKey(event) ===
            selectedFilter
      );


  if (!filtered.length) {

    container.innerHTML = `

      <div class="message">
        No shows scheduled for this month.
      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(
        event => {

          const originalIndex =
            upcomingEvents
              .indexOf(event);


          return createEventCard(
            event,
            originalIndex,
            false
          );

        }
      )
      .join('');

}

const flyerModal = document.getElementById('flyerModal');
const flyerModalImage = document.getElementById('flyerModalImage');
const flyerClose = document.getElementById('flyerClose');
const flyerPrev = document.getElementById('flyerPrev');
const flyerNext = document.getElementById('flyerNext');

let flyerGallery = [];
let flyerGalleryIndex = 0;
let flyerTouchStartX = null;

function updateFlyerNav() {
  const multiple = flyerGallery.length > 1;
  flyerPrev.hidden = !multiple;
  flyerNext.hidden = !multiple;
}

function showFlyerAt(index) {
  if (!flyerGallery.length) return;

  flyerGalleryIndex =
    (index + flyerGallery.length) % flyerGallery.length;

  const item = flyerGallery[flyerGalleryIndex];
  flyerModalImage.src = item.src;
  flyerModalImage.alt = item.title || 'Image';
  updateFlyerNav();
}

function openFlyer(src, title = 'Image', gallery = null, startIndex = 0) {
  if (!src) return;

  flyerGallery =
    Array.isArray(gallery) && gallery.length
      ? gallery
      : [{ src, title }];

  flyerGalleryIndex = Math.max(0, startIndex);
  showFlyerAt(flyerGalleryIndex);

  flyerModal.classList.add('open');
  flyerModal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('flyer-open');
}

function moveFlyer(step) {
  if (flyerGallery.length < 2) return;
  showFlyerAt(flyerGalleryIndex + step);
}

function closeFlyer() {
  flyerModal.classList.remove('open');
  flyerModal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('flyer-open');

  setTimeout(() => {
    if (!flyerModal.classList.contains('open')) {
      flyerModalImage.src = '';
      flyerGallery = [];
      flyerGalleryIndex = 0;
      updateFlyerNav();
    }
  }, 220);
}

flyerClose.addEventListener('click', closeFlyer);

flyerPrev.addEventListener('click', event => {
  event.stopPropagation();
  moveFlyer(-1);
});

flyerNext.addEventListener('click', event => {
  event.stopPropagation();
  moveFlyer(1);
});

flyerModal.addEventListener('click', event => {
  if (event.target === flyerModal) {
    closeFlyer();
  }
});

flyerModalImage.addEventListener('touchstart', event => {
  flyerTouchStartX = event.changedTouches[0]?.clientX ?? null;
}, { passive:true });

flyerModalImage.addEventListener('touchend', event => {
  if (flyerTouchStartX === null || flyerGallery.length < 2) {
    flyerTouchStartX = null;
    return;
  }

  const endX = event.changedTouches[0]?.clientX;
  if (typeof endX === 'number') {
    const dx = endX - flyerTouchStartX;
    if (Math.abs(dx) > 45) {
      moveFlyer(dx < 0 ? 1 : -1);
    }
  }

  flyerTouchStartX = null;
}, { passive:true });

document.addEventListener('keydown', event => {
  if (!flyerModal.classList.contains('open')) return;

  if (event.key === 'Escape') {
    closeFlyer();
  } else if (event.key === 'ArrowLeft') {
    moveFlyer(-1);
  } else if (event.key === 'ArrowRight') {
    moveFlyer(1);
  }
});
