<script>

/* =========================================================

   ========================================================= */

const API_KEY =
  SETTINGS.API_KEY;


const CALENDAR_ID =

const EMAIL_ADDRESS =
  SETTINGS.EMAIL_ADDRESS;


let upcomingEvents = [];

let selectedMonth = 'all';



/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value = '') {

  return String(value)

    .replaceAll('&', '&amp;')

    .replaceAll('<', '&lt;')

    .replaceAll('>', '&gt;')

    .replaceAll('"', '&quot;')

    .replaceAll("'", '&#039;');

}



/* =========================================================
   WEBSITE URL
   ========================================================= */

function normalizeWebsiteURL(value = '') {

  let text =
    String(value).trim();


  const markdown =
    text.match(
      /\]\((https?:\/\/[^)\s]+)\)/i
    );


  if (markdown) {
    text = markdown[1];
  }


  const html =
    text.match(
      /href=["'](https?:\/\/[^"']+)["']/i
    );


  if (html) {
    text = html[1];
  }


  const plain =
    text.match(
      /https?:\/\/[^\s<>"')\]]+/i
    );


  if (!plain) {
    return '';
  }


  try {

    const url =
      new URL(plain[0]);


    if (
      url.protocol !== 'https:' &&
      url.protocol !== 'http:'
    ) {

      return '';

    }


    return url.href;

  }

  catch {

    return '';

  }

}



/* =========================================================
   DESCRIPTION PARSER

   Players:
   Player 1
   Player 2

   Place: Shinjuku
   Website: https://...
   Leader: yes

   ========================================================= */

function parseDescription(
  description = ''
) {

  const text =
    String(description)

      .replace(/\r/g, '')

      .replace(
        /<br\s*\/?>/gi,
        '\n'
      )

      .replace(
        /<\/p>/gi,
        '\n'
      )

      .replace(
        /<[^>]+>/g,
        ''
      );


  const lines =
    text

      .split('\n')

      .map(
        line =>
          line.trim()
      )

      .filter(Boolean);


  const players = [];

  let place = '';

  let website = '';

  let leader = false;

  let readingPlayers = false;



  for (
    const line
    of lines
  ) {


    if (
      /^players\s*:/i
        .test(line)
    ) {

      readingPlayers = true;


      const sameLine =
        line

          .replace(
            /^players\s*:/i,
            ''
          )

          .trim();


      if (sameLine) {

        players.push(
          sameLine
        );

      }


      continue;

    }



    if (
      /^place\s*:/i
        .test(line)
    ) {

      place =
        line

          .replace(
            /^place\s*:/i,
            ''
          )

          .trim();


      continue;

    }



    if (
      /^(website|venueurl)\s*:/i
        .test(line)
    ) {

      const rawWebsite =
        line

          .replace(
            /^(website|venueurl)\s*:/i,
            ''
          )

          .trim();


      website =
        normalizeWebsiteURL(
          rawWebsite
        );


      continue;

    }



    if (
      /^leader\s*:/i
        .test(line)
    ) {

      const value =
        line

          .replace(
            /^leader\s*:/i,
            ''
          )

          .trim()

          .toLowerCase();


      leader =
        [
          'yes',
          'true',
          '1',
          'leader'
        ]

        .includes(value);


      continue;

    }



    if (
      /^(reserveurl|email|image)\s*:/i
        .test(line)
    ) {

      continue;

    }



    if (readingPlayers) {

      players.push(line);

    }

  }



  return {

    players,
    place,
    website,
    leader

  };

}



/* =========================================================
   VENUE

   ★ 重複表示対策

   Google Calendar Location を
   VENUEの正式表示として使用。

   Place はVenueとして二重表示しない。
   ========================================================= */

function getVenue(location = '') {

  if (!location) {
    return '';
  }


  return location

    .split(/[,、]/)[0]

    .trim();

}



/* =========================================================
   DATES
   ========================================================= */

function eventStart(event) {

  return new Date(

    event.start.dateTime ||

    event.start.date

  );

}


function eventEnd(event) {

  return new Date(

    event.end.dateTime ||

    event.end.date

  );

}



function tokyoDateKey(date) {

  const parts =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        year:
          'numeric',

        month:
          '2-digit',

        day:
          '2-digit'
      }

    )

    .formatToParts(date);


  const values =

    Object.fromEntries(

      parts.map(

        part => [

          part.type,

          part.value

        ]

      )

    );


  return (
    `${values.year}-${values.month}-${values.day}`
  );

}



function isToday(event) {

  return (

    tokyoDateKey(
      eventStart(event)
    )

    ===

    tokyoDateKey(
      new Date()
    )

  );

}



/* =========================================================
   DATE DISPLAY
   ========================================================= */

function getDateParts(event) {

  const date =
    eventStart(event);


  const month =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        month:
          'short'
      }

    )

    .format(date)

    .toUpperCase();



  const number =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        day:
          '2-digit'
      }

    )

    .format(date);



  const weekday =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        weekday:
          'short'
      }

    )

    .format(date)

    .toUpperCase();



  return {

    month,
    number,
    weekday

  };

}



/* =========================================================
   TIME
   ========================================================= */

function formatTime(event) {

  if (!event.start.dateTime) {

    return 'ALL DAY';

  }


  return new Intl.DateTimeFormat(

    'en-US',

    {
      timeZone:
        'Asia/Tokyo',

      hour:
        'numeric',

      minute:
        '2-digit'
    }

  )

  .format(
    eventStart(event)
  );

}



/* =========================================================
   MONTH KEY
   ========================================================= */

function getMonthKey(event) {

  const date =
    eventStart(event);


  const parts =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        year:
          'numeric',

        month:
          '2-digit'
      }

    )

    .formatToParts(date);


  const values =

    Object.fromEntries(

      parts.map(

        part => [

          part.type,

          part.value

        ]

      )

    );


  return (
    `${values.year}-${values.month}`
  );

}



/* =========================================================
   CURRENT MONTH
   ========================================================= */

function getCurrentTokyoMonth() {

  const parts =

    new Intl.DateTimeFormat(

      'en-US',

      {
        timeZone:
          'Asia/Tokyo',

        year:
          'numeric',

        month:
          '2-digit'
      }

    )

    .formatToParts(
      new Date()
    );


  const values =

    Object.fromEntries(

      parts.map(

        part => [

          part.type,

          part.value

        ]

      )

    );


  return {

    year:
      Number(values.year),

    month:
      Number(values.month)

  };

}



/* =========================================================
   MONTH HELPERS
   ========================================================= */

function makeMonthKey(
  year,
  month
) {

  return (

    String(year) +

    '-' +

    String(month)
      .padStart(
        2,
        '0'
      )

  );

}



function getMonthName(
  year,
  month
) {

  const date =

    new Date(

      Date.UTC(

        year,

        month - 1,

        1

      )

    );


  return new Intl.DateTimeFormat(

    'en-US',

    {
      timeZone:
        'UTC',

      month:
        'short'
    }

  )

  .format(date)

  .toUpperCase();

}



/* =========================================================
   MONTH FILTER
   ========================================================= */

function buildMonthFilters() {

  const current =
    getCurrentTokyoMonth();


  let nextYear =
    current.year;


  let nextMonth =
    current.month + 1;


  if (nextMonth > 12) {

    nextMonth = 1;

    nextYear += 1;

  }


  const currentKey =

    makeMonthKey(

      current.year,

      current.month

    );


  const nextKey =

    makeMonthKey(

      nextYear,

      nextMonth

    );


  const filter =

    document.getElementById(
      'monthFilter'
    );


  filter.innerHTML = `

    <button
      class="month-button active"
      data-month="all"
      type="button"
    >
      ALL
    </button>


    <button
      class="month-button"
      data-month="${currentKey}"
      type="button"
    >
      ${getMonthName(
        current.year,
        current.month
      )}
    </button>


    <button
      class="month-button"
      data-month="${nextKey}"
      type="button"
    >
      ${getMonthName(
        nextYear,
        nextMonth
      )}
    </button>

  `;

}



/* =========================================================
   JAPANESE CHECK
   ========================================================= */

function containsJapanese(
  text = ''
) {

  return /[\u3040-\u30ff\u3400-\u9fff]/
    .test(text);

}



/* =========================================================
   PLAYERS
   ========================================================= */

function createPlayersHTML(
  players
) {

  if (!players.length) {

    return '';

  }


  const visible =
    players.slice(0,6);


  const hidden =
    players.slice(6);


  let html = `

    <div class="players-section">

      <div class="label">
        PLAYERS
      </div>


      <div class="players">

        ${visible

          .map(

            player =>

              `<span class="player">${escapeHTML(
                player
              )}</span>`

          )

          .join('')
        }

  `;



  if (hidden.length) {

    html += `

      <div class="hidden-players">

        ${hidden

          .map(

            player =>

              `<span class="player">${escapeHTML(
                player
              )}</span>`

          )

          .join('')
        }

      </div>


      <button
        class="show-more"
        type="button"
        aria-expanded="false"
      >
        SHOW MORE ↓
      </button>

    `;

  }



  html += `

      </div>

    </div>

  `;


  return html;

}



/* =========================================================
   EVENT CARD
   ========================================================= */

function createEventCard(
  event,
  originalIndex
) {

  const info =

    parseDescription(

      event.description ||
      ''

    );


  const venue =

    getVenue(

      event.location ||
      ''

    );


  const date =
    getDateParts(event);


  const tonight =
    isToday(event);


  const isNext =

    originalIndex === 0 &&

    !tonight;


  const title =

    event.summary ||

    'Live';


  const titleClass =

    containsJapanese(title)

      ? ''

      : ' english';



  const mapURL =

    event.location

      ?

      'https://www.google.com/maps/search/?api=1&query=' +

      encodeURIComponent(
        event.location
      )

      :

      '';



  /* -------------------------
     LABELS
     ------------------------- */

  let topLabels = '';


  if (info.leader) {

    topLabels += `

      <div class="leader-label">
        LEADER SHOW
      </div>

    `;

  }


  if (isNext) {

    topLabels += `

      <div class="next-label">
        NEXT SHOW
      </div>

    `;

  }



  /* -------------------------
     VENUE

     ★ 1つだけ表示
     ------------------------- */

  let venueHTML = '';


  const venueToDisplay =

    venue ||

    info.place;


  if (venueToDisplay) {

    venueHTML = `

      <div class="venue-section">

        <div class="label">
          VENUE
        </div>


        <div class="venue">

          ${escapeHTML(
            venueToDisplay
          )}

        </div>

      </div>

    `;

  }



  /* -------------------------
     BUTTONS
     ------------------------- */

  const actions = [];


  if (
    info.leader &&
    EMAIL_ADDRESS &&
    EMAIL_ADDRESS !==
      'YOUR_EMAIL_ADDRESS'
  ) {

    const subject =

      encodeURIComponent(

        `Live inquiry: ${title}`

      );


    actions.push(`

      <a
        class="action email"
        href="mailto:${escapeHTML(
          EMAIL_ADDRESS
        )}?subject=${subject}"
      >
        EMAIL ME ↗
      </a>

    `);

  }



  if (info.website) {

    actions.push(`

      <a
        class="action"
        href="${escapeHTML(
          info.website
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        WEBSITE ↗
      </a>

    `);

  }



  if (mapURL) {

    actions.push(`

      <a
        class="action"
        href="${mapURL}"
        target="_blank"
        rel="noopener noreferrer"
      >
        MAP ↗
      </a>

    `);

  }



  const actionsHTML =

    actions.length

      ?

      `
      <div class="actions">
        ${actions.join('')}
      </div>
      `

      :

      '';



  return `

    <article
      class="
        event
        ${info.leader ? 'leader' : ''}
        ${tonight ? 'has-status' : ''}
      "
    >


      ${
        tonight

          ?

          `
          <div class="status">
            TONIGHT
          </div>
          `

          :

          ''
      }


      <div class="event-date-column">


        <div class="event-month">
          ${date.month}
        </div>


        <div class="event-number">
          ${date.number}
        </div>


        <div class="event-day">
          ${date.weekday}
        </div>


        <div class="date-rule"></div>


        <div class="event-time">
          ${formatTime(event)}
        </div>


      </div>



      <div class="event-body">


        ${
          info.leader

            ?

            '<div class="leader-shape"></div>'

            :

            ''
        }


        ${topLabels}


        <h3
          class="event-title${titleClass}"
        >

          ${escapeHTML(title)}

        </h3>


        ${createPlayersHTML(
          info.players
        )}


        ${venueHTML}


        ${actionsHTML}


      </div>


    </article>

  `;

}



/* =========================================================
   SELECT MONTH
   ========================================================= */

function setMonth(month) {

  selectedMonth = month;


  document

    .querySelectorAll(
      '.month-button'
    )

    .forEach(

      button => {

        button
          .classList
          .toggle(

            'active',

            button.dataset.month ===
              month

          );

      }

    );


  renderEvents();

}



/* =========================================================
   RENDER EVENTS
   ========================================================= */

function renderEvents() {

  const container =

    document.getElementById(
      'events'
    );


  const filtered =

    selectedMonth === 'all'

      ?

      upcomingEvents

      :

      upcomingEvents.filter(

        event =>

          getMonthKey(event) ===
            selectedMonth

      );


  if (!filtered.length) {

    container.innerHTML = `

      <div class="message">

        No shows scheduled for this month.

      </div>

    `;


    return;

  }


  container.innerHTML =

    filtered

      .map(

        event => {

          const originalIndex =

            upcomingEvents
              .indexOf(event);


          return createEventCard(

            event,

            originalIndex

          );

        }

      )

      .join('');

}



/* =========================================================
   CLICK HANDLERS
   ========================================================= */

document.addEventListener(

  'click',

  function(event) {


    /* SHOW MORE */

    const showMore =

      event.target.closest(
        '.show-more'
      );


    if (showMore) {

      const hidden =

        showMore
          .previousElementSibling;


      if (
        !hidden ||
        !hidden.classList.contains(
          'hidden-players'
        )
      ) {

        return;

      }


      const open =

        hidden
          .classList
          .toggle('open');


      showMore
        .setAttribute(

          'aria-expanded',

          String(open)

        );


      showMore.textContent =

        open

          ?

          'SHOW LESS ↑'

          :

          'SHOW MORE ↓';


      return;

    }



    /* MONTH */

    const monthButton =

      event.target.closest(
        '.month-button'
      );


    if (monthButton) {

      setMonth(

        monthButton
          .dataset
          .month

      );

    }

  }

);



/* =========================================================
   GOOGLE CALENDAR
   ========================================================= */

async function loadCalendar() {

  const now =
    new Date();


  const timeMax =

    new Date(

      now.getFullYear() + 2,

      now.getMonth(),

      now.getDate()

    )

    .toISOString();


  const url =

    'https://www.googleapis.com/calendar/v3/calendars/' +

    encodeURIComponent(
      CALENDAR_ID
    ) +

    '/events' +

    '?key=' +

    encodeURIComponent(
      API_KEY
    ) +

    '&singleEvents=true' +

    '&orderBy=startTime' +

    '&timeMin=' +

    encodeURIComponent(
      now.toISOString()
    ) +

    '&timeMax=' +

    encodeURIComponent(
      timeMax
    ) +

    '&maxResults=250';



  try {

    const response =
      await fetch(url);


    if (!response.ok) {

      const errorText =
        await response.text();


      console.error(
        errorText
      );


      throw new Error(
        'Calendar request failed'
      );

    }


    const data =
      await response.json();


    upcomingEvents =

      (
        data.items ||
        []
      )

      .filter(

        event =>

          event.start &&

          event.end &&

          eventEnd(event) >= now

      );


    buildMonthFilters();

    renderEvents();

  }


  catch (error) {

    console.error(error);


    document
      .getElementById(
        'events'
      )
      .innerHTML = `

        <div class="message">

          Could not load the live schedule.

        </div>

      `;

  }

}



/* =========================================================
   START
   ========================================================= */

buildMonthFilters();

loadCalendar();

</script>
