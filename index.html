<style>

:root {
  --paper: #f3eee5;
  --card: #f7f2e9;
  --ink: #181313;
  --muted: #756b66;
  --crimson: #98182a;
  --crimson-dark: #76101f;
  --blush: #d8aaa5;
  --line: #cfc2b6;

  --serif: "Cormorant Garamond", Georgia, serif;
  --jp: "Noto Serif JP", serif;
  --sans: "Space Grotesk", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

main {
  position: relative;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 58px 30px 90px;
  overflow-x: clip;
}


/* =========================================================
   TRUMPET
   ========================================================= */




/* =========================================================
   HEADER
   ========================================================= */

header {
  position: relative;
  z-index: 2;
  padding: 25px 10px 78px;
}

.name-wrap {
  display: inline-block;
}

.artist-name {
  margin: 0;
  max-width: 640px;
  font-family: var(--serif);
  font-size: clamp(58px,8.5vw,100px);
  font-weight: 600;
  line-height: .82;
  letter-spacing: -3px;
}

.artist-name span {
  display: block;
}

.name-line {
  display: block;
  width: 100%;
  height: 1.5px;
  margin-top: 24px;
  background: var(--crimson);
  border: 0;
}

.artist-role {
  margin-top: 19px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
}


/* =========================================================
   SCHEDULE
   ========================================================= */

.schedule-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 27px;
}

.schedule-title {
  margin: 0;
  flex-shrink: 0;
  font-family: var(--serif);
  font-size: clamp(43px,6vw,65px);
  font-weight: 600;
  line-height: .95;
  letter-spacing: -1.5px;
}


/* =========================================================
   MAIN FILTER
   ========================================================= */

.month-filter {
  display: flex;
  flex-shrink: 0;
  height: 29px;
  border: 1px solid var(--crimson);
}

.month-button {
  min-width: 47px;
  padding: 0 7px;
  border: 0;
  border-right: 1px solid var(--crimson);
  background: transparent;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 7px;
  font-weight: 600;
  letter-spacing: .8px;
  cursor: pointer;
}

.month-button:last-child {
  border-right: 0;
}

.month-button.active {
  background: var(--crimson);
  color: var(--paper);
}


/* =========================================================
   PAST MONTH FILTER
   ========================================================= */

.past-month-wrap {
  width: 100%;
  margin: -3px 0 24px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--crimson) transparent;
  -webkit-overflow-scrolling: touch;
}

.past-month-wrap::-webkit-scrollbar {
  height: 3px;
}

.past-month-wrap::-webkit-scrollbar-thumb {
  background: var(--crimson);
}

.past-month-filter {
  display: flex;
  width: max-content;
  min-width: 100%;
  border-bottom: 1px solid var(--line);
}

.past-month-button {
  flex: 0 0 auto;
  padding: 10px 13px 9px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 1.2px;
  cursor: pointer;
  white-space: nowrap;
}

.past-month-button:first-child {
  padding-left: 4px;
  padding-right: 17px;
}

.past-month-button.active {
  color: var(--crimson);
}

.past-month-button.active::after {
  content: "";
  display: block;
  width: 100%;
  height: 2px;
  margin-top: 7px;
  background: var(--crimson);
}


/* =========================================================
   EVENT
   ========================================================= */

.event {
  position: relative;
  display: grid;
  grid-template-columns: 125px minmax(0,1fr);
  margin-bottom: 16px;
  background: rgba(247,242,233,.66);
  border: 1px solid var(--line);
  overflow: hidden;
}

.event.leader {
  border-color: var(--crimson);
}

.status {
  position: absolute;
  top: 0;
  left: 0;
  min-width: 125px;
  padding: 10px 16px;
  background: var(--crimson);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2.3px;
  text-align: center;
  z-index: 2;
}


/* =========================================================
   DATE
   ========================================================= */

.event-date-column {
  padding: 28px 22px 24px;
  border-right: 1px solid var(--line);
}

.event.has-status .event-date-column {
  padding-top: 63px;
}

.event-month {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 1px;
}

.event-number {
  margin-top: -3px;
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 55px;
  font-weight: 600;
  line-height: .92;
}

.event-day {
  margin-top: 4px;
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 2px;
}

.date-rule {
  width: 100%;
  height: 1px;
  margin: 15px 0;
  background: var(--line);
}

.event-time {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
}


/* =========================================================
   BODY
   ========================================================= */

.event-body {
  position: relative;
  min-width: 0;
  padding: 27px 28px 25px;
}

.leader-label,
.next-label {
  position: relative;
  z-index: 2;
  margin-bottom: 8px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.event-title {
  position: relative;
  z-index: 2;
  margin: 0 0 21px;
  font-family: var(--jp);
  font-size: clamp(20px,3vw,27px);
  font-weight: 600;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.event-title.english {
  font-family: var(--serif);
  font-size: clamp(26px,3.3vw,34px);
  line-height: 1.05;
}

.label {
  margin-bottom: 8px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}


/* =========================================================
   PLAYERS
   ========================================================= */

.players-section {
  margin-bottom: 24px;
}

.players {
  color: #342c29;
  font-family: var(--jp);
  font-size: 14px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.player {
  display: block;
}

.hidden-players {
  display: none;
}

.hidden-players.open {
  display: block;
}

.show-more {
  display: inline-block;
  margin-top: 11px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
}


/* =========================================================
   VENUE
   ========================================================= */

.venue-section {
  margin-top: 4px;
}

.venue {
  font-family: var(--jp);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
}

.action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 108px;
  padding: 10px 16px;
  border: 1px solid var(--crimson);
  color: var(--crimson);
  background: transparent;
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.7px;
  text-decoration: none;
}

.action:hover {
  background: var(--crimson);
  color: var(--paper);
}

button.action {
  cursor: pointer;
}

.action.email {
  min-width: 130px;
}


/* =========================================================
   LEADER SHOW
   ========================================================= */

.leader-shape {
  position: absolute;
  top: 0;
  right: 0;
  width: 115px;
  height: 95px;
  overflow: hidden;
  pointer-events: none;
  opacity: .9;
}

.leader-shape::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 58px;
  height: 58px;
  background: rgba(152,24,42,.82);
}

.leader-shape::after {
  content: "";
  position: absolute;
  right: 25px;
  top: 25px;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: rgba(216,170,165,.45);
}




/* MEDIA ARCHIVE */
.event-media{margin-top:22px;width:100%;min-width:0}
.event-media-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.event-media-title,.event-media-count{font-family:var(--sans);font-size:8px;font-weight:600;letter-spacing:1.7px;color:var(--crimson)}
.event-media-count{color:var(--muted);letter-spacing:1px}
.event-media-viewport{position:relative;width:100%;overflow:hidden}
.event-media-track{display:flex;width:100%;gap:0;overflow-x:auto;overflow-y:hidden;padding:0;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.event-media-track::-webkit-scrollbar{display:none}
.event-media-item{position:relative;flex:0 0 100%;width:100%;min-width:100%;scroll-snap-align:start;scroll-snap-stop:always;background:var(--card);overflow:hidden}
.event-media-image-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in;touch-action:manipulation}
.event-media-image{display:block;width:100%;height:auto;object-fit:contain;background:var(--card)}
.event-media-item.photo .event-media-image{width:100%;height:auto;object-fit:contain}
.event-media-badge{position:absolute;top:10px;left:10px;z-index:3;padding:6px 8px 5px;background:rgba(152,24,42,.92);color:var(--paper);font-family:var(--sans);font-size:7px;font-weight:600;letter-spacing:1.3px;pointer-events:none}
.event-media-video{display:block;width:100%;background:#181313;overflow:hidden}
.event-media-video.youtube{aspect-ratio:16/9}
.event-media-video iframe{display:block;width:100%;height:100%;border:0}
.event-media-link{display:flex;align-items:center;justify-content:center;width:100%;padding:42px 22px 28px;background:linear-gradient(135deg,rgba(152,24,42,.96),rgba(118,16,31,.96));color:var(--paper);text-decoration:none;text-align:center}
.event-media-link.youtube,.event-media-link.video{aspect-ratio:16/9}
.event-media-link.instagram{aspect-ratio:9/16;max-height:78vh}
.event-media-link-inner{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:1.7px;line-height:1.7}
.event-media-play{display:block;margin-bottom:12px;font-family:var(--serif);font-size:38px;line-height:1}
.event-media-dots{display:flex;gap:6px;align-items:center;margin-top:10px}
.event-media-dot{width:5px;height:5px;padding:0;border:1px solid var(--crimson);border-radius:50%;background:transparent;cursor:pointer}
.event-media-dot.active{background:var(--crimson)}
.event-media-hint{margin-top:7px;color:var(--muted);font-family:var(--sans);font-size:7px;font-weight:600;letter-spacing:1.3px}

.event-media-nav{position:absolute;top:50%;z-index:6;width:28px;height:36px;padding:0;border:1px solid rgba(243,238,229,.55);background:rgba(24,19,19,.42);color:var(--paper);font-family:Georgia,serif;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);cursor:pointer;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:opacity .18s ease,background .18s ease}
.event-media-nav:hover{background:rgba(152,24,42,.82)}
.event-media-nav.prev{left:7px}.event-media-nav.next{right:7px}.event-media-nav[hidden]{display:none}
@media(max-width:650px){.event-media-nav{width:24px;height:32px;font-size:17px}.event-media-nav.prev{left:5px}.event-media-nav.next{right:5px}}

@media(max-width:650px){.event-media{margin-top:20px}.event-media-title,.event-media-count{font-size:7px}.event-media-badge{top:8px;left:8px}.event-media-link-inner{font-size:9px}}

/* =========================================================
   INLINE FLYER
   ========================================================= */

.event-flyer { margin-top: 22px; }
.event-flyer-button {
  display:block; width:100%; padding:0; border:0;
  background:transparent; cursor:zoom-in; text-align:left;
}
.event-flyer-image {
  display:block; width:100%; max-width:430px; height:auto;
  max-height:620px; object-fit:contain; object-position:left top;
  border:1px solid var(--line); background:var(--card);
  transition:opacity .18s ease;
}
.event-flyer-button:hover .event-flyer-image { opacity:.92; }
.event-flyer-hint {
  margin-top:7px; color:var(--muted); font-family:var(--sans);
  font-size:7px; font-weight:600; letter-spacing:1.4px;
  text-transform:uppercase;
}

/* =========================================================
   FLYER
   ========================================================= */

.flyer-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(24,19,19,.82);
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s ease, visibility .22s ease;
}

.flyer-modal.open {
  opacity: 1;
  visibility: visible;
}

.flyer-modal-inner {
  position: relative;
  max-width: min(680px, 92vw);
  max-height: 90vh;
}

.flyer-modal-image {
  display: block;
  max-width: 100%;
  max-height: 86vh;
  width: auto;
  height: auto;
  object-fit: contain;
  background: var(--card);
  box-shadow: 0 18px 55px rgba(0,0,0,.28);
}

.flyer-close {
  position: absolute;
  top: -42px;
  right: 0;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--paper);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
}

body.flyer-open {
  overflow: hidden;
}

.flyer-nav {
  position: fixed;
  top: 50%;
  z-index: 102;
  width: 28px;
  height: 38px;
  border: 0;
  background: transparent;
  color: var(--paper);
  font-size: 22px;
  text-shadow: 0 1px 5px rgba(0,0,0,.85);
  line-height: 1;
  transform: translateY(-50%);
  cursor: pointer;
}
.flyer-nav-prev { left: 12px; }
.flyer-nav-next { right: 12px; }
.flyer-nav[hidden] { display:none; }

@media (max-width:650px) {
  .flyer-nav {
    width: 24px;
    height: 34px;
    font-size: 16px;
  }
  .flyer-nav-prev { left: 5px; }
  .flyer-nav-next { right: 5px; }
}

/* =========================================================
   PAST
   ========================================================= */

.past-heading {
  margin: 2px 0 12px;
  color: var(--crimson);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
}

.past-event {
  opacity: .78;
}

.past-event .event-number,
.past-event .event-day {
  color: var(--muted);
}


/* =========================================================
   MESSAGE / FOOTER
   ========================================================= */

.message {
  padding: 40px 5px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 13px;
}

footer {
  margin-top: 75px;
  padding: 32px 4px 15px;
  border-top: 1px solid var(--line);
}

.footer-name {
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 4px;
}

.footer-role {
  margin-top: 8px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 8px;
  letter-spacing: 3px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:380px) {

  }

<script>


const API_KEY =
  SETTINGS.API_KEY;

const CALENDAR_ID =
  SETTINGS.CALENDAR_ID;

const EMAIL_ADDRESS =
  SETTINGS.EMAIL_ADDRESS;


let upcomingEvents = [];
let pastEvents = [];

let selectedFilter = 'all';

/* ★ PAST内の月 */
let selectedPastMonth = 'all';



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value = '') {

  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}



/* =========================================================
   WEBSITE
   ========================================================= */

function normalizeWebsiteURL(value = '') {

  let text =
    String(value).trim();


  const markdown =
    text.match(/\]\((https?:\/\/[^)\s]+)\)/i);


  if (markdown) {
    text = markdown[1];
  }


  const plain =
    text.match(/https?:\/\/[^\s<>"')\]]+/i);


  if (!plain) {
    return '';
  }


  try {

    const url =
      new URL(plain[0]);


    if (
      url.protocol !== 'https:' &&
      url.protocol !== 'http:'
    ) {
      return '';
    }


    return url.href;

  }

  catch {
    return '';
  }

}



/* =========================================================
   IMAGE PATH
   ========================================================= */

function normalizeImagePath(value = '') {
  let text=String(value).trim();
  if(!text)return '';

  /* Google Calendar: filename.jpg (GitHub URL) の形にも対応 */
  const paren=text.match(/\((https?:\/\/[^)\s]+)\)/i);
  if(paren) text=paren[1];

  const md=text.match(/\]\((https?:\/\/[^)\s]+)\)/i);
  if(md) text=md[1];

  try{
    const url=new URL(text);
    if(url.hostname==='github.com' && url.pathname.includes('/blob/')){
      const parts=url.pathname.split('/').filter(Boolean);
      const i=parts.indexOf('blob');
      if(i>=2 && parts.length>i+2){
        const owner=parts[0], repo=parts[1], branch=parts[i+1];
        const path=parts.slice(i+2).join('/');
        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
      }
    }
  }catch{}

  if(/^https?:\/\//i.test(text))return text;

  text=text.split(/\s+/)[0];
  if(/^images\//i.test(text))return text;
  return `images/${text.replace(/^\.\//,'')}`;
}


function normalizeVideoURL(value=''){
  const text=String(value).trim();
  if(!text)return '';
  const md=text.match(/\]\((https?:\/\/[^)\s]+)\)/i);
  const hit=md?md[1]:(text.match(/https?:\/\/[^\s<>"')\]]+/i)||[])[0];
  if(!hit)return '';
  try{const u=new URL(hit);return (u.protocol==='https:'||u.protocol==='http:')?u.href:''}catch{return ''}
}
function getYouTubeEmbedURL(value=''){
  try{
    const u=new URL(value);let id='';
    if(u.hostname==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';
    if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){
      if(u.pathname==='/watch')id=u.searchParams.get('v')||'';
      else if(/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split('/').filter(Boolean)[1]||'';
    }
    return /^[A-Za-z0-9_-]{6,}$/.test(id)?`https://www.youtube-nocookie.com/embed/${id}`:'';
  }catch{return ''}
}
function getVideoPlatform(value=''){
  try{const h=new URL(value).hostname.replace(/^www\./,'').toLowerCase();if(['youtube.com','m.youtube.com','youtu.be'].includes(h))return 'YOUTUBE';if(['instagram.com','instagr.am'].includes(h))return 'INSTAGRAM'}catch{}
  return 'VIDEO';
}

/* =========================================================
   DESCRIPTION
   ========================================================= */

function parseDescription(description = '') {

  const text =
    String(description)

      .replace(/\r/g, '')

      .replace(/<br\s*\/?>/gi, '\n')

      .replace(/<\/p>/gi, '\n')

      .replace(/<[^>]+>/g, '');


  const lines =
    text
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean);


  const players = [];
  const images = [];
  const photos = [];
  const videos = [];

  let place = '';
  let website = '';
  let reservation = '';
  let leader = false;

  let readingPlayers = false;


  for (const line of lines) {


    if (/^players\s*:/i.test(line)) {

      readingPlayers = true;

      const sameLine =
        line
          .replace(/^players\s*:/i, '')
          .trim();


      if (sameLine) {
        players.push(sameLine);
      }


      continue;
    }


    if (/^place\s*:/i.test(line)) {

      readingPlayers = false;

      place =
        line
          .replace(/^place\s*:/i, '')
          .trim();

      continue;
    }


    if (/^(website|venueurl)\s*:/i.test(line)) {

      readingPlayers = false;

      const raw =
        line
          .replace(/^(website|venueurl)\s*:/i, '')
          .trim();


      website =
        normalizeWebsiteURL(raw);

      continue;
    }


    if (/^image\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeImagePath(line.replace(/^image\s*:/i,'').trim());
      if(value) images.push(value);
      continue;
    }

    if (/^photo\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeImagePath(line.replace(/^photo\s*:/i,'').trim());
      if(value) photos.push(value);
      continue;
    }

    if (/^video\s*:/i.test(line)) {
      readingPlayers = false;
      const value = normalizeVideoURL(line.replace(/^video\s*:/i,'').trim());
      if(value) videos.push(value);
      continue;
    }


    if (/^reservation\s*:/i.test(line)) {
      readingPlayers = false;
      const raw = line.replace(/^reservation\s*:/i, '').trim();
      reservation = /^me$/i.test(raw) ? 'me' : normalizeWebsiteURL(raw);
      continue;
    }


    if (/^leader\s*:/i.test(line)) {

      readingPlayers = false;

      const value =
        line
          .replace(/^leader\s*:/i, '')
          .trim()
          .toLowerCase();


      leader =
        ['yes','true','1','leader']
          .includes(value);

      continue;
    }


    if (/^(reserveurl|email)\s*:/i.test(line)) {

      readingPlayers = false;

      continue;
    }


    if (readingPlayers) {
      players.push(line);
    }

  }


  return {
    players,
    place,
    website,
    image: images[0] || '',
    images,
    photos,
    videos,
    reservation,
    leader
  };

}



/* =========================================================
   VENUE
   ========================================================= */

function getVenue(location = '') {

  if (!location) {
    return '';
  }


  return location
    .split(/[,、]/)[0]
    .trim();

}



/* =========================================================
   DATE HELPERS
   ========================================================= */

function eventStart(event) {

  return new Date(
    event.start.dateTime ||
    event.start.date
  );

}


function eventEnd(event) {

  return new Date(
    event.end.dateTime ||
    event.end.date
  );

}


function tokyoDateKey(date) {

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    )
    .formatToParts(date);


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return (
    `${values.year}-${values.month}-${values.day}`
  );

}


function isToday(event) {

  return (
    tokyoDateKey(eventStart(event))
    ===
    tokyoDateKey(new Date())
  );

}



/* =========================================================
   DATE DISPLAY
   ========================================================= */

function getDateParts(event) {

  const date =
    eventStart(event);


  const month =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        month: 'short'
      }
    )
    .format(date)
    .toUpperCase();


  const number =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        day: '2-digit'
      }
    )
    .format(date);


  const weekday =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        weekday: 'short'
      }
    )
    .format(date)
    .toUpperCase();


  return {
    month,
    number,
    weekday
  };

}


function formatTime(event) {

  if (!event.start.dateTime) {
    return 'ALL DAY';
  }


  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone: 'Asia/Tokyo',
      hour: 'numeric',
      minute: '2-digit'
    }
  )
  .format(
    eventStart(event)
  );

}



/* =========================================================
   MONTH HELPERS
   ========================================================= */

function getMonthKey(event) {

  const date =
    eventStart(event);


  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit'
      }
    )
    .formatToParts(date);


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return (
    `${values.year}-${values.month}`
  );

}


function getCurrentTokyoMonth() {

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit'
      }
    )
    .formatToParts(new Date());


  const values =
    Object.fromEntries(
      parts.map(
        part => [
          part.type,
          part.value
        ]
      )
    );


  return {
    year: Number(values.year),
    month: Number(values.month)
  };

}


function makeMonthKey(year, month) {

  return (
    String(year)
    + '-'
    + String(month).padStart(2,'0')
  );

}


function getMonthName(year, month) {

  const date =
    new Date(
      Date.UTC(
        year,
        month - 1,
        1
      )
    );


  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone: 'UTC',
      month: 'short'
    }
  )
  .format(date)
  .toUpperCase();

}



/* =========================================================
   MAIN FILTER
   ========================================================= */

function buildMonthFilters() {

  const current =
    getCurrentTokyoMonth();


  let nextYear =
    current.year;

  let nextMonth =
    current.month + 1;


  if (nextMonth > 12) {

    nextMonth = 1;
    nextYear += 1;

  }


  const currentKey =
    makeMonthKey(
      current.year,
      current.month
    );


  const nextKey =
    makeMonthKey(
      nextYear,
      nextMonth
    );


  const filter =
    document.getElementById(
      'monthFilter'
    );


  filter.innerHTML = `

    <button
      class="month-button ${selectedFilter === 'all' ? 'active' : ''}"
      data-filter="all"
      type="button"
    >
      ALL
    </button>

    <button
      class="month-button ${selectedFilter === currentKey ? 'active' : ''}"
      data-filter="${currentKey}"
      type="button"
    >
      ${getMonthName(
        current.year,
        current.month
      )}
    </button>

    <button
      class="month-button ${selectedFilter === nextKey ? 'active' : ''}"
      data-filter="${nextKey}"
      type="button"
    >
      ${getMonthName(
        nextYear,
        nextMonth
      )}
    </button>

    <button
      class="month-button ${selectedFilter === 'past' ? 'active' : ''}"
      data-filter="past"
      type="button"
    >
      PAST
    </button>

  `;

}



/* =========================================================
   PAST MONTH FILTER
   ========================================================= */

function getPastMonths() {

  return [
    ...new Set(
      pastEvents.map(
        event =>
          getMonthKey(event)
      )
    )
  ];

}


function getPastMonthLabel(key) {

  const [
    year,
    month
  ] =
    key
      .split('-')
      .map(Number);


  return (
    `${getMonthName(year, month)} ${year}`
  );

}


function createPastMonthFilterHTML() {

  const months =
    getPastMonths();


  if (!months.length) {
    return '';
  }


  return `

    <div class="past-month-wrap">

      <div class="past-month-filter">

        <button
          class="past-month-button ${
            selectedPastMonth === 'all'
              ? 'active'
              : ''
          }"
          data-past-month="all"
          type="button"
        >
          ALL PAST
        </button>

        ${months
          .map(
            month => `

              <button
                class="past-month-button ${
                  selectedPastMonth === month
                    ? 'active'
                    : ''
                }"
                data-past-month="${month}"
                type="button"
              >
                ${getPastMonthLabel(month)}
              </button>

            `
          )
          .join('')
        }

      </div>

    </div>

  `;

}



/* =========================================================
   JAPANESE
   ========================================================= */

function containsJapanese(text = '') {

  return /[\u3040-\u30ff\u3400-\u9fff]/
    .test(text);

}



/* =========================================================
   PLAYERS
   ========================================================= */

function createPlayersHTML(players) {

  if (!players.length) {
    return '';
  }


  const visible =
    players.slice(0,6);

  const hidden =
    players.slice(6);


  let html = `

    <div class="players-section">

      <div class="label">
        PLAYERS
      </div>

      <div class="players">

        ${visible
          .map(
            player =>
              `<span class="player">${escapeHTML(player)}</span>`
          )
          .join('')
        }

  `;


  if (hidden.length) {

    html += `

      <div class="hidden-players">

        ${hidden
          .map(
            player =>
              `<span class="player">${escapeHTML(player)}</span>`
          )
          .join('')
        }

      </div>

      <button
        class="show-more"
        type="button"
        aria-expanded="false"
      >
        SHOW MORE ↓
      </button>

    `;

  }


  html += `

      </div>

    </div>

  `;


  return html;

}




function createEventMediaHTML(info,title){
  const items=[];

  (info.videos||[]).forEach(video=>{
    const embed=getYouTubeEmbedURL(video);
    const platform=getVideoPlatform(video);

    if(embed){
      items.push(`<div class="event-media-item video"><div class="event-media-video youtube"><iframe src="${escapeHTML(embed)}" title="${escapeHTML(title)} video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div>`);
    }else{
      const cls=platform==='INSTAGRAM'?'instagram':(platform==='YOUTUBE'?'youtube':'video');
      items.push(`<div class="event-media-item video"><a class="event-media-link ${cls}" href="${escapeHTML(video)}" target="_blank" rel="noopener noreferrer"><span class="event-media-link-inner"><span class="event-media-play">▶</span>WATCH ON ${platform} ↗</span></a></div>`);
    }
  });

  (info.images||[]).forEach((image,i)=>{
    items.push(`<div class="event-media-item flyer"><button class="event-media-image-button" type="button" data-flyer="${escapeHTML(image)}" data-title="${escapeHTML(title)}"><img class="event-media-image" src="${escapeHTML(image)}" alt="${escapeHTML(title)} flyer" loading="lazy"></button></div>`);
  });

  (info.photos||[]).forEach((photo,i)=>{
    items.push(`<div class="event-media-item photo"><button class="event-media-image-button" type="button" data-flyer="${escapeHTML(photo)}" data-title="${escapeHTML(title)} live photo ${i+1}"><img class="event-media-image" src="${escapeHTML(photo)}" alt="${escapeHTML(title)} live photo ${i+1}" loading="lazy"></button></div>`);
  });

  if(!items.length)return '';
  const multi=items.length>1;

  return `<div class="event-media" data-media-gallery>
    <div class="event-media-head"><div class="event-media-title">MEDIA</div><div class="event-media-count"><span data-media-current>1</span> / ${items.length}</div></div>
    <div class="event-media-viewport"><button class="event-media-nav prev" type="button" aria-label="Previous media" hidden>‹</button><div class="event-media-track" data-media-track>${items.join('')}</div><button class="event-media-nav next" type="button" aria-label="Next media">›</button></div>
    ${multi?`<div class="event-media-dots">${items.map((_,i)=>`<button class="event-media-dot ${i===0?'active':''}" type="button" data-media-dot="${i}" aria-label="Show media ${i+1}"></button>`).join('')}</div><div class="event-media-hint">SWIPE / SCROLL FOR MORE →</div>`:`<div class="event-media-hint">TAP IMAGE TO ENLARGE ↗</div>`}
  </div>`;
}

/* =========================================================
   EVENT CARD
   ========================================================= */

function createEventCard(
  event,
  originalIndex,
  isPast = false
) {

  const info =
    parseDescription(
      event.description || ''
    );


  // Venue name shown on the site:
  // 1. Prefer "Place:" from the Google Calendar description.
  // 2. If Place: is missing, fall back to the Calendar location field.
  const venue =
    info.place ||
    getVenue(
      event.location || ''
    );


  const date =
    getDateParts(event);


  const tonight =
    !isPast &&
    isToday(event);


  const isNext =
    !isPast &&
    originalIndex === 0 &&
    !tonight;


  const title =
    event.summary ||
    'Live';


  const titleClass =
    containsJapanese(title)
      ? ''
      : ' english';


  const mapURL =
    event.location
      ?
      'https://www.google.com/maps/search/?api=1&query='
      +
      encodeURIComponent(
        event.location
      )
      :
      '';


  let topLabels = '';


  if (info.leader) {

    topLabels += `

      <div class="leader-label">
        LEADER SHOW
      </div>

    `;

  }


  if (isNext) {

    topLabels += `

      <div class="next-label">
        NEXT SHOW
      </div>

    `;

  }


  const venueToDisplay =
    venue;


  let venueHTML = '';


  if (venueToDisplay) {

    venueHTML = `

      <div class="venue-section">

        <div class="label">
          VENUE
        </div>

        <div class="venue">
          ${escapeHTML(
            venueToDisplay
          )}
        </div>

      </div>

    `;

  }


  const actions = [];


  /* RESERVATION: Calendar description controls the destination. */
  if (!isPast && info.reservation) {
    if (info.reservation === 'me') {
      actions.push(`<button class="action reservation" type="button" data-reservation-me data-reservation-title="${escapeHTML(title)}" data-reservation-date="${escapeHTML(date.month + ' ' + date.number + ' / ' + formatTime(event))}">RESERVATION →</button>`);
    } else {
      actions.push(`<a class="action reservation" href="${escapeHTML(info.reservation)}" target="_blank" rel="noopener noreferrer">RESERVATION →</a>`);
    }
  }


  const mediaHTML = createEventMediaHTML(info, title);


  if (info.website) {

    actions.push(`

      <a
        class="action"
        href="${escapeHTML(
          info.website
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        WEBSITE ↗
      </a>

    `);

  }


  if (mapURL) {

    actions.push(`

      <a
        class="action"
        href="${mapURL}"
        target="_blank"
        rel="noopener noreferrer"
      >
        MAP ↗
      </a>

    `);

  }


  const actionsHTML =
    actions.length
      ?
      `
        <div class="actions">
          ${actions.join('')}
        </div>
      `
      :
      '';


  return `

    <article
      class="
        event
        ${info.leader ? 'leader' : ''}
        ${tonight ? 'has-status' : ''}
        ${isPast ? 'past-event' : ''}
      "
    >

      ${
        tonight
          ?
          `
            <div class="status">
              TONIGHT
            </div>
          `
          :
          ''
      }


      <div class="event-date-column">

        <div class="event-month">
          ${date.month}
        </div>

        <div class="event-number">
          ${date.number}
        </div>

        <div class="event-day">
          ${date.weekday}
        </div>

        <div class="date-rule"></div>

        <div class="event-time">
          ${formatTime(event)}
        </div>

      </div>


      <div class="event-body">

        ${
          info.leader
            ?
            '<div class="leader-shape"></div>'
            :
            ''
        }


        ${topLabels}


        <h3 class="event-title${titleClass}">
          ${escapeHTML(title)}
        </h3>


        ${createPlayersHTML(
          info.players
        )}


        ${venueHTML}


        ${mediaHTML}


        ${actionsHTML}

      </div>

    </article>

  `;

}



/* =========================================================
   SET MAIN FILTER
   ========================================================= */

function setFilter(filter) {

  selectedFilter =
    filter;


  if (filter !== 'past') {
    selectedPastMonth = 'all';
  }


  buildMonthFilters();

  renderEvents();

}



/* =========================================================
   RENDER
   ========================================================= */

function renderEvents() {

  const container =
    document.getElementById(
      'events'
    );


  /* =======================================================
     PAST
     ======================================================= */

  if (selectedFilter === 'past') {


    if (!pastEvents.length) {

      container.innerHTML = `

        <div class="message">
          No past shows found.
        </div>

      `;

      return;
    }


    const filteredPastEvents =
      selectedPastMonth === 'all'
        ?
        pastEvents
        :
        pastEvents.filter(
          event =>
            getMonthKey(event) ===
              selectedPastMonth
        );


    container.innerHTML = `

      <div class="past-heading">
        PAST SHOWS
      </div>

      ${createPastMonthFilterHTML()}

      ${
        filteredPastEvents.length
          ?
          filteredPastEvents
            .map(
              event =>
                createEventCard(
                  event,
                  -1,
                  true
                )
            )
            .join('')
          :
          `
            <div class="message">
              No past shows found for this month.
            </div>
          `
      }

    `;


    return;

  }


  /* =======================================================
     UPCOMING
     ======================================================= */

  const filtered =
    selectedFilter === 'all'
      ?
      upcomingEvents
      :
      upcomingEvents.filter(
        event =>
          getMonthKey(event) ===
            selectedFilter
      );


  if (!filtered.length) {

    container.innerHTML = `

      <div class="message">
        No shows scheduled for this month.
      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(
        event => {

          const originalIndex =
            upcomingEvents
              .indexOf(event);


          return createEventCard(
            event,
            originalIndex,
            false
          );

        }
      )
      .join('');

}




/* =========================================================
   FLYER MODAL
   ========================================================= */

const flyerModal = document.getElementById('flyerModal');
const flyerModalImage = document.getElementById('flyerModalImage');
const flyerClose = document.getElementById('flyerClose');
const flyerPrev = document.getElementById('flyerPrev');
const flyerNext = document.getElementById('flyerNext');

let flyerGallery = [];
let flyerGalleryIndex = 0;
let flyerTouchStartX = null;

function updateFlyerNav() {
  const multiple = flyerGallery.length > 1;
  flyerPrev.hidden = !multiple;
  flyerNext.hidden = !multiple;
}

function showFlyerAt(index) {
  if (!flyerGallery.length) return;

  flyerGalleryIndex =
    (index + flyerGallery.length) % flyerGallery.length;

  const item = flyerGallery[flyerGalleryIndex];
  flyerModalImage.src = item.src;
  flyerModalImage.alt = item.title || 'Image';
  updateFlyerNav();
}

function openFlyer(src, title = 'Image', gallery = null, startIndex = 0) {
  if (!src) return;

  flyerGallery =
    Array.isArray(gallery) && gallery.length
      ? gallery
      : [{ src, title }];

  flyerGalleryIndex = Math.max(0, startIndex);
  showFlyerAt(flyerGalleryIndex);

  flyerModal.classList.add('open');
  flyerModal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('flyer-open');
}

function moveFlyer(step) {
  if (flyerGallery.length < 2) return;
  showFlyerAt(flyerGalleryIndex + step);
}

function closeFlyer() {
  flyerModal.classList.remove('open');
  flyerModal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('flyer-open');

  setTimeout(() => {
    if (!flyerModal.classList.contains('open')) {
      flyerModalImage.src = '';
      flyerGallery = [];
      flyerGalleryIndex = 0;
      updateFlyerNav();
    }
  }, 220);
}

flyerClose.addEventListener('click', closeFlyer);

flyerPrev.addEventListener('click', event => {
  event.stopPropagation();
  moveFlyer(-1);
});

flyerNext.addEventListener('click', event => {
  event.stopPropagation();
  moveFlyer(1);
});

flyerModal.addEventListener('click', event => {
  if (event.target === flyerModal) {
    closeFlyer();
  }
});

flyerModalImage.addEventListener('touchstart', event => {
  flyerTouchStartX = event.changedTouches[0]?.clientX ?? null;
}, { passive:true });

flyerModalImage.addEventListener('touchend', event => {
  if (flyerTouchStartX === null || flyerGallery.length < 2) {
    flyerTouchStartX = null;
    return;
  }

  const endX = event.changedTouches[0]?.clientX;
  if (typeof endX === 'number') {
    const dx = endX - flyerTouchStartX;
    if (Math.abs(dx) > 45) {
      moveFlyer(dx < 0 ? 1 : -1);
    }
  }

  flyerTouchStartX = null;
}, { passive:true });

document.addEventListener('keydown', event => {
  if (!flyerModal.classList.contains('open')) return;

  if (event.key === 'Escape') {
    closeFlyer();
  } else if (event.key === 'ArrowLeft') {
    moveFlyer(-1);
  } else if (event.key === 'ArrowRight') {
    moveFlyer(1);
  }
});

document.addEventListener(
  'click',
  function(event) {


    /* FLYER / LIVE PHOTO */

    const flyerButton =
      event.target.closest(
        '.event-flyer-button, .event-media-image-button'
      );

    if (flyerButton) {

      const mediaGallery =
        flyerButton.closest(
          '[data-media-gallery]'
        );

      if (
        mediaGallery &&
        flyerButton.classList.contains(
          'event-media-image-button'
        )
      ) {

        const buttons =
          [
            ...mediaGallery.querySelectorAll(
              '.event-media-image-button'
            )
          ];

        const gallery =
          buttons
            .map(button => ({
              src: button.dataset.flyer,
              title:
                button.dataset.title
                || 'Image'
            }))
            .filter(item => item.src);

        const startIndex =
          Math.max(
            0,
            buttons.indexOf(flyerButton)
          );

        openFlyer(
          flyerButton.dataset.flyer,
          flyerButton.dataset.title || 'Image',
          gallery,
          startIndex
        );

      } else {

        openFlyer(
          flyerButton.dataset.flyer,
          flyerButton.dataset.title || 'Image'
        );

      }

      return;
    }


    /* SHOW MORE */

    const showMore =
      event.target.closest(
        '.show-more'
      );


    if (showMore) {

      const hidden =
        showMore
          .previousElementSibling;


      if (
        !hidden ||
        !hidden.classList.contains(
          'hidden-players'
        )
      ) {
        return;
      }


      const open =
        hidden
          .classList
          .toggle('open');


      showMore.setAttribute(
        'aria-expanded',
        String(open)
      );


      showMore.textContent =
        open
          ?
          'SHOW LESS ↑'
          :
          'SHOW MORE ↓';


      return;
    }


    /* MAIN FILTER */

    const filterButton =
      event.target.closest(
        '.month-button'
      );


    if (filterButton) {

      setFilter(
        filterButton
          .dataset
          .filter
      );

      return;
    }


    /* PAST MONTH FILTER */

    const pastMonthButton =
      event.target.closest(
        '.past-month-button'
      );


    if (pastMonthButton) {

      selectedPastMonth =
        pastMonthButton
          .dataset
          .pastMonth;


      renderEvents();

      return;
    }

  }
);



/* =========================================================
   GOOGLE CALENDAR
   ★ 2018年から取得
   ★ 250件を超えても全件取得
   ========================================================= */

async function loadCalendar() {

  const now =
    new Date();


  const timeMinDate =
    new Date(
      '2018-01-01T00:00:00+09:00'
    );


  const timeMaxDate =
    new Date(now);


  timeMaxDate.setFullYear(
    timeMaxDate.getFullYear() + 2
  );


  try {

    const allEvents = [];

    let pageToken = '';


    do {

      const params =
        new URLSearchParams({
          key: API_KEY,
          singleEvents: 'true',
          orderBy: 'startTime',
          timeMin: timeMinDate.toISOString(),
          timeMax: timeMaxDate.toISOString(),
          maxResults: '250'
        });


      if (pageToken) {

        params.set(
          'pageToken',
          pageToken
        );

      }


      const url =
        'https://www.googleapis.com/calendar/v3/calendars/'
        +
        encodeURIComponent(
          CALENDAR_ID
        )
        +
        '/events?'
        +
        params.toString();


      const response =
        await fetch(url);


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(errorText);


        throw new Error(
          'Calendar request failed'
        );

      }


      const data =
        await response.json();


      allEvents.push(
        ...(data.items || [])
      );


      pageToken =
        data.nextPageToken || '';


    } while (pageToken);


    const events =
      allEvents
        .filter(
          event =>
            event.start &&
            event.end
        );


    upcomingEvents =
      events
        .filter(
          event =>
            eventEnd(event) >= now
        )
        .sort(
          (a,b) =>
            eventStart(a) -
            eventStart(b)
        );


    pastEvents =
      events
        .filter(
          event =>
            eventEnd(event) < now
        )
        .sort(
          (a,b) =>
            eventStart(b) -
            eventStart(a)
        );


    buildMonthFilters();

    renderEvents();

  }


  catch (error) {

    console.error(error);


    document
      .getElementById(
        'events'
      )
      .innerHTML = `

        <div class="message">
          Could not load the live schedule.
        </div>

      `;

  }

}

function updateMediaGallery(gallery){
  const track=gallery.querySelector('[data-media-track]');
  const items=[...gallery.querySelectorAll('.event-media-item')];
  if(!track||!items.length)return;
  const left=track.getBoundingClientRect().left;
  let idx=0,dist=Infinity;
  items.forEach((item,i)=>{const d=Math.abs(item.getBoundingClientRect().left-left);if(d<dist){dist=d;idx=i}});
  const current=gallery.querySelector('[data-media-current]');if(current)current.textContent=String(idx+1);
  gallery.querySelectorAll('[data-media-dot]').forEach((dot,i)=>dot.classList.toggle('active',i===idx));
}
document.addEventListener('scroll',e=>{const track=e.target.closest?.('[data-media-track]');if(track){const g=track.closest('[data-media-gallery]');if(g)updateMediaGallery(g)}},true);
document.addEventListener('click',e=>{const dot=e.target.closest('[data-media-dot]');if(!dot)return;const g=dot.closest('[data-media-gallery]'),track=g?.querySelector('[data-media-track]'),items=g?[...g.querySelectorAll('.event-media-item')]:[],i=Number(dot.dataset.mediaDot);if(track&&items[i])track.scrollTo({left:items[i].offsetLeft,behavior:'smooth'})});

/* MEDIA CAROUSEL ARROWS */
function updateMediaNav(viewport){
  if(!viewport)return;
  const track=viewport.querySelector('.event-media-track');
  const prev=viewport.querySelector('.event-media-nav.prev');
  const next=viewport.querySelector('.event-media-nav.next');
  if(!track||!prev||!next)return;
  const count=track.querySelectorAll('.event-media-item').length;
  if(count<=1){prev.hidden=true;next.hidden=true;return;}
  const max=Math.max(0,track.scrollWidth-track.clientWidth);
  prev.hidden=track.scrollLeft<=2;
  next.hidden=track.scrollLeft>=max-2;
}
function refreshAllMediaNav(){
  document.querySelectorAll('.event-media-viewport').forEach(updateMediaNav);
}
document.addEventListener('click',e=>{
  const button=e.target.closest('.event-media-nav');
  if(!button)return;
  e.preventDefault();e.stopPropagation();
  const viewport=button.closest('.event-media-viewport');
  const track=viewport&&viewport.querySelector('.event-media-track');
  if(!track)return;
  track.scrollBy({left:(button.classList.contains('prev')?-1:1)*track.clientWidth,behavior:'smooth'});
  setTimeout(()=>updateMediaNav(viewport),400);
});
document.addEventListener('scroll',e=>{
  const track=e.target;
  if(track instanceof Element&&track.classList.contains('event-media-track')){
    updateMediaNav(track.closest('.event-media-viewport'));
  }
},true);
window.addEventListener('resize',refreshAllMediaNav);
const mediaNavObserver=new MutationObserver(refreshAllMediaNav);
mediaNavObserver.observe(document.getElementById('events'),{childList:true,subtree:true});
