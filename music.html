<style>
:root{--paper:#f3eee5;--card:#f7f2e9;--ink:#181313;--muted:#756b66;--crimson:#98182a;--crimson-dark:#76101f;--line:#cfc2b6;--serif:"Cormorant Garamond",Georgia,serif;--jp:"Noto Serif JP",serif;--sans:"Space Grotesk",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}main{width:100%;max-width:1100px;margin:0 auto;padding:58px 30px 90px;overflow-x:clip}
header{position:relative;padding:25px 10px 78px}.name-wrap{display:inline-block}.artist-name{margin:0;max-width:640px;font-family:var(--serif);font-size:clamp(58px,8.5vw,100px);font-weight:600;line-height:.82;letter-spacing:-3px}.artist-name span{display:block}.name-line{display:block;width:100%;height:1.5px;margin-top:24px;background:var(--crimson)}.artist-role{margin-top:19px;color:var(--crimson);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:5px;text-transform:uppercase}
.menu-toggle{position:absolute;top:42px;right:32px;z-index:30;width:46px;height:38px;padding:5px 3px;border:0;background:transparent;cursor:pointer}.menu-toggle span{display:block;width:100%;height:2px;margin:7px 0;background:var(--crimson);transition:transform .25s ease,opacity .2s ease}.menu-toggle.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}.menu-toggle.open span:nth-child(2){opacity:0}.menu-toggle.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}.site-menu{position:fixed;top:0;right:0;z-index:25;width:min(360px,84vw);height:100vh;padding:125px 42px 40px;background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s ease;box-shadow:-12px 0 35px rgba(24,19,19,.08)}.site-menu.open{transform:translateX(0)}.site-menu a{display:block;padding:20px 0;border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--serif);font-size:30px;font-weight:600;text-decoration:none}.site-menu a:hover,.site-menu a.current{color:var(--crimson)}.menu-backdrop{position:fixed;inset:0;z-index:20;background:rgba(24,19,19,.22);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}.menu-backdrop.open{opacity:1;visibility:visible}
.music-title{margin:0;font-family:var(--serif);font-size:clamp(50px,7vw,76px);font-weight:600;line-height:.95;letter-spacing:-1.5px}.music-rule{width:100%;height:1px;margin:22px 0 26px;background:var(--crimson)}

.music-section{margin-top:58px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.section-title{margin:0;color:var(--crimson);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:3px}.section-note{margin:0;color:var(--muted);font-family:var(--sans);font-size:7px;font-weight:500;letter-spacing:1.1px}
.release-track{display:flex;gap:18px;width:100%;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:0 0 12px;scrollbar-width:none}.release-track::-webkit-scrollbar{display:none}.release-card{flex:0 0 clamp(220px,31vw,300px);scroll-snap-align:start;min-width:0}.release-cover{width:100%;aspect-ratio:1/1;border:1px solid var(--line);background:var(--card);overflow:hidden}.release-cover img{width:100%;height:100%;display:block;object-fit:cover}.release-meta{padding:13px 2px 2px}.release-title{margin:0;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.05}.release-artist,.release-credit{margin-top:5px;color:var(--muted);font-family:var(--jp);font-size:10px;line-height:1.55}.release-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.release-link{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:7px;font-weight:600;letter-spacing:1px;text-decoration:none}.release-link:hover{border-color:var(--crimson);color:var(--crimson)}
.rail-controls{display:flex;gap:5px}.rail-button{width:34px;height:30px;border:1px solid var(--crimson);background:transparent;color:var(--crimson);font-family:var(--serif);font-size:19px;cursor:pointer}.rail-button:hover{background:var(--crimson);color:var(--paper)}.rail-button:disabled{opacity:.28}
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#120f0f;border:1px solid var(--line);overflow:hidden}.video-thumb{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:#120f0f;cursor:pointer}.video-thumb img{width:100%;height:100%;display:block;object-fit:cover;opacity:.9}.play-button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--crimson)}.play-button::after{content:"";position:absolute;left:21px;top:15px;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:17px solid var(--paper)}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.video-title{margin:11px 0 0;font-family:var(--jp);font-size:15px;font-weight:500;line-height:1.5}.video-subtitle{margin-top:4px;color:var(--muted);font-family:var(--sans);font-size:8px;letter-spacing:1px;line-height:1.5}
.empty-state{padding:32px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-family:var(--jp);font-size:12px;line-height:1.8}[hidden]{display:none!important}
footer{margin-top:75px;padding:32px 4px 15px;border-top:1px solid var(--line)}.footer-name{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:4px}.footer-role{margin-top:8px;color:var(--muted);font-family:var(--sans);font-size:8px;letter-spacing:3px}.footer-instagram{display:inline-flex;align-items:center;gap:9px;margin-top:18px;color:var(--crimson);font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:2px;text-decoration:none}.footer-instagram-icon{width:22px;height:22px}.footer-instagram-icon rect,.footer-instagram-icon circle{fill:none;stroke:currentColor;stroke-width:1.55}
@media(max-width:650px){main{padding:34px 15px 65px}header{padding:30px 6px 67px}.artist-name{max-width:350px;font-size:clamp(52px,15vw,70px);line-height:.86;letter-spacing:-2px}.name-line{margin-top:20px}.artist-role{margin-top:17px;font-size:11px;letter-spacing:3.3px}.menu-toggle{top:29px;right:18px;width:39px}.site-menu{padding:105px 28px 35px}.site-menu a{font-size:27px}.music{padding:0 6px}.music-section{margin-top:48px}.section-note{display:none}.release-track{gap:13px;margin-right:-21px;padding-right:21px}.release-card{flex-basis:min(72vw,270px)}.video-grid{grid-template-columns:1fr;gap:28px}}

<main>

<div class="name-wrap"><h1 class="artist-name"><span>Akihiro</span><span>Kokufukata</span></h1><div class="name-line"></div></div><div class="artist-role">TRUMPETER / COMPOSER</div>
</header>

<h2 class="music-title" id="musicTitle">Music</h2><div class="music-rule"></div>
<section class="music-section"><div class="section-heading"><h3 class="section-title">VIDEOS</h3><p class="section-note">TAP A THUMBNAIL TO PLAY</p></div><div class="video-grid" id="videoGrid"></div><div class="empty-state" id="videoEmpty" hidden>Videos will be added here.</div></section>
<section class="music-section"><div class="section-heading"><h3 class="section-title">DISCOGRAPHY</h3><div class="rail-controls" id="releaseControls"><button class="rail-button" id="releasePrev" type="button">‹</button><button class="rail-button" id="releaseNext" type="button">›</button></div></div><div class="release-track" id="releaseTrack"></div><div class="empty-state" id="releaseEmpty" hidden>Discography will be added here.</div></section>
</section>
<footer><div class="footer-name">AKIHIRO KOKUFUKATA</div><div class="footer-role">TRUMPETER / COMPOSER</div><a class="footer-instagram" href="https://www.instagram.com/akihiro_kokufukata/" target="_blank" rel="noopener noreferrer"><svg class="footer-instagram-icon" viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="6"></rect><circle cx="16" cy="16" r="5.5"></circle><circle cx="23.2" cy="8.8" r="1.15" style="fill:currentColor;stroke:none"></circle></svg><span>INSTAGRAM</span></a></footer>

<script src="music-data.js"></script>
<script>
const menuToggle=document.getElementById('menuToggle'),siteMenu=document.getElementById('siteMenu'),menuBackdrop=document.getElementById('menuBackdrop');function setMenu(open){menuToggle.classList.toggle('open',open);siteMenu.classList.toggle('open',open);menuBackdrop.classList.toggle('open',open);menuToggle.setAttribute('aria-expanded',String(open))}menuToggle.addEventListener('click',()=>setMenu(!siteMenu.classList.contains('open')));menuBackdrop.addEventListener('click',()=>setMenu(false));
const d=window.MUSIC_DATA||{};function e(v=''){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function u(v=''){try{const x=new URL(String(v).trim(),location.href);return['http:','https:'].includes(x.protocol)?x.href:''}catch{return''}}function y(v=''){try{const x=new URL(String(v).trim()),h=x.hostname.replace(/^www\./,'').toLowerCase();if(h==='youtu.be')return x.pathname.split('/').filter(Boolean)[0]||'';if(['youtube.com','m.youtube.com'].includes(h)){if(x.pathname==='/watch')return x.searchParams.get('v')||'';const p=x.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]||''}}catch{}return''}
const r=Array.isArray(d.releases)?d.releases:[],t=document.getElementById('releaseTrack'),re=document.getElementById('releaseEmpty'),rc=document.getElementById('releaseControls');if(!r.length){t.hidden=true;rc.hidden=true;re.hidden=false}else{t.innerHTML=r.map((x,i)=>{const sp=u(x.spotify||''),ap=u(x.appleMusic||''),mo=u(x.link||'');return`<article class="release-card"><div class="release-cover">${x.cover?`<img src="${e(x.cover)}" alt="${e((x.title||'Recording')+' album cover')}" loading="${i<2?'eager':'lazy'}">`:'<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-family:var(--sans);font-size:8px">COVER</div>'}</div><div class="release-meta"><h4 class="release-title">${e(x.title||'Untitled')}</h4>${x.artist||x.year?`<div class="release-artist">${e([x.artist,x.year].filter(Boolean).join(' · '))}</div>`:''}${x.credit?`<div class="release-credit">${e(x.credit)}</div>`:''}<div class="release-links">${sp?`<a class="release-link" href="${e(sp)}" target="_blank">SPOTIFY ↗</a>`:''}${ap?`<a class="release-link" href="${e(ap)}" target="_blank">APPLE MUSIC ↗</a>`:''}${mo?`<a class="release-link" href="${e(mo)}" target="_blank">MORE ↗</a>`:''}</div></div></article>`}).join('')}
const pr=document.getElementById('releasePrev'),nx=document.getElementById('releaseNext');function st(){const c=t.querySelector('.release-card');return c?c.getBoundingClientRect().width+18:280}pr.addEventListener('click',()=>t.scrollBy({left:-st(),behavior:'smooth'}));nx.addEventListener('click',()=>t.scrollBy({left:st(),behavior:'smooth'}));
const vs=Array.isArray(d.videos)?d.videos:[],g=document.getElementById('videoGrid'),ve=document.getElementById('videoEmpty');if(!vs.length){g.hidden=true;ve.hidden=false}else{g.innerHTML=vs.map((x,i)=>{const id=y(x.youtube||'');if(!id)return'';const th=x.thumbnail||`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;return`<article><div class="video-frame" data-youtube-id="${e(id)}"><button class="video-thumb" type="button"><img src="${e(th)}" alt="${e(x.title||'Video')}" loading="${i<2?'eager':'lazy'}"><span class="play-button"></span></button></div><h4 class="video-title">${e(x.title||'Video')}</h4>${x.subtitle?`<div class="video-subtitle">${e(x.subtitle)}</div>`:''}</article>`}).join('')}g.addEventListener('click',ev=>{const b=ev.target.closest('.video-thumb');if(!b)return;const f=b.closest('.video-frame'),id=f?.dataset.youtubeId;if(id)f.innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
</script>
