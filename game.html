<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>Play Ball — GAME DAY v43</title>
<style>

:root{--paper:#f4efe5;--card:#fffdf6;--ink:#201d1a;--muted:#746f68;--accent:#d9b300;--accent-ink:#574500;--line:#cfc9b9;--dark:#151c21;--shadow:rgba(40,27,20,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:3px solid #277fd0;outline-offset:3px}
main{max-width:980px;padding:30px 24px 92px;margin:auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;font-weight:700;letter-spacing:.21em;color:var(--muted);text-transform:uppercase}
.topline .mark{color:var(--accent-ink)}
.header{padding:62px 4px 28px}
h1{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:-.028em;font-weight:600;line-height:.79;font-size:clamp(64px,12vw,106px);margin:0 0 30px}
.name-line{height:4px;background:repeating-linear-gradient(90deg,#ffd400 0 20px,#111 20px 23px);mask-image:linear-gradient(to bottom,#000 0 60%,rgba(0,0,0,.54) 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0 60%,rgba(0,0,0,.54) 100%)}
.role{font-size:11px;letter-spacing:.32em;font-weight:700;color:var(--accent-ink);margin-top:15px}
.game-head{margin-top:54px;display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap}
.game-head h2{font:600 clamp(40px,7vw,68px)/1 'Cormorant Garamond',Georgia,serif;margin:0}
.eyebrow{font:700 10px/1.4 system-ui,sans-serif;letter-spacing:.23em;color:var(--accent-ink);margin-bottom:9px}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.choice{border:1px solid var(--line);padding:10px 13px;background:transparent;color:var(--ink);font-size:11px;letter-spacing:.09em;font-weight:700;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--card)}
.intro{font-size:13px;line-height:1.9;color:var(--muted);margin:16px 0 21px}
.game-shell{background:#111b26;padding:11px;border:1px solid color-mix(in srgb, var(--accent) 75%, #111);box-shadow:0 10px 25px var(--shadow)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#f8f1df;font:700 11px/1 system-ui,sans-serif;letter-spacing:.09em;padding:5px 5px 13px}
.hud-left{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.hud-right{display:flex;align-items:center;gap:12px}
.lamp-group{display:flex;gap:4px;align-items:center}.lamp{width:8px;height:8px;border:1px solid #81908b;background:#334046;border-radius:100%}.lamp.on.strike{background:#e4ad36;border-color:#e4ad36}.lamp.on.out{background:#ed5751;border-color:#ed5751}
.pitch-count{font-size:10px;color:#a6b6c4}
.field{position:relative;aspect-ratio:1.69;width:100%;min-height:285px;max-height:545px;background:#164026 url('assets/stadium.jpg') center center/cover no-repeat;overflow:hidden;isolation:isolate;touch-action:pan-y;cursor:crosshair;user-select:none}
.field.batting{touch-action:none}
.field::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(1,15,27,.12),transparent 50%,rgba(15,11,8,.10));pointer-events:none}
.pitcher{position:absolute;height:29%;width:auto;left:50%;bottom:37%;transform:translateX(-50%);filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));pointer-events:none;z-index:2;transition:transform .16s}
.pitcher.release{transform:translateX(-50%) rotate(-8deg) scale(1.025)}
.pitch-ball,.batted-ball{position:absolute;z-index:5;pointer-events:none;object-fit:contain;will-change:transform,left,top;transform:translate(-50%,-50%)}
.pitch-ball{width:40px;height:40px;opacity:0}
.batted-ball{width:45px;height:45px;opacity:0;z-index:7}
.bat{position:absolute;width:28%;max-width:174px;height:auto;right:-1.5%;bottom:-16%;transform:rotate(-6deg);transform-origin:23% 88%;transition:transform .19s cubic-bezier(.2,0,.3,1);z-index:4;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2));pointer-events:none}
.bat.swing{transform:rotate(-77deg) translate(-12px,-6px)}
.plate-indicator{position:absolute;width:70px;height:70px;left:50%;top:83%;transform:translate(-50%,-50%);border:1px solid rgba(255,245,210,.55);border-radius:50%;box-shadow:0 0 0 9px rgba(255,255,255,.09);opacity:.55;z-index:3;pointer-events:none;transition:border-color .12s,box-shadow .12s,opacity .12s}
.plate-indicator.ready{border-color:#f5c14b;opacity:1;box-shadow:0 0 0 9px rgba(255,208,76,.19),0 0 15px rgba(255,208,76,.58)}
.field-caption{position:absolute;top:12px;left:12px;z-index:8;font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.1em;color:#f5f4ef;text-shadow:0 2px 5px #000;pointer-events:none;background:rgba(4,16,17,.40);padding:8px 10px}
.flick-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;opacity:1;transition:opacity .2s}
.flick-guide span{background:rgba(4,18,26,.78);color:#fff;border-radius:100px;padding:10px 15px;font:700 12px/1.5 system-ui,sans-serif;letter-spacing:.07em;box-shadow:0 3px 12px #0005}
.field.playing .flick-guide{opacity:0}
.aim-arrow{position:absolute;z-index:9;height:3px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,#e7c660);pointer-events:none;opacity:0;border-radius:3px;box-shadow:0 0 10px #f1df92}
.aim-arrow::after{content:"";position:absolute;right:-2px;top:-5px;width:10px;height:10px;border-right:3px solid #f8d979;border-top:3px solid #f8d979;transform:rotate(45deg)}
.field-feedback{position:absolute;z-index:12;top:27%;left:50%;transform:translate(-50%,-10px) scale(.92);opacity:0;color:white;background:rgba(9,13,16,.81);border-bottom:3px solid #f7bd3a;box-shadow:0 7px 30px #0004;padding:13px 21px;font:900 clamp(22px,5vw,39px)/1.1 system-ui,sans-serif;letter-spacing:.06em;text-align:center;white-space:nowrap;pointer-events:none;transition:opacity .2s,transform .2s}
.field-feedback.show{opacity:1;transform:translate(-50%,0) scale(1)}
.field-feedback small{display:block;font-size:12px;letter-spacing:.03em;font-weight:600;margin-top:7px}
.field-toast{position:absolute;z-index:11;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(9,17,24,.84);color:#f7efd8;font:700 10px/1.4 system-ui,sans-serif;padding:7px 10px;border-radius:20px;white-space:nowrap;pointer-events:none}
.actionbar{display:flex;gap:12px;justify-content:space-between;align-items:center;background:#18252e;padding:14px 8px 5px;color:#e7e5de;flex-wrap:wrap}
.pitch-btn{border:0;background:var(--accent);color:#19191b;font:800 12px/1.3 system-ui,sans-serif;letter-spacing:.17em;padding:15px 23px;min-width:140px;cursor:pointer}
.pitch-btn:disabled{background:#778087;color:#c8cdcf;cursor:default}
.reset-btn{background:none;border:1px solid #64717b;padding:12px 15px;color:#fff;font:700 10px/1 system-ui,sans-serif;letter-spacing:.08em;cursor:pointer}
.action-hint{flex:1;min-width:160px;max-width:350px;font:500 11px/1.6 system-ui,sans-serif;color:#c9d4da}
.result-strip{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 4px 0;color:#d2d8dc;flex-wrap:wrap;font:600 11px/1.5 system-ui,sans-serif}.result-text{color:#fff;font-weight:800;letter-spacing:.06em}
.instructions{margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.instruction{border-top:2px solid var(--line);padding-top:13px;font-size:12px;line-height:1.6;color:var(--muted)}.instruction b{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}
.footnote{margin-top:25px;color:var(--muted);font-size:11px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
body.red-sox{--paper:#fff;--card:#fffafa;--ink:#244a70;--muted:#66778a;--accent:#e31837;--accent-ink:#d11b33;--line:#cbd6df}
body.red-sox .name-line{background:repeating-linear-gradient(90deg,#e31837 0 36px,#244a70 36px 72px)}
body.red-sox .pitch-btn{color:#fff}
body.red-sox .field-feedback{border-color:#e31837}
@media(max-width:620px){
 main{padding:20px 12px 70px}.header{padding-top:42px;padding-bottom:24px}.game-head{margin-top:38px}.game-shell{padding:7px}.field{min-height:290px;aspect-ratio:1.2;background-position:center center;background-size:cover}.hud{font-size:10px;padding:7px 1px 12px}.hud-left{gap:9px}.hud-right{gap:6px}.pitch-count{display:none}.pitcher{height:26%;bottom:36%}.pitch-ball{width:36px;height:36px}.bat{width:37%;bottom:-12%;right:-9%}.plate-indicator{top:81%;width:55px;height:55px}.field-caption{font-size:9px}.flick-guide span{font-size:11px}.actionbar{gap:8px}.pitch-btn{min-width:126px;padding:13px 15px}.reset-btn{padding:11px 9px}.result-strip{font-size:10px}.instructions{grid-template-columns:repeat(2,1fr)}.role{font-size:9px;letter-spacing:.23em}.filters{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* GAME DAY v29 • scoreboard + pitch variability */
.score-strip{display:flex;align-items:stretch;gap:0;background:#0b131b;border:1px solid #44515b;border-bottom:0;color:#fff;font-family:system-ui,sans-serif;min-height:61px}
.team-score,.game-stat,.score-inning{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-right:1px solid #44515b;padding:7px 12px;min-width:0}
.team-score{flex-direction:row;gap:8px;min-width:125px}.team-score strong{font-size:30px;color:#f0c34c;line-height:1}
.score-tag{font:700 9px/1.3 system-ui,sans-serif;letter-spacing:.06em;color:#b6c6cf}
.game-stat{flex:1}.game-stat strong{font-size:21px;line-height:1.05}.game-stat span{font:700 8px/1 system-ui,sans-serif;letter-spacing:.14em;color:#b6c6cf}
.score-inning{min-width:92px;border:0;align-items:flex-end;gap:6px;font:700 10px/1 system-ui,sans-serif}.score-inning small{color:#b6c6cf;font-size:9px}
.hud{padding:9px 5px 13px;min-height:54px}.hud-left{gap:8px}.hud-left>span{font-size:9px}
.lamp.on.ball-count{background:#3ab875;border-color:#3ab875}
.bases{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(2,12px);gap:5px;transform:rotate(45deg) scale(.8);margin:4px 14px 4px 3px;flex:0 0 auto}
.base{width:13px;height:13px;background:#3e535f;border:1px solid #93a7ae}
.base.on{background:#f4c54d;border-color:#fff;box-shadow:0 0 9px #f5ce6080}
#base2{grid-column:1;grid-row:1}#base1{grid-column:2;grid-row:1}#base3{grid-column:1;grid-row:2}
.strike-zone{position:absolute;left:40.5%;width:19%;top:73%;height:14%;border:1px dashed rgba(255,255,255,.64);background:rgba(255,255,255,.025);z-index:2;pointer-events:none;transition:border-color .12s}
.strike-zone span{position:absolute;bottom:100%;right:0;color:#fff;font:700 7px/1 system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 1px 5px #000;padding-bottom:3px;white-space:nowrap}
.field .plate-indicator{width:45px;height:45px;border-color:rgba(246,238,197,.35);box-shadow:none;opacity:.5}
.field .plate-indicator.ready{border-color:#f5c14b;box-shadow:0 0 0 10px rgba(255,208,76,.11),0 0 18px rgba(255,208,76,.4)}
.batted-ball{filter:drop-shadow(1px 2px 2px #0007)}
.pitch-brief{font-weight:700;color:#f4c64c}
.field-toast{font-size:10px}
body.red-sox .score-strip{border-color:#42647a}
@media(max-width:620px){
 .score-strip{min-height:54px}.team-score{min-width:100px;padding:7px 6px;gap:5px}.team-score strong{font-size:26px}.score-tag{font-size:7px}.game-stat{padding:6px 4px}.game-stat strong{font-size:18px}.game-stat span{font-size:7px}.score-inning{min-width:71px;font-size:8px;padding:6px 5px}.score-inning small{font-size:7px}
 .hud-left{gap:5px}.hud-left>span{font-size:8px}.lamp{width:7px;height:7px}.lamp-group{gap:3px}
 .bases{margin-right:9px;transform:rotate(45deg) scale(.68)}.strike-zone span{font-size:6px}
 .intro{font-size:12px}
}
@media(max-width:370px){.game-stat:nth-child(4){display:none}.team-score{min-width:83px}.score-inning{min-width:63px}}

.result-strip #pitchReadout{color:#eac65c;font:700 10px/1.5 system-ui,sans-serif;letter-spacing:.04em}

/* v30: remove obsolete guide overlays, even if older styles exist. */
.flick-guide,.field-toast{display:none!important}


/* GAME DAY v36 — Ballpark line score & rectangle-only strike zone */
.score-strip,.team-score,.game-stat,.score-inning{display:none!important}
.ballpark-board{font-family:system-ui,Arial,sans-serif;background:#0b151a;border:2px solid #536252;color:#d9e9d9;box-shadow:inset 0 0 0 3px #142622,0 1px 6px #0008;margin:0 0 13px;padding:9px 11px 8px}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;padding:0 5px 8px;border-bottom:1px solid #41564d}
.board-brand{font:800 10px/1 system-ui,sans-serif;letter-spacing:.17em;color:#e9c36c;display:flex;align-items:center;gap:8px}
.board-brand small{color:#9dafaa;letter-spacing:.06em;font-size:9px;font-weight:600}
.board-light{display:inline-block;width:8px;height:8px;background:#e9c36c;border-radius:50%;box-shadow:0 0 9px #e9c36c88}
.board-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:#c1d0c4;font-weight:700;white-space:nowrap}
.board-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#60736b #0b151a;-webkit-overflow-scrolling:touch}
.line-grid{display:grid;grid-template-columns:minmax(62px,1.8fr) repeat(9,minmax(18px,.75fr)) repeat(3,minmax(21px,1fr));min-width:333px;margin-top:7px;align-items:stretch}
.line-grid>div{min-width:0;text-align:center;border-right:1px solid #293d36;border-bottom:1px solid #293d36;min-height:31px;display:flex;align-items:center;justify-content:center}
.line-grid>div:nth-child(13n){border-right:0}
.line-grid .column-head{font:800 10px/1 system-ui,sans-serif;color:#95b5a3;min-height:24px}
.line-grid .column-head.active{color:#ffe08a;box-shadow:inset 0 -2px 0 #d4a946}
.line-grid .g-label{justify-content:flex-start;padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.line-grid .team-name{color:#f9e8b6;font:800 10px/1 system-ui,sans-serif;letter-spacing:.025em}

.line-grid .score-cell,.line-grid .g-total.value{font:700 17px/1 'Courier New',monospace;color:#ecf2db;text-shadow:0 0 7px #c1dfba38}
.line-grid .score-cell.future{color:#4b675b;font-size:14px}
.line-grid .g-total.value{background:#203729;color:#fbe6a2;font-size:19px}
.line-grid .defense-cell{font:600 13px/1 monospace;color:#476056}

.board-footer strong{color:#edd6a1;margin-left:3px}

body.red-sox .ballpark-board{border-color:#69806f}
@media(max-width:620px){
 .ballpark-board{padding:8px 7px 7px;margin-bottom:10px}
 .board-header{padding:0 2px 6px;align-items:flex-start}

}


/* GAME DAY v36 — vivid arcade baseball feedback (original styling) */
.field-feedback {
  --flash:#f2df7b;
  --flash-border:#ffe58c;
  --flash-dark:#74552a;
  color:var(--flash);
  background:linear-gradient(170deg,rgba(14,30,49,.91),rgba(8,15,33,.95));
  border:2px solid var(--flash-border);
  border-bottom:4px solid var(--flash-border);
  border-radius:12px;
  padding:12px 19px 11px;
  font-weight:1000;
  letter-spacing:.035em;
  font-size:clamp(23px,6.5vw,47px);
  text-shadow:0 2px 0 var(--flash-dark), 0 3px 5px rgba(0,0,0,.85), 0 0 18px color-mix(in srgb,var(--flash) 45%, transparent);
  box-shadow:0 8px 28px #0009, inset 0 1px 0 #ffffff35, 0 0 17px color-mix(in srgb,var(--flash) 40%, transparent);
  max-width:calc(100% - 14px);
  line-height:1.06;
  z-index:15;
  -webkit-text-stroke:.45px rgba(13,30,45,.52);
}
.field-feedback small {
  font-size:12px;
  font-weight:900;
  letter-spacing:.10em;
  color:#fff;
  text-shadow:0 1px 5px #000;
  -webkit-text-stroke:0;
}
.field-feedback[data-result="strike"]{--flash:#ffe65d;--flash-border:#ffb92d;--flash-dark:#93621e}
.field-feedback[data-result="strikeout"]{--flash:#ff6472;--flash-border:#ff334d;--flash-dark:#89252f}
.field-feedback[data-result="ball"]{--flash:#73dcff;--flash-border:#34a8ec;--flash-dark:#28668a}
.field-feedback[data-result="walk"]{--flash:#79eddd;--flash-border:#2cd7b5;--flash-dark:#1b776b}
.field-feedback[data-result="foul"]{--flash:#c9a1ff;--flash-border:#986ce4;--flash-dark:#68448d}
.field-feedback[data-result="out"]{--flash:#ffab75;--flash-border:#ef664a;--flash-dark:#923c22}
.field-feedback[data-result="hit"]{--flash:#b6f56b;--flash-border:#72d742;--flash-dark:#508335}
.field-feedback[data-result="double"]{--flash:#56e8ff;--flash-border:#3d8dfb;--flash-dark:#24618f}
.field-feedback[data-result="homer"]{
  --flash:#fff2a8; --flash-border:#ffda45; --flash-dark:#9e3b60;
  color:#fff0a1;
  background:linear-gradient(130deg,#ba235c 0%,#a31d63 42%,#5136a3 100%);
  box-shadow:0 8px 29px #0009, inset 0 1px 0 #ffffff88, 0 0 25px #ff6c95af;
  text-shadow:0 2px 0 #a73d55,0 3px 6px #311a63,0 0 19px #ffe1a4;
}
.field-feedback.show { animation:result-pop-v32 240ms cubic-bezier(.15,1.2,.3,1) both; }
@keyframes result-pop-v32 {
  0% { opacity:0; transform:translate(-50%,-6px) scale(.74); }
  75% { opacity:1; transform:translate(-50%,0) scale(1.07); }
  100% { opacity:1; transform:translate(-50%,0) scale(1); }
}
.result-text[data-result="strike"] {color:#ffe65d}
.result-text[data-result="strikeout"] {color:#ff6472}
.result-text[data-result="ball"] {color:#73dcff}
.result-text[data-result="walk"] {color:#79eddd}
.result-text[data-result="foul"] {color:#c9a1ff}
.result-text[data-result="out"] {color:#ffab75}
.result-text[data-result="hit"] {color:#b6f56b}
.result-text[data-result="double"] {color:#56e8ff}
.result-text[data-result="homer"] {color:#ffe46f}
body.red-sox .field-feedback {border-color:var(--flash-border)}
@media(prefers-reduced-motion:reduce) { .field-feedback.show {animation:none;} }
@media(max-width:380px) { .field-feedback {padding:10px 10px;font-size:clamp(21px,6.4vw,35px)} }


/* GAME DAY v35: red outline appears only at the optimal impact timing. */
.pitch-ball{transition:filter 45ms linear}
.pitch-ball.sweet-spot{
  filter:drop-shadow(-2px 0 0 #f3283e) drop-shadow(2px 0 0 #f3283e)
         drop-shadow(0 -2px 0 #f3283e) drop-shadow(0 2px 0 #f3283e)
         drop-shadow(0 0 5px rgba(255,28,45,.9));
}
.pitch-halo{
  position:absolute;z-index:6;pointer-events:none;width:40px;height:40px;
  border:2px solid #ff2943;border-radius:50%;opacity:0;
  box-shadow:0 0 0 1px rgba(255,218,224,.85),0 0 10px rgba(255,38,58,.7);
  will-change:transform,left,top;
}
.pitch-halo.visible{opacity:1}
.aim-arrow{height:5px;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 10px #f1df92}

/* GAME DAY v38 — the ballpark board wears Red Sox navy, vivid red & white. */
body.red-sox .ballpark-board {
  background:linear-gradient(140deg,#193C5D 0%,#0E2945 100%);

/* GAME DAY v43: transparent fireworks over the stadium; home runs launch into the night sky. */
.fireworks-effect{
  position:absolute;left:5%;top:4%;width:90%;height:74%;object-fit:contain;
  z-index:11;pointer-events:none;user-select:none;opacity:0;
  transform:scale(.62);transform-origin:center 55%;
  will-change:transform,opacity;filter:drop-shadow(0 0 5px rgba(255,255,255,.18));
}
.fireworks-effect.active.homer{animation:fireworks-homer-v41 1.9s cubic-bezier(.16,.7,.27,1) both}
.fireworks-effect.active.score{animation:fireworks-score-v41 1.5s cubic-bezier(.16,.7,.27,1) both}
@keyframes fireworks-homer-v41{
  0%{opacity:0;transform:scale(.45) rotate(-3deg)}
  18%{opacity:1;transform:scale(.83) rotate(-1deg)}
  54%{opacity:1;transform:scale(1.04) rotate(1deg)}
  80%{opacity:.78;transform:scale(1.1) rotate(2deg)}
  100%{opacity:0;transform:scale(1.16) rotate(3deg)}
}
@keyframes fireworks-score-v41{
  0%{opacity:0;transform:scale(.5)}
  22%{opacity:.8;transform:scale(.73)}
  58%{opacity:.85;transform:scale(.9)}
  100%{opacity:0;transform:scale(1)}
}
.field-feedback[data-result="doubleplay"]{
  --flash:#ffe0a2;--flash-border:#ff905f;--flash-dark:#913c27;
  background:linear-gradient(125deg,#77263c,#41214c);
}
.result-text[data-result="doubleplay"]{color:#ff9f70}
@media(prefers-reduced-motion:reduce){
  .fireworks-effect.active.homer,.fireworks-effect.active.score{animation:none;opacity:.8;transform:scale(.95)}
}

/* Small embedded game: no duplicated artist masthead or footer. */
html,body{margin:0;padding:0;overflow-x:hidden;background:transparent}
main{max-width:980px;margin:0;padding:0!important}
.game-shell{margin:0;box-shadow:none}
@media (max-width:620px){main{padding:0!important}.game-shell{padding:7px}}
</style>
</head>

<script src="game.js"></script>
<script>
(() => {
  // Height bridge prevents nested scrolling when used inside the main website.
  function sendHeight() {
    const main=document.querySelector('main');
    if (!main || window.parent===window) return;
    const height=Math.ceil(main.getBoundingClientRect().height)+2;
    window.parent.postMessage({type:'ak-play-ball-height-v44',height},location.origin==='null'?'*':location.origin);
  }
  window.addEventListener('load',sendHeight);
  window.addEventListener('resize',sendHeight);
  if ('ResizeObserver' in window) new ResizeObserver(sendHeight).observe(document.querySelector('main'));
  requestAnimationFrame(sendHeight);
})();
</script>
